<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>THE LAST WALL</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#05070a;
    font-family:"Courier New",monospace;
    color:#d6cfb6;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
}

canvas{
    display:block;
    width:100%;
    height:100%;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
}

.overlay{
    position:fixed;
    inset:0;
    z-index:10;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            ellipse at center,
            rgba(15,20,25,.82),
            rgba(2,3,5,.97)
        );

    text-align:center;
    padding:20px;
}

.overlay.hidden{
    display:none;
}

h1{
    margin:0 0 18px;
    font-size:clamp(32px,8vw,72px);
    font-weight:normal;
    letter-spacing:.15em;
    color:#d9d0ae;
    text-shadow:
        3px 3px #000,
        0 0 30px rgba(170,100,50,.35);
}

.subtitle{
    max-width:650px;
    line-height:1.6;
    font-size:clamp(13px,2.5vw,18px);
    color:#aaa58f;
    margin-bottom:25px;
}

button{
    font-family:inherit;
    font-weight:bold;

    padding:14px 30px;

    color:#e1d5ad;
    background:
        linear-gradient(
            #343738,
            #17191a
        );

    border:2px solid #69614e;

    cursor:pointer;

    letter-spacing:.1em;
    font-size:16px;

    box-shadow:
        0 5px 0 #080909,
        0 0 18px rgba(0,0,0,.7);
}

button:hover{
    color:#fff1bc;
    border-color:#c4a45c;
}

button:active{
    transform:translateY(3px);
    box-shadow:
        0 2px 0 #080909;
}

#touchControls{
    position:fixed;
    left:0;
    right:0;
    bottom:0;

    z-index:5;

    display:none;
    justify-content:space-between;

    padding:
        10px
        15px
        calc(15px + env(safe-area-inset-bottom));
}

.touchGroup{
    display:flex;
    gap:10px;
}

.touchButton{
    width:65px;
    height:65px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#ddd2b1;

    background:rgba(20,22,22,.75);
    border:2px solid rgba(190,170,110,.5);

    font-size:24px;
}

.fireButton{
    width:85px;
    height:85px;

    font-size:14px;

    background:rgba(100,30,20,.65);
}
</style>
</head>

<body>

<canvas id="gameCanvas"></canvas>


<!-- ================= MENU ================= -->

<div id="mainMenu" class="overlay">

    <h1>THE LAST WALL</h1>

    <div class="subtitle">
        Из тёмного леса идут орки.<br>
        Ты — последний лучник на стене.<br><br>

        Наводи мышь и стреляй по врагам.<br>
        A / D или ← / → — движение по стене.<br>
        Space — выстрел.
    </div>

    <button id="startButton">
        DEFEND THE WALL
    </button>

</div>


<!-- ================= TOUCH ================= -->

<div id="touchControls">

    <div class="touchGroup">
        <div id="leftButton" class="touchButton">◀</div>
        <div id="rightButton" class="touchButton">▶</div>
    </div>

    <div class="touchGroup">
        <div id="fireButton" class="touchButton fireButton">
            FIRE
        </div>
    </div>

</div>


<script>
"use strict";


/* =========================================================
   CANVAS
   ========================================================= */

const canvas =
    document.getElementById("gameCanvas");

const ctx =
    canvas.getContext("2d");

const menu =
    document.getElementById("mainMenu");

const startButton =
    document.getElementById("startButton");


/* =========================================================
   GAME STATE
   ========================================================= */

let width = 0;
let height = 0;

let scale = 1;

let gameStarted = false;
let gameOver = false;

let wave = 1;

let wallHP = 1000;
let maxWallHP = 1000;

let gold = 0;
let score = 0;
let kills = 0;

let spawnTimer = 0;

let mouseX = 0;
let mouseY = 0;

let mouseDown = false;

let moveLeft = false;
let moveRight = false;

let lastTime = performance.now();


/* =========================================================
   PLAYER
   ========================================================= */

const player = {

    x:0,

    y:0,

    speed:420,

    damage:20,

    fireCooldown:0,

    fireRate:.48,

    drawPower:0

};


/* =========================================================
   ENEMIES
   ========================================================= */

const enemyTypes = {

    normal:{
        hp:28,
        speed:52,
        damage:5,
        attackTime:1.3,
        size:1,
        color:"#657451"
    },

    fast:{
        hp:16,
        speed:88,
        damage:3,
        attackTime:1,
        size:.8,
        color:"#7d804b"
    },

    heavy:{
        hp:85,
        speed:32,
        damage:16,
        attackTime:1.7,
        size:1.3,
        color:"#4e5b46"
    },

    elite:{
        hp:140,
        speed:42,
        damage:24,
        attackTime:1.5,
        size:1.4,
        color:"#625642"
    }

};


let enemies = [];
let arrows = [];

let particles = [];


/* =========================================================
   WAVES
   ========================================================= */

let waveEnemies = 0;
let waveSpawned = 0;

let waveActive = false;


function beginWave(number){

    wave = number;

    waveEnemies =
        5 + number * 3;

    waveSpawned = 0;

    spawnTimer = .5;

    waveActive = true;

}


function chooseEnemy(){

    const r = Math.random();

    if(wave >= 8 && r < .08)
        return "elite";

    if(wave >= 5 && r < .20)
        return "heavy";

    if(wave >= 3 && r < .35)
        return "fast";

    return "normal";
}


function spawnEnemy(){

    if(waveSpawned >= waveEnemies)
        return;

    const type =
        chooseEnemy();

    const data =
        enemyTypes[type];

    enemies.push({

        type:type,

        x:
            width / 2 +
            (Math.random() - .5) * 80,

        y:
            height * .56,

        hp:data.hp *
            (1 + wave * .05),

        maxHP:data.hp *
            (1 + wave * .05),

        speed:data.speed *
            (1 + wave * .025),

        damage:data.damage,

        attackTime:data.attackTime,

        attackTimer:0,

        size:data.size,

        dead:false

    });

    waveSpawned++;

}


/* =========================================================
   START GAME
   ========================================================= */

function startGame(){

    /* Important:
       this function is completely independent
       from the rendering loop.
    */

    gameStarted = true;
    gameOver = false;

    menu.classList.add("hidden");

    resetGame();

    beginWave(1);

}


startButton.addEventListener(
    "click",
    startGame
);


/* =========================================================
   RESET
   ========================================================= */

function resetGame(){

    wallHP = 1000;
    maxWallHP = 1000;

    gold = 0;
    score = 0;
    kills = 0;

    enemies = [];
    arrows = [];
    particles = [];

    player.x =
        width / 2;

    player.y =
        height * .735;

    player.fireCooldown = 0;

}


/* =========================================================
   RESIZE
   ========================================================= */

function resize(){

    width =
        Math.max(
            320,
            window.innerWidth
        );

    height =
        Math.max(
            240,
            window.innerHeight
        );

    scale =
        Math.max(
            2,
            Math.round(
                Math.min(width,height) / 240
            )
        );

    canvas.width =
        width;

    canvas.height =
        height;

    player.y =
        height * .735;

    if(!gameStarted){

        player.x =
            width / 2;

    }

}


window.addEventListener(
    "resize",
    resize
);


/* =========================================================
   INPUT
   ========================================================= */

window.addEventListener(
    "keydown",
    e=>{

        if(e.code === "ArrowLeft" ||
           e.code === "KeyA"){

            moveLeft = true;
            e.preventDefault();

        }

        if(e.code === "ArrowRight" ||
           e.code === "KeyD"){

            moveRight = true;
            e.preventDefault();

        }

        if(e.code === "Space"){

            e.preventDefault();

            shoot();

        }

    }
);


window.addEventListener(
    "keyup",
    e=>{

        if(e.code === "ArrowLeft" ||
           e.code === "KeyA"){

            moveLeft = false;

        }

        if(e.code === "ArrowRight" ||
           e.code === "KeyD"){

            moveRight = false;

        }

    }
);


canvas.addEventListener(
    "mousemove",
    e=>{

        mouseX =
            e.clientX;

        mouseY =
            e.clientY;

    }
);


canvas.addEventListener(
    "mousedown",
    e=>{

        if(e.button === 0){

            mouseDown = true;

        }

    }
);


window.addEventListener(
    "mouseup",
    e=>{

        if(e.button === 0){

            if(mouseDown)
                shoot();

            mouseDown = false;

        }

    }
);


/* =========================================================
   TOUCH
   ========================================================= */

function holdButton(
    element,
    down,
    up
){

    element.addEventListener(
        "pointerdown",
        e=>{

            e.preventDefault();

            down();

        }
    );

    element.addEventListener(
        "pointerup",
        e=>{

            e.preventDefault();

            up();

        }
    );

    element.addEventListener(
        "pointercancel",
        up
    );

}


holdButton(
    document.getElementById("leftButton"),

    ()=>{
        moveLeft = true;
    },

    ()=>{
        moveLeft = false;
    }
);


holdButton(
    document.getElementById("rightButton"),

    ()=>{
        moveRight = true;
    },

    ()=>{
        moveRight = false;
    }
);


document
.getElementById("fireButton")
.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        shoot();

    }
);


if(
    "ontouchstart" in window ||
    navigator.maxTouchPoints > 0
){

    document
        .getElementById("touchControls")
        .style.display = "flex";

}


/* =========================================================
   SHOOT
   ========================================================= */

function shoot(){

    if(!gameStarted)
        return;

    if(gameOver)
        return;

    if(player.fireCooldown > 0)
        return;

    const sx =
        player.x + 45;

    const sy =
        player.y - 25;

    let dx =
        mouseX - sx;

    let dy =
        mouseY - sy;

    const len =
        Math.hypot(dx,dy) || 1;

    dx /= len;
    dy /= len;

    arrows.push({

        x:sx,
        y:sy,

        vx:dx * 850,
        vy:dy * 850,

        life:2,

        damage:player.damage

    });

    player.fireCooldown =
        player.fireRate;

}


/* =========================================================
   UPDATE
   ========================================================= */

function update(dt){

    if(!gameStarted)
        return;

    if(gameOver)
        return;


    /* player movement */

    let direction = 0;

    if(moveLeft)
        direction--;

    if(moveRight)
        direction++;

    player.x +=
        direction *
        player.speed *
        dt;

    player.x =
        Math.max(
            70,
            Math.min(
                width - 70,
                player.x
            )
        );


    /* cooldown */

    if(player.fireCooldown > 0){

        player.fireCooldown -= dt;

    }


    /* spawn */

    if(waveActive){

        spawnTimer -= dt;

        if(
            spawnTimer <= 0 &&
            waveSpawned < waveEnemies
        ){

            spawnEnemy();

            spawnTimer =
                Math.max(
                    .3,
                    .95 - wave * .035
                );

        }

        if(
            waveSpawned >= waveEnemies &&
            enemies.filter(
                e=>!e.dead
            ).length === 0
        ){

            waveActive = false;

            setTimeout(
                ()=>{

                    if(wave < 10){

                        wallHP =
                            Math.min(
                                maxWallHP,
                                wallHP + maxWallHP*.2
                            );

                        beginWave(
                            wave + 1
                        );

                    }else{

                        gameOver = true;

                    }

                },
                1200
            );

        }

    }


    /* enemies */

    for(const enemy of enemies){

        if(enemy.dead)
            continue;


        const wallY =
            height * .735;


        if(enemy.y < wallY){

            enemy.y +=
                enemy.speed *
                dt;

            if(enemy.y > wallY)
                enemy.y = wallY;

        }else{

            enemy.attackTimer -= dt;

            if(enemy.attackTimer <= 0){

                wallHP -=
                    enemy.damage;

                enemy.attackTimer =
                    enemy.attackTime;

                if(wallHP <= 0){

                    wallHP = 0;

                    gameOver = true;

                }

            }

        }

    }


    /* arrows */

    for(
        let i=arrows.length-1;
        i>=0;
        i--
    ){

        const arrow =
            arrows[i];

        arrow.x +=
            arrow.vx * dt;

        arrow.y +=
            arrow.vy * dt;

        arrow.life -= dt;


        for(const enemy of enemies){

            if(enemy.dead)
                continue;


            const dx =
                arrow.x -
                enemy.x;

            const dy =
                arrow.y -
                (enemy.y - 25);

            const distance =
                Math.hypot(dx,dy);


            if(
                distance <
                30 * enemy.size
            ){

                enemy.hp -=
                    arrow.damage;

                arrow.life = 0;

                if(enemy.hp <= 0){

                    enemy.dead = true;

                    kills++;

                    score +=
                        enemy.type === "elite"
                        ? 100
                        : enemy.type === "heavy"
                        ? 50
                        : enemy.type === "fast"
                        ? 30
                        : 20;

                    gold +=
                        enemy.type === "elite"
                        ? 30
                        : enemy.type === "heavy"
                        ? 15
                        : 8;

                }

                break;

            }

        }

    }


    arrows =
        arrows.filter(
            a=>
                a.life > 0 &&
                a.x > -100 &&
                a.x < width + 100 &&
                a.y > -100 &&
                a.y < height + 100
        );


    enemies =
        enemies.filter(
            e=>
                !e.dead ||
                Math.random() > .02
        );

}


/* =========================================================
   PIXEL DRAW HELPERS
   ========================================================= */

function pixelRect(
    x,y,w,h,color
){

    ctx.fillStyle = color;

    ctx.fillRect(
        Math.round(x),
        Math.round(y),
        Math.max(1,Math.round(w)),
        Math.max(1,Math.round(h))
    );

}


/* =========================================================
   BACKGROUND
   ========================================================= */

function drawBackground(){

    /* sky */

    ctx.fillStyle =
        "#080d15";

    ctx.fillRect(
        0,
        0,
        width,
        height * .55
    );


    /* moon */

    const moonX =
        width * .80;

    const moonY =
        height * .16;

    ctx.fillStyle =
        "#b9c0bd";

    pixelRect(
        moonX-22,
        moonY-30,
        44,
        60,
        "#b9c0bd"
    );

    pixelRect(
        moonX-32,
        moonY-20,
        64,
        40,
        "#b9c0bd"
    );


    pixelRect(
        moonX-15,
        moonY-12,
        8,
        8,
        "#8c9592"
    );

    pixelRect(
        moonX+8,
        moonY+10,
        7,
        7,
        "#8c9592"
    );


    /* stars */

    for(let i=0;i<60;i++){

        const x =
            (i * 137) % width;

        const y =
            30 +
            ((i * 71) % Math.floor(height*.38));

        pixelRect(
            x,
            y,
            i%5===0?3:2,
            i%5===0?3:2,
            i%3===0
                ? "#9ba5a6"
                : "#566267"
        );

    }


    /* mountains */

    ctx.fillStyle =
        "#101923";

    ctx.beginPath();

    ctx.moveTo(
        0,
        height*.52
    );

    ctx.lineTo(
        width*.12,
        height*.37
    );

    ctx.lineTo(
        width*.22,
        height*.49
    );

    ctx.lineTo(
        width*.36,
        height*.33
    );

    ctx.lineTo(
        width*.50,
        height*.49
    );

    ctx.lineTo(
        width*.67,
        height*.35
    );

    ctx.lineTo(
        width*.82,
        height*.48
    );

    ctx.lineTo(
        width,
        height*.38
    );

    ctx.lineTo(
        width,
        height*.60
    );

    ctx.lineTo(
        0,
        height*.60
    );

    ctx.closePath();

    ctx.fill();


    /* ground */

    ctx.fillStyle =
        "#151a15";

    ctx.fillRect(
        0,
        height*.52,
        width,
        height*.48
    );


    /* ground pixels */

    for(let i=0;i<260;i++){

        const x =
            Math.random()*width;

        const y =
            height*.54 +
            Math.random()*height*.36;

        pixelRect(
            x,
            y,
            3 + Math.random()*8,
            2 + Math.random()*5,
            i%2
                ? "#20251c"
                : "#282b20"
        );

    }


    /* road */

    ctx.fillStyle =
        "#282720";

    ctx.beginPath();

    ctx.moveTo(
        width*.44,
        height*.55
    );

    ctx.lineTo(
        width*.56,
        height*.55
    );

    ctx.lineTo(
        width*.74,
        height*.78
    );

    ctx.lineTo(
        width*.26,
        height*.78
    );

    ctx.closePath();

    ctx.fill();


    /* trees */

    drawTree(
        width*.10,
        height*.60,
        1
    );

    drawTree(
        width*.18,
        height*.56,
        .8
    );

    drawTree(
        width*.28,
        height*.61,
        .7
    );

    drawTree(
        width*.90,
        height*.60,
        1
    );

    drawTree(
        width*.82,
        height*.57,
        .85
    );

    drawTree(
        width*.72,
        height*.61,
        .7
    );

}


function drawTree(
    x,y,s
){

    pixelRect(
        x-6*s,
        y-55*s,
        12*s,
        55*s,
        "#29251d"
    );

    pixelRect(
        x-32*s,
        y-85*s,
        64*s,
        25*s,
        "#111b16"
    );

    pixelRect(
        x-42*s,
        y-65*s,
        84*s,
        27*s,
        "#142019"
    );

    pixelRect(
        x-30*s,
        y-100*s,
        60*s,
        35*s,
        "#17251b"
    );

    pixelRect(
        x-17*s,
        y-120*s,
        34*s,
        30*s,
        "#1b291e"
    );

}


/* =========================================================
   CASTLE WALL
   ========================================================= */

function drawWall(){

    const top =
        height * .735;

    const bottom =
        height * .955;


    /* wall body */

    ctx.fillStyle =
        "#34383a";

    ctx.fillRect(
        0,
        top,
        width,
        bottom-top
    );


    /* horizontal stone rows */

    for(
        let y=top+24;
        y<bottom;
        y+=28
    ){

        pixelRect(
            0,
            y,
            width,
            3,
            "#202427"
        );

    }


    /* brick seams */

    let row=0;

    for(
        let y=top+3;
        y<bottom;
        y+=28
    ){

        const offset =
            row%2 ? 34 : 0;

        for(
            let x=-offset;
            x<width;
            x+=68
        ){

            pixelRect(
                x,
                y,
                3,
                24,
                "#202427"
            );

        }

        row++;

    }


    /* top course */

    pixelRect(
        0,
        top-8,
        width,
        12,
        "#4c5051"
    );

    pixelRect(
        0,
        top-8,
        width,
        3,
        "#696c6b"
    );


    /* crenellations */

    const merlonWidth =
        Math.max(
            25,
            width*.035
        );

    const gap =
        merlonWidth*.55;

    for(
        let x=8;
        x<width;
        x+=merlonWidth+gap
    ){

        pixelRect(
            x,
            top-48,
            merlonWidth,
            40,
            "#414547"
        );

        pixelRect(
            x,
            top-48,
            merlonWidth,
            5,
            "#5d6061"
        );

        pixelRect(
            x+merlonWidth-6,
            top-43,
            6,
            35,
            "#292c2e"
        );

    }


    /* torches */

    drawTorch(
        70,
        top-4
    );

    drawTorch(
        width-70,
        top-4
    );

}


function drawTorch(
    x,y
){

    pixelRect(
        x-5,
        y-2,
        10,
        7,
        "#171717"
    );

    pixelRect(
        x-3,
        y+4,
        6,
        14,
        "#272727"
    );

    pixelRect(
        x-7,
        y-25,
        14,
        8,
        "#873919"
    );

    pixelRect(
        x-5,
        y-32,
        10,
        10,
        "#b84d1d"
    );

    pixelRect(
        x-2,
        y-38,
        6,
        9,
        "#e18a2c"
    );

    pixelRect(
        x,
        y-43,
        3,
        8,
        "#f1c65d"
    );

}


/* =========================================================
   ARCHER
   ========================================================= */

function drawArcher(){

    const x =
        player.x;

    const y =
        player.y;

    /* shadow */

    pixelRect(
        x-30,
        y+35,
        60,
        8,
        "#090b0b"
    );


    /* boots */

    pixelRect(
        x-17,
        y+20,
        13,
        17,
        "#141718"
    );

    pixelRect(
        x+4,
        y+20,
        13,
        17,
        "#141718"
    );


    /* legs */

    pixelRect(
        x-15,
        y-5,
        12,
        28,
        "#2b3030"
    );

    pixelRect(
        x+4,
        y-5,
        12,
        28,
        "#2b3030"
    );


    /* body */

    pixelRect(
        x-25,
        y-55,
        50,
        52,
        "#27312e"
    );

    pixelRect(
        x-18,
        y-50,
        9,
        40,
        "#3b4641"
    );

    pixelRect(
        x+10,
        y-49,
        8,
        38,
        "#323b37"
    );


    /* belt */

    pixelRect(
        x-27,
        y-6,
        54,
        9,
        "#1b1714"
    );

    pixelRect(
        x-4,
        y-6,
        9,
        10,
        "#a27b43"
    );


    /* shoulders */

    pixelRect(
        x-34,
        y-43,
        12,
        15,
        "#313936"
    );

    pixelRect(
        x+22,
        y-43,
        12,
        15,
        "#313936"
    );


    /* arms */

    pixelRect(
        x-40,
        y-37,
        12,
        30,
        "#28302d"
    );

    pixelRect(
        x+28,
        y-37,
        12,
        30,
        "#28302d"
    );


    /* neck */

    pixelRect(
        x-9,
        y-60,
        18,
        10,
        "#8e6c50"
    );


    /* hood */

    pixelRect(
        x-27,
        y-91,
        54,
        38,
        "#151c1b"
    );

    pixelRect(
        x-20,
        y-101,
        40,
        16,
        "#121817"
    );


    /* face */

    pixelRect(
        x-18,
        y-76,
        36,
        25,
        "#9d7859"
    );

    pixelRect(
        x-13,
        y-70,
        26,
        18,
        "#b08764"
    );


    /* eyes */

    pixelRect(
        x-9,
        y-64,
        5,
        4,
        "#101112"
    );

    pixelRect(
        x+6,
        y-64,
        5,
        4,
        "#101112"
    );


    /* scarf */

    pixelRect(
        x-21,
        y-54,
        42,
        8,
        "#161b1a"
    );


    /* quiver */

    pixelRect(
        x+25,
        y-50,
        10,
        36,
        "#36291d"
    );


    /* bow */

    ctx.strokeStyle =
        "#8d6337";

    ctx.lineWidth = 5;

    ctx.beginPath();

    ctx.moveTo(
        x+40,
        y-55
    );

    ctx.quadraticCurveTo(
        x+63,
        y-15,
        x+40,
        y+25
    );

    ctx.stroke();


    /* bow string */

    ctx.strokeStyle =
        "#bdb5a0";

    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.moveTo(
        x+40,
        y-55
    );

    ctx.lineTo(
        x+43,
        y-15
    );

    ctx.lineTo(
        x+40,
        y+25
    );

    ctx.stroke();


    /* arrow */

    const dx =
        mouseX -
        (x+43);

    const dy =
        mouseY -
        (y-15);

    const angle =
        Math.atan2(
            dy,
            dx
        );

    ctx.save();

    ctx.translate(
        x+43,
        y-15
    );

    ctx.rotate(angle);

    pixelRect(
        0,
        -1,
        55,
        3,
        "#c4ad7b"
    );

    pixelRect(
        52,
        -4,
        9,
        9,
        "#d5d7d0"
    );

    ctx.restore();

}


/* =========================================================
   ORC
   ========================================================= */

function drawEnemy(enemy){

    const data =
        enemyTypes[
            enemy.type
        ];

    const x =
        enemy.x;

    const y =
        enemy.y;

    const s =
        enemy.size;


    /* shadow */

    pixelRect(
        x-22*s,
        y+28*s,
        44*s,
        7*s,
        "#090b0a"
    );


    /* legs */

    pixelRect(
        x-13*s,
        y-2*s,
        10*s,
        30*s,
        "#272a25"
    );

    pixelRect(
        x+3*s,
        y-2*s,
        10*s,
        30*s,
        "#272a25"
    );


    /* body */

    pixelRect(
        x-22*s,
        y-45*s,
        44*s,
        48*s,
        data.color
    );


    /* armor */

    pixelRect(
        x-28*s,
        y-40*s,
        10*s,
        18*s,
        data.type==="heavy"
            ? "#6b7074"
            : "#403c2e"
    );

    pixelRect(
        x+18*s,
        y-40*s,
        10*s,
        18*s,
        data.type==="heavy"
            ? "#6b7074"
            : "#403c2e"
    );


    /* head */

    pixelRect(
        x-24*s,
        y-72*s,
        48*s,
        32*s,
        "#687352"
    );


    /* ears */

    pixelRect(
        x-31*s,
        y-63*s,
        9*s,
        14*s,
        "#566143"
    );

    pixelRect(
        x+22*s,
        y-63*s,
        9*s,
        14*s,
        "#566143"
    );


    /* hair */

    pixelRect(
        x-21*s,
        y-77*s,
        42*s,
        10*s,
        "#20241d"
    );


    /* eyes */

    pixelRect(
        x-12*s,
        y-54*s,
        6*s,
        5*s,
        "#d9c45f"
    );

    pixelRect(
        x+7*s,
        y-54*s,
        6*s,
        5*s,
        "#d9c45f"
    );


    /* tusks */

    pixelRect(
        x-10*s,
        y-43*s,
        5*s,
        9*s,
        "#e0d7b1"
    );

    pixelRect(
        x+5*s,
        y-43*s,
        5*s,
        9*s,
        "#e0d7b1"
    );


    /* weapon */

    pixelRect(
        x+27*s,
        y-22*s,
        6*s,
        50*s,
        "#503722"
    );


    /* HP */

    if(enemy.hp < enemy.maxHP){

        const bar =
            45*s;

        pixelRect(
            x-bar/2,
            y-87*s,
            bar,
            5*s,
            "#111313"
        );

        pixelRect(
            x-bar/2+1,
            y-86*s,
            (bar-2) *
            Math.max(
                0,
                enemy.hp/enemy.maxHP
            ),
            3*s,
            "#a4463d"
        );

    }

}


/* =========================================================
   ARROWS
   ========================================================= */

function drawArrow(arrow){

    const angle =
        Math.atan2(
            arrow.vy,
            arrow.vx
        );

    ctx.save();

    ctx.translate(
        arrow.x,
        arrow.y
    );

    ctx.rotate(angle);

    pixelRect(
        -15,
        -1,
        35,
        3,
        "#b89b69"
    );

    pixelRect(
        17,
        -5,
        9,
        10,
        "#d3d6cf"
    );

    ctx.restore();

}


/* =========================================================
   UI
   ========================================================= */

function drawUI(){

    if(!gameStarted)
        return;


    ctx.fillStyle =
        "rgba(5,7,9,.82)";

    ctx.fillRect(
        0,
        0,
        width,
        62
    );


    ctx.fillStyle =
        "#d4c9a7";

    ctx.font =
        "bold 18px monospace";

    ctx.textAlign =
        "left";

    ctx.fillText(
        "THE LAST WALL",
        20,
        25
    );


    ctx.textAlign =
        "center";

    ctx.fillText(
        "WAVE " + wave + " / 10",
        width/2,
        25
    );


    ctx.textAlign =
        "right";

    ctx.fillStyle =
        "#d2ad52";

    ctx.fillText(
        "GOLD " + gold,
        width-20,
        25
    );


    /* wall bar */

    const barW =
        Math.min(
            300,
            width*.30
        );

    ctx.fillStyle =
        "#101313";

    ctx.fillRect(
        20,
        70,
        barW,
        22
    );

    ctx.fillStyle =
        wallHP < maxWallHP*.3
        ? "#9c3b32"
        : "#68784e";

    ctx.fillRect(
        23,
        73,
        (barW-6) *
        Math.max(
            0,
            wallHP/maxWallHP
        ),
        16
    );


    ctx.fillStyle =
        "#ddd";

    ctx.font =
        "bold 12px monospace";

    ctx.textAlign =
        "center";

    ctx.fillText(
        "WALL " +
        Math.ceil(wallHP) +
        " / " +
        maxWallHP,
        20+barW/2,
        85
    );


    ctx.textAlign =
        "left";

    ctx.fillStyle =
        "#999";

    ctx.fillText(
        "KILLS " + kills,
        20,
        115
    );


    ctx.textAlign =
        "right";

    ctx.fillText(
        "SCORE " + score,
        width-20,
        115
    );

}


/* =========================================================
   GAME OVER / WIN
   ========================================================= */

function drawEnd(){

    if(!gameOver)
        return;


    ctx.fillStyle =
        "rgba(0,0,0,.68)";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    ctx.textAlign =
        "center";

    ctx.fillStyle =
        wallHP <= 0
        ? "#a8453b"
        : "#d5c28e";

    ctx.font =
        "bold 34px monospace";

    ctx.fillText(
        wallHP <= 0
        ? "THE WALL HAS FALLEN"
        : "THE LAST WALL STANDS",
        width/2,
        height*.43
    );


    ctx.fillStyle =
        "#ddd";

    ctx.font =
        "bold 18px monospace";

    ctx.fillText(
        "WAVE " + wave,
        width/2,
        height*.51
    );

    ctx.fillText(
        "KILLS " + kills,
        width/2,
        height*.56
    );

    ctx.fillText(
        "SCORE " + score,
        width/2,
        height*.61
    );

}


/* =========================================================
   RENDER
   ========================================================= */

function render(){

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    drawBackground();


    /* enemies behind wall */

    for(const enemy of enemies){

        if(!enemy.dead)
            drawEnemy(enemy);

    }


    /* archer */

    if(gameStarted)
        drawArcher();


    /* wall */

    drawWall();


    /* arrows */

    for(const arrow of arrows)
        drawArrow(arrow);


    drawUI();

    drawEnd();


    /* crosshair */

    if(
        gameStarted &&
        !gameOver
    ){

        ctx.strokeStyle =
            "#ded5b5";

        ctx.lineWidth = 2;

        ctx.beginPath();

        ctx.arc(
            mouseX,
            mouseY,
            11,
            0,
            Math.PI*2
        );

        ctx.stroke();

        ctx.fillStyle =
            "#ded5b5";

        ctx.fillRect(
            mouseX-2,
            mouseY-2,
            4,
            4
        );

    }

}


/* =========================================================
   MAIN LOOP
   ========================================================= */

function gameLoop(now){

    const dt =
        Math.min(
            .033,
            (now-lastTime)/1000
        );

    lastTime = now;

    update(dt);

    render();

    requestAnimationFrame(
        gameLoop
    );

}


/* =========================================================
   START
   ========================================================= */

resize();

requestAnimationFrame(
    gameLoop
);


/* =========================================================
   DEBUG-SAFE START
   ========================================================= */

/*
   Даже если GitHub загрузит страницу с задержкой,
   обработчик кнопки уже установлен.
*/

startButton.addEventListener(
    "touchend",
    e=>{

        e.preventDefault();

        startGame();

    },
    {passive:false}
);

</script>
