[55,82.5].forEach(fr=>{const o=AC.createOscillator(),q=AC.createGain();o.type='sine';o.frequency.value=fr;q.gain.value=.018;o.connect(q);q.connect(master);o.start()});

/* ================= WORLD BUILD ================= */

for(let i=0;i<260;i++){const z=rnd(3,110),x=rnd(-120,120);if(Math.abs(x-roadX(z))<roadW(z)+1.5)continue;items.push({k:'g',x,z,h:rnd(2,4),seed:Math.random()*9,c1:mixc([44,74,48],[34,54,64],clamp(z/130,0,.6))})}

const mxp=W*.76,myp=H*.1,R=U*.04;gr=c.createRadialGradient(mxp,myp,R*.5,mxp,myp,R*7);gr.addColorStop(0,'rgba(180,205,230,.35)');gr.addColorStop(1,'rgba(180,205,230,0)');c.fillStyle=gr;c.fillRect(mxp-R*7,myp-R*7,R*14,R*14);
c.fillStyle='#dfe7ec';c.beginPath();c.arc(mxp,myp,R,0,7);c.fill();c.fillStyle='rgba(120,140,160,.4)';[[-.3,-.2,.25],[.25,.15,.3],[-.1,.4,.18]].forEach(q=>{c.beginPath();c.arc(mxp+q[0]*R,myp+q[1]*R,q[2]*R,0,7);c.fill()});
for(let i=0;i<9;i++){const cx=rnd(0,W),cy=rnd(HOR*.1,HOR*.8);c.fillStyle='rgba(8,14,22,.55)';c.beginPath();c.ellipse(cx,cy,rnd(W*.08,W*.2),rnd(5,14),0,0,7);c.fill();c.fillStyle='rgba(150,175,200,.07)';c.beginPath();c.ellipse(cx,cy-3,rnd(W*.08,W*.18),2,0,0,7);c.fill()}
[['#18242e',.09],['#111b23',.055]].forEach(([col,mh],li)=>{c.fillStyle=col;c.beginPath();c.moveTo(0,HOR+3);let y=0;for(let x=0;x<=W+20;x+=14){y=clamp(y+rnd(-.2,.2)*H*mh,0,H*mh);c.lineTo(x,HOR-y*(li?.7:1)*Math.abs(Math.sin(x/W*3+li*2)))}c.lineTo(W,HOR+3);c.fill()});

for(let i=0;i<220;i++){const z=rnd(1,120),x=roadX(z)+rnd(-1,1)*roadW(z),s=sc(z);c.fillStyle=`rgba(${Math.random()<.5?'30,24,18':'110,100,86'},${rnd(.3,.6)})`;c.beginPath();c.ellipse(PXs(x,z),PY(z),rnd(1,4)*s*U*.004+.8,rnd(.5,2)*s*U*.004+.4,0,0,7);c.fill()}
gr=c.createLinearGradient(0,HOR-H*.02,0,HOR+H*.12);gr.addColorStop(0,'rgba(60,85,100,0)');gr.addColorStop(.35,'rgba(60,85,100,.5)');gr.addColorStop(1,'rgba(60,85,100,0)');c.fillStyle=gr;c.fillRect(0,HOR-H*.02,W,H*.14);

gr=c.createLinearGradient(0,top,0,crown);gr.addColorStop(0,'#101316');gr.addColorStop(1,'#50565c');c.fillStyle=gr;c.fillRect(0,top,W,crown-top);

c.fillStyle='#2b1d12';c.beginPath();c.moveTo(gx-gw/2,crown);c.lineTo(gx-gw/2,top+gh*.35);c.arc(gx,top+gh*.35,gw/2,Math.PI,0);c.lineTo(gx+gw/2,crown);c.fill();

c.fillStyle='#1b1e21';[.4,.7].forEach(f=>c.fillRect(gx-gw/2,top+gh*f,gw,gh*.07));c.fillStyle='#4a4d52';for(let i=0;i<5;i++)[.43,.73].forEach(f=>c.fillRect(gx-gw/2+gw/5*i+3,top+gh*f,2,2));

[front,c]=mk(W,H);

for(let x=-(bw/2);x<W;x+=bw){c.strokeStyle='rgba(0,0,0,.5)';c.strokeRect(x,crown,bw,(mBot-crown)/2);c.strokeRect(x+bw/2,crown+(mBot-crown)/2,bw,(mBot-crown)/2)}
