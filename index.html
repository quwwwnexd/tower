<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Последний лучник</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: #080b0d;
            color: #eeeeee;
            font-family: Georgia, serif;
        }

        button {
            padding: 12px 22px;
            border: 1px solid #ad7b43;
            background: #3b271c;
            color: #f4ead2;
            font: inherit;
            cursor: pointer;
            box-shadow: 0 0 14px #000;
        }

        button:hover {
            background: #62402a;
        }

        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .hidden {
            display: none !important;
        }

        .screen {
            position: fixed;
            inset: 0;
            z-index: 10;

            display: grid;
            place-items: center;

            background:
                radial-gradient(
                    ellipse at center,
                    #293d31 0%,
                    #0b1110 65%,
                    #050707 100%
                );
        }

        .panel {
            width: min(720px, 90%);
            padding: 42px;
            text-align: center;

            background: rgba(17, 23, 26, 0.95);
            border: 1px solid #775331;
            box-shadow: 0 0 70px #000;
        }

        .panel h1 {
            margin: 0 0 18px;
            color: #c69453;
            font-size: clamp(38px, 7vw, 82px);
            text-shadow: 0 3px 15px #000;
        }

        .panel p {
            color: #c1c3b4;
            line-height: 1.6;
        }

        #game {
            position: relative;
            height: 100vh;
            overflow: hidden;

            background:
                linear-gradient(
                    #111923 0%,
                    #111923 26%,
                    #182921 26%,
                    #0a1513 100%
                );

            user-select: none;
        }

        .hud {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 8;

            height: 62px;
            padding: 10px 18px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;

            background: rgba(9, 11, 13, 0.9);
            border-bottom: 1px solid #72512d;

            color: #e8d4a4;
            font-weight: bold;
        }

        .hud-item {
            white-space: nowrap;
        }

        .health-bar {
            display: inline-block;
            width: 150px;
            height: 12px;
            margin-left: 7px;

            border: 1px solid #9b7650;
            background: #1b1110;
            vertical-align: middle;
        }

        .health-bar-fill {
            display: block;
            width: 100%;
            height: 100%;
            background: #a4362b;
            transition: width 0.2s;
        }

        .wall {
            position: absolute;
            top: 62px;
            left: 0;
            right: 0;
            z-index: 2;

            height: 29%;
            min-height: 180px;

            background:
                repeating-linear-gradient(
                    0deg,
                    transparent 0 32px,
                    #3a3d3b 33px 35px
                ),
                repeating-linear-gradient(
                    90deg,
                    #4c4d48 0 82px,
                    #292d2d 83px 87px
                );

            border-top: 18px solid #202626;
            box-shadow: 0 15px 25px #000;
        }

        .crenellations {
            position: absolute;
            top: -34px;
            left: 0;
            right: 0;

            height: 35px;

            background:
                repeating-linear-gradient(
                    90deg,
                    #343b38 0 44px,
                    transparent 44px 63px
                );

            filter: drop-shadow(0 -2px 1px #000);
        }

        .tower {
            position: absolute;
            top: -58px;

            width: 100px;
            height: 100px;

            background: #333a37;
            border: 8px solid #1f2525;
        }

        .tower-left {
            left: 2%;
        }

        .tower-right {
            right: 2%;
        }

        .torch {
            position: absolute;

            color: #ffb33c;
            font-size: 24px;
            filter: drop-shadow(0 0 14px #ff8c18);

            animation: flicker 0.4s infinite alternate;
        }

        .torch-left {
            top: 45px;
            left: 18%;
        }

        .torch-right {
            top: 45px;
            right: 18%;
        }

        @keyframes flicker {
            from {
                transform: scale(1);
                color: #ff9c25;
            }

            to {
                transform: scale(1.2);
                color: #ffd37b;
            }
        }

        .forest {
            position: absolute;
            inset: calc(62px + 29%) 0 0;
            overflow: hidden;

            background:
                linear-gradient(
                    #1c342c,
                    #10251e 45%,
                    #0a1715 75%,
                    #080e10
                );
        }

        .forest::before {
            content: "☁   ☁      ☁       ☁";

            position: absolute;
            top: 12%;
            left: 0;
            right: 0;

            color: rgba(198, 216, 189, 0.25);
            font-size: 48px;
            letter-spacing: 26px;
            text-align: center;
            filter: blur(8px);
        }

        .trees {
            position: absolute;
            inset: 0;

            color: #0b211b;
            font-size: clamp(48px, 9vw, 120px);
            line-height: 1.1;
            letter-spacing: 12px;
            opacity: 0.9;
        }

        .road {
            position: absolute;
            bottom: -8%;
            left: 37%;

            width: 26%;
            height: 120%;

            background: #3b3025;
            clip-path: polygon(42% 0, 58% 0, 100% 100%, 0 100%);
            opacity: 0.9;
        }

        .road::after {
            content: "✦   ✧     ✦       ✧";

            position: absolute;
            inset: 25% 0;

            color: #716148;
            letter-spacing: 15px;
            text-align: center;
        }

        #archer {
            position: absolute;
            top: calc(62px + 29% - 76px);
            left: 50%;
            z-index: 6;

            width: 60px;
            height: 78px;

            transform: translateX(-50%);
            transition: left 0.05s;
            pointer-events: none;
        }

        .archer-hood {
            position: absolute;
            top: 0;
            left: 13px;

            width: 36px;
            height: 40px;

            border: 3px solid #55524a;
            border-radius: 50% 50% 42% 42%;
            background: #171a1b;
        }

        .archer-body {
            position: absolute;
            top: 34px;
            left: 10px;

            width: 42px;
            height: 44px;

            border: 3px solid #62503c;
            border-radius: 12px 12px 4px 4px;
            background: #292525;
        }

        .archer-bow {
            position: absolute;
            top: 29px;
            left: -9px;

            width: 44px;
            height: 52px;

            border-left: 3px solid #b6844d;
            border-radius: 50%;
        }

        .archer-bow::after {
            content: "";

            position: absolute;
            top: 0;
            left: 0;

            height: 51px;
            border-left: 1px solid #ddd;
        }

        .enemy {
            position: absolute;
            z-index: 4;

            width: 42px;
            height: 55px;

            transform: translate(-50%, -50%);
            text-align: center;
            font-size: 31px;

            filter: drop-shadow(0 4px 2px #000);
        }

        .enemy-health {
            position: absolute;
            top: -8px;
            left: 0;

            width: 42px;
            height: 5px;

            border: 1px solid #9c7761;
            background: #280b0b;
        }

        .enemy-health-fill {
            display: block;
            width: 100%;
            height: 100%;
            background: #a7332a;
        }

        .projectile {
            position: absolute;
            z-index: 7;

            width: 30px;
            height: 4px;

            background: #d4bb80;
            box-shadow: 0 0 5px #ffd27a;
            transform-origin: left center;
        }

        .toast {
            position: absolute;
            top: 75px;
            left: 50%;
            z-index: 9;

            padding: 9px 18px;

            transform: translateX(-50%);

            border: 1px solid #987044;
            background: rgba(23, 27, 24, 0.9);
            color: #e8d4a4;
        }

        .wave-info {
            position: absolute;
            top: 75px;
            right: 18px;
            z-index: 8;

            color: #d8c08a;
            text-align: right;
        }

        .upgrade-panel {
            position: absolute;
            bottom: 10px;
            left: 50%;
            z-index: 8;

            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;

            transform: translateX(-50%);
        }

        .upgrade-panel button {
            padding: 8px 10px;
            font-size: 13px;
        }

        .game-over {
            position: absolute;
            inset: 0;
            z-index: 20;

            display: grid;
            place-items: center;

            background: rgba(5, 7, 6, 0.75);
        }

        .game-over-box {
            min-width: 300px;
            padding: 30px;

            border: 1px solid #a17345;
            background: #121817;
            text-align: center;
        }

        @media (max-width: 700px) {
            .hud {
                padding: 8px;
                font-size: 11px;
                gap: 4px;
            }

            .health-bar {
                width: 70px;
            }

            .upgrade-panel {
                width: 100%;
                padding: 0 5px;
            }

            .upgrade-panel button {
                padding: 6px;
                font-size: 10px;
            }
        }
    </style>
</head>

<body>

    <div id="menu" class="screen">
        <div class="panel">
            <h1>ПОСЛЕДНИЙ ЛУЧНИК</h1>

            <p>
                Ночь поглотила древний лес.
                Орда уже слышна у стен.
            </p>

            <p>
                Ты — последний защитник крепости.
            </p>

            <button id="start-button">
                Начать игру
            </button>

            <p>
                ← → — перемещение<br>
                Пробел или левая кнопка мыши — выстрел
            </p>
        </div>
    </div>

    <main id="game" class="hidden">

        <div class="hud">
            <div class="hud-item">
                WAVE:
                <span id="wave-value">1</span>
            </div>

            <div class="hud-item">
                🏰 WALL:
                <span id="wall-value">100/100</span>

                <span class="health-bar">
                    <span id="wall-bar" class="health-bar-fill"></span>
                </span>
            </div>

            <div class="hud-item">
                💰
                <span id="gold-value">0</span>
            </div>

            <div class="hud-item">
                👹
                <span id="enemies-value">0</span>
            </div>
        </div>

        <section class="wall">
            <div class="crenellations"></div>

            <div class="tower tower-left"></div>
            <div class="tower tower-right"></div>

            <div class="torch torch-left">🔥</div>
            <div class="torch torch-right">🔥</div>
        </section>

        <section class="forest">
            <div class="trees">
                ♣ ♣  ♠  ♣ ♣  ♠  ♣ ♣<br>
                ♠  ♣   ♣  ♠ ♣  ♣  ♠<br>
                ♣  ♠ ♣  ♣ ♠  ♣ ♣
            </div>

            <div class="road"></div>
        </section>

        <div id="archer">
            <div class="archer-hood"></div>
            <div class="archer-body"></div>
            <div class="archer-bow"></div>
        </div>

        <div id="toast" class="toast hidden"></div>

        <div id="wave-info" class="wave-info"></div>

        <div class="upgrade-panel">
            <button data-upgrade="damage">
                Урон +
                <span>50</span> 💰
            </button>

            <button data-upgrade="speed">
                Скорострельность +
                <span>60</span> 💰
            </button>

            <button data-upgrade="wall">
                Стена +25
                <span>80</span> 💰
            </button>

            <button data-upgrade="fire">
                Огненные стрелы
                <span>140</span> 💰
            </button>
        </div>

        <div id="game-over" class="game-over hidden">
            <div class="game-over-box">
                <h2 id="game-over-title"></h2>
                <p id="game-over-text"></p>

                <button id="restart-button">
                    Начать заново
                </button>
            </div>
        </div>
    </main>

    <script src="./game.js"></script>
</body>
</html>
