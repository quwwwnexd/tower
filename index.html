<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Осада Тёмной Крепости</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
}

body{
    background:#080b12;
    color:white;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 10%,#283451 0%,#10182a 38%,#070b13 100%);
}

/* ЛУНА */

.moon{
    position:absolute;
    width:90px;
    height:90px;
    border-radius:50%;
    background:#e8e4ca;
    box-shadow:0 0 35px rgba(240,235,190,.35);
    top:55px;
    right:9%;
    opacity:.8;
}

/* ЛЕС */

.forest{
    position:absolute;
    left:0;
    right:0;
    top:29%;
    bottom:0;
    overflow:hidden;
    background:
        linear-gradient(#1a3825,#102719 60%,#0a1810);
}

.ground{
    position:absolute;
    inset:0;
    background:
        radial-gradient(circle at 15% 30%,#294a29 0 3px,transparent 4px),
        radial-gradient(circle at 40% 70%,#3c592c 0 4px,transparent 5px),
        radial-gradient(circle at 72% 35%,#253f24 0 5px,transparent 6px),
        radial-gradient(circle at 88% 75%,#344d29 0 3px,transparent 4px);
}

/* ДЕРЕВЬЯ */

.tree{
    position:absolute;
    width:90px;
    height:150px;
}

.tree .trunk{
    position:absolute;
    bottom:0;
    left:38px;
    width:18px;
    height:75px;
    background:#39271b;
    border-radius:8px;
}

.tree .crown{
    position:absolute;
    width:90px;
    height:90px;
    border-radius:50%;
    background:#183b22;
    box-shadow:
        20px 15px 0 #21482a,
        -18px 25px 0 #16341f,
        5px -12px 0 #285431;
}

.tree.t1{left:2%;top:5%;transform:scale(.8)}
.tree.t2{left:17%;top:38%;transform:scale(.65)}
.tree.t3{left:31%;top:8%;transform:scale(.95)}
.tree.t4{left:48%;top:45%;transform:scale(.7)}
.tree.t5{left:63%;top:10%;transform:scale(.85)}
.tree.t6{left:80%;top:37%;transform:scale(.75)}
.tree.t7{right:-2%;top:5%;transform:scale(1.05)}

.path{
    position:absolute;
    height:42px;
    background:#66533c;
    border-radius:50%;
    opacity:.75;
    transform:rotate(-8deg);
}

.path.p1{
    width:55%;
    left:0;
    top:73%;
}

.path.p2{
    width:50%;
    right:0;
    top:48%;
    transform:rotate(10deg);
}

.path.p3{
    width:40%;
    left:28%;
    top:35%;
    transform:rotate(3deg);
}

/* КРЕПОСТНАЯ СТЕНА */

.wall{
    position:absolute;
    z-index:20;
    left:0;
    right:0;
    top:20%;
    height:15%;
    min-height:115px;
}

/* основное тело */

.wall-body{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:78%;
    background:
        repeating-linear-gradient(
            0deg,
            rgba(0,0,0,.13) 0 2px,
            transparent 2px 31px
        ),
        repeating-linear-gradient(
            90deg,
            transparent 0 70px,
            rgba(0,0,0,.13) 70px 73px,
            transparent 73px 145px
        ),
        linear-gradient(#858b8c,#555b5d);
    border-top:5px solid #a8ada9;
    box-shadow:
        inset 0 7px 0 rgba(255,255,255,.12),
        0 12px 25px rgba(0,0,0,.6);
}

/* верхняя площадка стены */

.wall-top{
    position:absolute;
    left:0;
    right:0;
    top:15%;
    height:18%;
    background:linear-gradient(#9ca1a0,#64696b);
    border-top:4px solid #c0c3bd;
    border-bottom:4px solid #414648;
}

/* ЗУБЦЫ */

.crenellations{
    position:absolute;
    z-index:30;
    top:0;
    left:0;
    right:0;
    height:45%;
    display:flex;
    justify-content:space-around;
    align-items:flex-start;
}

.crenel{
    width:6.5%;
    height:100%;
    min-width:35px;
    background:
        linear-gradient(90deg,#707677,#a2a6a3 50%,#64696a);
    border:
        3px solid #44494b;
    border-top:5px solid #c0c3be;
    box-shadow:
        inset 3px 0 rgba(255,255,255,.08),
        4px 5px 5px rgba(0,0,0,.3);
}

.gap{
    width:4%;
}

/* БОЕВАЯ ПЛОЩАДКА */

.battlement-floor{
    position:absolute;
    z-index:24;
    left:0;
    right:0;
    top:32%;
    height:13%;
    background:linear-gradient(#777c7d,#505657);
    border-top:3px solid #b5b8b2;
    border-bottom:3px solid #3b4041;
}

/* ЛУЧНИК */

.archer{
    position:absolute;
    z-index:26;

    /* стоит ЗА зубцами */
    bottom:18%;
    left:50%;

    width:62px;
    height:125px;

    transform:translateX(-50%);
}

/* голова */

.archer-head{
    position:absolute;
    left:18px;
    top:0;
    width:38px;
    height:38px;
    border-radius:50%;
    background:#c58c62;
    border:3px solid #38271e;
}

/* капюшон */

.archer-hood{
    position:absolute;
    left:11px;
    top:-7px;
    width:52px;
    height:31px;
    border-radius:50% 50% 35% 35%;
    background:#202936;
    border:3px solid #10151e;
}

/* тело */

.archer-body{
    position:absolute;
    left:14px;
    top:34px;
    width:45px;
    height:65px;
    border-radius:12px 12px 6px 6px;
    background:linear-gradient(90deg,#263644,#415363,#202d39);
    border:3px solid #111820;
}

/* ноги */

.leg{
    position:absolute;
    top:91px;
    width:15px;
    height:35px;
    background:#20252b;
    border:3px solid #101419;
}

.leg.left{left:17px}
.leg.right{right:12px}

/* лук */

.bow{
    position:absolute;
    right:-20px;
    top:42px;
    width:48px;
    height:68px;
    border-right:5px solid #9b683e;
    border-radius:50%;
}

.bow-string{
    position:absolute;
    right:4px;
    top:2px;
    width:2px;
    height:64px;
    background:#d8d0b8;
    transform:rotate(-10deg);
}

/* АРБАЛЕТНАЯ / СТРЕЛА */

.arrow{
    position:absolute;
    z-index:28;
    width:25px;
    height:3px;
    background:#d9d0ad;
    transform-origin:left center;
}

.arrow:after{
    content:"";
    position:absolute;
    right:-5px;
    top:-3px;
    border-left:7px solid #d9d0ad;
    border-top:4px solid transparent;
    border-bottom:4px solid transparent;
}

/* UI */

#ui{
    position:absolute;
    z-index:100;
    top:12px;
    left:12px;
    right:12px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    pointer-events:none;
}

.panel{
    pointer-events:auto;
    background:rgba(9,13,21,.82);
    border:1px solid #555e6e;
    border-radius:12px;
    padding:10px 14px;
    box-shadow:0 5px 20px rgba(0,0,0,.35);
    backdrop-filter:blur(5px);
}

.stats{
    display:flex;
    gap:16px;
    font-size:14px;
}

.gold{
    color:#e6c45b;
}

.hp{
    color:#e56a64;
}

#pause{
    border:0;
    background:#242d3a;
    color:white;
    padding:9px 14px;
    border-radius:8px;
    font-size:16px;
}

/* сообщения */

#waveMessage{
    position:absolute;
    z-index:120;
    left:50%;
    top:44%;
    transform:translate(-50%,-50%);
    background:rgba(8,10,16,.9);
    border:1px solid #707987;
    padding:18px 28px;
    border-radius:12px;
    font-size:23px;
    opacity:0;
    transition:.35s;
    pointer-events:none;
}

#waveMessage.show{
    opacity:1;
}

/* враги */

.enemy{
    position:absolute;
    z-index:15;
    width:46px;
    height:62px;
}

.enemy-body{
    position:absolute;
    left:9px;
    top:18px;
    width:30px;
    height:35px;
    background:#507341;
    border:3px solid #182217;
    border-radius:12px 12px 7px 7px;
}

.enemy-head{
    position:absolute;
    left:7px;
    top:0;
    width:34px;
    height:29px;
    border-radius:45% 45% 35% 35%;
    background:#648c4b;
    border:3px solid #182217;
}

.enemy-eye{
    position:absolute;
    width:5px;
    height:5px;
    background:#15150f;
    top:10px;
}

.enemy-eye.a{left:8px}
.enemy-eye.b{right:8px}

.enemy-hp{
    position:absolute;
    left:0;
    right:0;
    top:-10px;
    height:5px;
    background:#271919;
}

.enemy-hp-inner{
    height:100%;
    background:#d35a51;
}

.enemy.fast .enemy-body{
    background:#596a8c;
}

.enemy.armored .enemy-body{
    background:#64676d;
}

.enemy.elite .enemy-body{
    background:#713f50;
}

.enemy.boss{
    width:90px;
    height:120px;
    transform-origin:center bottom;
}

.enemy.boss .enemy-head{
    width:60px;
    height:52px;
    left:15px;
    background:#815333;
}

.enemy.boss .enemy-body{
    width:65px;
    height:70px;
    left:13px;
    top:40px;
    background:#713d32;
}

/* кнопки телефона */

.mobile-controls{
    position:absolute;
    z-index:150;
    bottom:20px;
    left:20px;
    right:20px;
    display:flex;
    justify-content:space-between;
    pointer-events:none;
}

.mobile-controls button{
    pointer-events:auto;
    width:70px;
    height:70px;
    border-radius:18px;
    border:2px solid #69727c;
    background:rgba(12,17,25,.85);
    color:white;
    font-size:30px;
    touch-action:none;
}

.shoot{
    position:absolute;
    right:20px;
    bottom:20px;
    z-index:150;
    width:80px;
    height:80px;
    border-radius:50%;
    border:2px solid #d1ad55;
    background:rgba(74,48,19,.9);
    color:#ffe19a;
    font-size:25px;
    pointer-events:auto;
    touch-action:none;
}

/* экран меню */

#menu{
    position:absolute;
    inset:0;
    z-index:300;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle,#1d293c,#070a11 75%);
}

.menu-box{
    text-align:center;
    padding:35px;
    width:min(90%,500px);
}

.title{
    font-size:clamp(32px,7vw,64px);
    letter-spacing:4px;
    margin-bottom:10px;
    color:#e6dfc5;
    text-shadow:0 4px 15px #000;
}

.subtitle{
    color:#9da6b2;
    margin-bottom:30px;
}

.start{
    border:1px solid #9d8147;
    background:linear-gradient(#665329,#392d18);
    color:#f5e3aa;
    padding:15px 35px;
    border-radius:10px;
    font-size:19px;
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* конец */

#endScreen{
    position:absolute;
    z-index:500;
    inset:0;
    background:rgba(4,6,10,.9);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.endBox{
    background:#101722;
    border:1px solid #626d7c;
    padding:35px;
    border-radius:15px;
}

.endBox h1{
    font-size:40px;
    margin-bottom:15px;
}

.endBox button{
    margin-top:25px;
    padding:12px 28px;
    border:0;
    border-radius:8px;
    background:#594923;
    color:white;
    font-size:17px;
}

/* адаптация */

@media(max-width:700px){

    .wall{
        top:23%;
        height:18%;
    }

    .forest{
        top:34%;
    }

    .archer{
        transform:translateX(-50%) scale(.8);
        transform-origin:bottom center;
    }

    .stats{
        gap:8px;
        font-size:11px;
    }

    .panel{
        padding:8px;
    }

    .moon{
        width:55px;
        height:55px;
        top:75px;
    }

    .crenel{
        min-width:24px;
    }
}
</style>
</head>

<body>

<div id="game">

    <div class="moon"></div>

    <!-- ЛЕС -->
    <div class="forest">
        <div class="ground"></div>

        <div class="path p1"></div>
        <div class="path p2"></div>
        <div class="path p3"></div>

        <div class="tree t1"><div class="crown"></div><div class="trunk"></div></div>
        <div class="tree t2"><div class="crown"></div><div class="trunk"></div></div>
        <div class="tree t3"><div class="crown"></div><div class="trunk"></div></div>
        <div class="tree t4"><div class="crown"></div><div class="trunk"></div></div>
        <div class="tree t5"><div class="crown"></div><div class="trunk"></div></div>
        <div class="tree t6"><div class="crown"></div><div class="trunk"></div></div>
        <div class="tree t7"><div class="crown"></div><div class="trunk"></div></div>
    </div>

    <!-- ТОЛЬКО СТЕНА ЗАМКА -->
    <div class="wall">

        <div class="wall-body"></div>

        <div class="wall-top"></div>

        <!-- ЛУЧНИК НА ПЛОЩАДКЕ ЗА ЗУБЦАМИ -->
        <div class="archer">

            <div class="archer-hood"></div>
            <div class="archer-head"></div>

            <div class="archer-body"></div>

            <div class="leg left"></div>
            <div class="leg right"></div>

            <div class="bow">
                <div class="bow-string"></div>
            </div>

        </div>

        <!-- ЗУБЦЫ ИДУТ ПЕРЕД ЛУЧНИКОМ -->
        <div class="crenellations">
            <div class="crenel"></div><div class="gap"></div>
            <div class="crenel"></div><div class="gap"></div>
            <div class="crenel"></div><div class="gap"></div>
            <div class="crenel"></div><div class="gap"></div>
            <div class="crenel"></div><div class="gap"></div>
            <div class="crenel"></div><div class="gap"></div>
            <div class="crenel"></div><div class="gap"></div>
            <div class="crenel"></div>
        </div>

        <div class="battlement-floor"></div>

    </div>

    <!-- UI -->

    <div id="ui">

        <div class="panel stats">
            <span>🏰 Волна <b id="wave">1</b>/30</span>
            <span class="hp">❤ <b id="castleHp">1000</b></span>
            <span>👹 <b id="enemyCount">0</b></span>
            <span class="gold">◆ <b id="gold">0</b></span>
        </div>

        <button id="pause">Ⅱ</button>

    </div>

    <div id="waveMessage">
        Волна приближается…
    </div>

    <!-- МОБИЛЬНОЕ УПРАВЛЕНИЕ -->

    <div class="mobile-controls">
        <button id="left">←</button>
        <button id="right">→</button>
    </div>

    <button class="shoot" id="shoot">🏹</button>

    <!-- МЕНЮ -->

    <div id="menu">

        <div class="menu-box">

            <div class="title">ОСАДА</div>

            <div class="subtitle">
                Тёмная крепость
            </div>

            <button class="start" id="start">
                Начать осаду
            </button>

        </div>

    </div>

    <!-- КОНЕЦ -->

    <div id="endScreen" class="hidden">

        <div class="endBox">

            <h1 id="endTitle">Замок пал</h1>

            <p id="endText"></p>

            <button onclick="location.reload()">
                Начать заново
            </button>

        </div>

    </div>

</div>

<script>

const game = document.getElementById("game");

const waveText = document.getElementById("wave");
const hpText = document.getElementById("castleHp");
const enemyText = document.getElementById("enemyCount");
const goldText = document.getElementById("gold");

const menu = document.getElementById("menu");
const startButton = document.getElementById("start");
const pauseButton = document.getElementById("pause");

const message = document.getElementById("waveMessage");

const endScreen = document.getElementById("endScreen");
const endTitle = document.getElementById("endTitle");
const endText = document.getElementById("endText");

const archer = document.querySelector(".archer");

let running = false;
let paused = false;

let wave = 0;
let gold = 0;
let castleHp = 1000;

let enemies = [];
let arrows = [];

let archerX = 50;

let lastShot = 0;

/*
    ВАЖНО:
    Стрельба намеренно замедлена.
    750 мс = примерно 1.3 выстрела/сек.
*/
const shootCooldown = 750;

let upgrades = {
    damage:1,
    fireRate:1,
    castle:1,
    speed:1,
    pierce:0
};

const enemyTypes = {
    normal:{
        hp:60,
        speed:18,
        damage:25,
        reward:10
    },

    tough:{
        hp:120,
        speed:15,
        damage:35,
        reward:18
    },

    fast:{
        hp:55,
        speed:32,
        damage:22,
        reward:14
    },

    armored:{
        hp:220,
        speed:11,
        damage:50,
        reward:30
    },

    elite:{
        hp:400,
        speed:17,
        damage:70,
        reward:55
    },

    boss:{
        hp:3000,
        speed:8,
        damage:200,
        reward:500
    }
};

/* ================================
        СТАРТ
================================ */

startButton.onclick = startGame;

function startGame(){

    menu.classList.add("hidden");

    running = true;

    showWaveMessage("Волна 1 приближается…");

    setTimeout(()=>{
        startWave();
    },1800);
}

/* ================================
        ВОЛНЫ
================================ */

function startWave(){

    if(!running) return;

    wave++;

    if(wave > 30){

        victory();

        return;
    }

    waveText.textContent = wave;

    showWaveMessage(
        wave === 30
        ? "ФИНАЛЬНАЯ ОСАДА"
        : "Волна " + wave + " приближается…"
    );

    let count = 5 + Math.floor(wave * 1.6);

    let delay = 1000;

    for(let i=0;i<count;i++){

        setTimeout(()=>{

            if(running){
                spawnEnemy();
            }

        },delay);

        delay += Math.max(350,850-wave*12);
    }

    if(wave === 30){

        setTimeout(()=>{

            if(running){
                spawnEnemy("boss");
            }

        },delay+1000);
    }
}

/* ================================
        ТИП ВРАГА
================================ */

function getEnemyType(){

    if(wave <= 5)
        return "normal";

    if(wave <= 10)
        return Math.random()<.25 ? "tough":"normal";

    if(wave <= 15){

        const r=Math.random();

        if(r<.35) return "fast";
        if(r<.65) return "armored";

        return "tough";
    }

    if(wave <= 20){

        const r=Math.random();

        if(r<.35) return "elite";
        if(r<.65) return "armored";

        return "fast";
    }

    if(wave <= 25){

        const types=["fast","armored","elite","tough"];

        return types[Math.floor(Math.random()*types.length)];
    }

    const types=["armored","elite","elite","fast"];

    return types[Math.floor(Math.random()*types.length)];
}

/* ================================
        СОЗДАНИЕ ОРКА
================================ */

function spawnEnemy(forceType=null){

    const type = forceType || getEnemyType();

    const data = enemyTypes[type];

    const el = document.createElement("div");

    el.className="enemy "+type;

    /*
        Орки появляются ТОЛЬКО ВНИЗУ ЛЕСА.
    */

    const startX = 10 + Math.random()*80;

    const startY =
        68 +
        Math.random()*25;

    el.style.left=startX+"%";
    el.style.top=startY+"%";

    el.innerHTML=`

        <div class="enemy-hp">
            <div class="enemy-hp-inner"></div>
        </div>

        <div class="enemy-head">
            <div class="enemy-eye a"></div>
            <div class="enemy-eye b"></div>
        </div>

        <div class="enemy-body"></div>

    `;

    game.appendChild(el);

    const enemy={
        el,
        type,
        hp:data.hp*(1+wave*.08),
        maxHp:data.hp*(1+wave*.08),
        speed:data.speed*(1+wave*.018),
        damage:data.damage*(1+wave*.025),
        reward:data.reward,
        x:startX,
        y:startY,
        dead:false
    };

    enemies.push(enemy);

    updateEnemyUI();
}

/* ================================
        ДВИЖЕНИЕ
================================ */

let lastTime=performance.now();

function loop(time){

    const dt=(time-lastTime)/1000;

    lastTime=time;

    if(running && !paused){

        updateEnemies(dt);
        updateArrows(dt);
        updateArcher();

    }

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

function updateEnemies(dt){

    for(let i=enemies.length-1;i>=0;i--){

        const e=enemies[i];

        if(e.dead) continue;

        /*
            Движение строго вверх:
            лес → стена
        */

        e.y -= e.speed*dt/100;

        /*
            Стена находится примерно на 34%.
            Орк физически доходит до неё.
        */

        if(e.y <= 35){

            damageCastle(e);

            removeEnemy(i);

            continue;
        }

        e.el.style.left=e.x+"%";
        e.el.style.top=e.y+"%";

        const hp=e.el.querySelector(".enemy-hp-inner");

        hp.style.width=
            Math.max(0,e.hp/e.maxHp*100)+"%";
    }

    updateEnemyUI();
}

/* ================================
        УРОН ЗАМКУ
================================ */

function damageCastle(enemy){

    castleHp -= enemy.damage;

    if(castleHp<0)
        castleHp=0;

    hpText.textContent=Math.floor(castleHp);

    if(castleHp<=0){

        defeat();

    }
}

/* ================================
        УДАЛЕНИЕ
================================ */

function removeEnemy(index){

    const e=enemies[index];

    if(!e) return;

    e.dead=true;

    e.el.remove();

    enemies.splice(index,1);

    updateEnemyUI();

    /*
        Если врагов больше нет —
        следующая волна через несколько секунд.
    */

    if(enemies.length===0 && running){

        setTimeout(()=>{

            if(
                running &&
                !paused &&
                enemies.length===0
            ){

                startWave();

            }

        },3500);
    }
}

/* ================================
        СТРЕЛЬБА
================================ */

function shoot(){

    if(!running || paused) return;

    const now=Date.now();

    const cooldown=
        shootCooldown /
        upgrades.fireRate;

    if(now-lastShot<cooldown)
        return;

    lastShot=now;

    /*
        Находим ближайшего орка.
    */

    let target=null;
    let bestDistance=Infinity;

    for(const e of enemies){

        if(e.dead) continue;

        const distance=
            Math.abs(e.x-archerX)+
            Math.abs(e.y-28);

        if(distance<bestDistance){

            bestDistance=distance;
            target=e;
        }
    }

    if(!target) return;

    createArrow(target);
}

/* ================================
        СТРЕЛА
================================ */

function createArrow(target){

    const arrow=document.createElement("div");

    arrow.className="arrow";

    game.appendChild(arrow);

    const startX=archerX;
    const startY=27;

    arrow.style.left=startX+"%";
    arrow.style.top=startY+"%";

    const a={
        el:arrow,
        x:startX,
        y:startY,
        target,
        speed:1.6,
        damage:35*upgrades.damage,
        pierce:upgrades.pierce,
        hit:false
    };

    arrows.push(a);
}

function updateArrows(dt){

    for(let i=arrows.length-1;i>=0;i--){

        const a=arrows[i];

        if(!a.target || a.target.dead){

            a.el.remove();
            arrows.splice(i,1);

            continue;
        }

        const tx=a.target.x;
        const ty=a.target.y;

        const dx=tx-a.x;
        const dy=ty-a.y;

        const distance=Math.sqrt(dx*dx+dy*dy);

        const angle=Math.atan2(dy,dx);

        a.x +=
            Math.cos(angle)*
            a.speed*
            dt*100;

        a.y +=
            Math.sin(angle)*
            a.speed*
            dt*100;

        a.el.style.left=a.x+"%";
        a.el.style.top=a.y+"%";

        a.el.style.transform=
            `rotate(${angle}rad)`;

        if(distance<3){

            hitEnemy(a.target,a);

            a.el.remove();
            arrows.splice(i,1);
        }
    }
}

/* ================================
        ПОПАДАНИЕ
================================ */

function hitEnemy(enemy,arrow){

    if(!enemy || enemy.dead)
        return;

    enemy.hp-=arrow.damage;

    enemy.el.style.filter=
        "brightness(2)";

    setTimeout(()=>{

        if(enemy.el)
            enemy.el.style.filter="";

    },90);

    if(enemy.hp<=0){

        gold+=enemy.reward;

        goldText.textContent=gold;

        const index=enemies.indexOf(enemy);

        if(index!==-1)
            removeEnemy(index);
    }
}

/* ================================
        ЛУЧНИК
================================ */

function updateArcher(){

    archer.style.left=archerX+"%";
}

function moveLeft(){

    if(!running || paused)
        return;

    archerX-=1.5;

    if(archerX<7)
        archerX=7;

    updateArcher();
}

function moveRight(){

    if(!running || paused)
        return;

    archerX+=1.5;

    if(archerX>93)
        archerX=93;

    updateArcher();
}

/* клавиатура */

document.addEventListener("keydown",e=>{

    if(e.key==="ArrowLeft")
        moveLeft();

    if(e.key==="ArrowRight")
        moveRight();

    if(e.code==="Space")
        shoot();

});

/* кнопки */

document.getElementById("left").addEventListener(
    "pointerdown",
    e=>{
        e.preventDefault();
        moveLeft();
    }
);

document.getElementById("right").addEventListener(
    "pointerdown",
    e=>{
        e.preventDefault();
        moveRight();
    }
);

document.getElementById("shoot").addEventListener(
    "pointerdown",
    e=>{
        e.preventDefault();
        shoot();
    }
);

/* клик по игровому полю */

game.addEventListener("pointerdown",e=>{

    if(
        e.target.closest("button") ||
        e.target.closest("#menu")
    ) return;

    if(running)
        shoot();

});

/* ================================
        ПАУЗА
================================ */

pauseButton.onclick=()=>{

    if(!running)
        return;

    paused=!paused;

    pauseButton.textContent=
        paused ? "▶" : "Ⅱ";
};

/* ================================
        UI
================================ */

function updateEnemyUI(){

    enemyText.textContent=enemies.length;
}

/* ================================
        СООБЩЕНИЕ
================================ */

function showWaveMessage(text){

    message.textContent=text;

    message.classList.add("show");

    setTimeout(()=>{

        message.classList.remove("show");

    },1800);
}

/* ================================
        ПОРАЖЕНИЕ
================================ */

function defeat(){

    running=false;

    endTitle.textContent="Замок пал";

    endText.textContent=
        "Орды орков прорвались к стенам. Волна "+wave+".";

    endScreen.classList.remove("hidden");
}

/* ================================
        ПОБЕДА
================================ */

function victory(){

    running=false;

    endTitle.textContent="Победа!";

    endText.textContent=
        "Ты выдержал все 30 волн и защитил Тёмную крепость.";

    endScreen.classList.remove("hidden");
}

/* ================================
        ЗАПУСК
================================ */

updateArcher();
updateEnemyUI();

</script>

</body>
</html>
