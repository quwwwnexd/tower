<script>
(()=>{
'use strict';

/* =========================================================
   ОСНОВНЫЕ ЭЛЕМЕНТЫ
========================================================= */

const $=id=>document.getElementById(id);

const cv=$('c');
const out=cv.getContext('2d');

const lo=document.createElement('canvas');
const g=lo.getContext('2d');

let ps=3;

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);

let W,H,U,PX,HOR,WALLY,DPR=1;
let bg,back,front,vig,fogS,items=[];

const K=.045;

const sc=z=>1/(1+z*K);
const lx=z=>Math.pow(sc(z),.55);

const PY=z=>HOR+(WALLY-HOR)*sc(z);
const PXs=(x,z)=>W/2+x*PX*lx(z);

const roadX=z=>Math.sin(z*.055)*9*Math.min(1,z/40);
const roadW=z=>5.5+z*.012;

const mixc=(a,b,t)=>
`rgb(${a.map((v,i)=>(v+(b[i]-v)*t)|0).join(',')})`;

const mk=(w,h)=>{
  const c=document.createElement('canvas');

  c.width=w*DPR;
  c.height=h*DPR;

  const x=c.getContext('2d');
  x.scale(DPR,DPR);

  return[c,x];
};


/* =========================================================
   AUDIO
========================================================= */

let AC,master,nbuf,mute=false,lastHit=0,lastWall=0;

function initAudio(){

  if(AC){
    if(AC.state==='suspended') AC.resume();
    return;
  }

  try{

    AC=new(window.AudioContext||window.webkitAudioContext)();

    master=AC.createGain();
    master.gain.value=.55;
    master.connect(AC.destination);

    const n=AC.sampleRate*2;

    nbuf=AC.createBuffer(
      1,
      n,
      AC.sampleRate
    );

    const d=nbuf.getChannelData(0);

    for(let i=0;i<n;i++){
      d[i]=Math.random()*2-1;
    }

    ambient();

  }catch(e){
    console.error(e);
    AC=null;
  }
}

function noise(dur,f1,f2,type,vol,q){

  if(!AC||mute)return;

  const T=AC.currentTime;

  const s=AC.createBufferSource();
  s.buffer=nbuf;

  const f=AC.createBiquadFilter();

  f.type=type;
  f.frequency.setValueAtTime(f1,T);
  f.frequency.exponentialRampToValueAtTime(f2,T+dur);

  if(q)f.Q.value=q;

  const gn=AC.createGain();

  gn.gain.setValueAtTime(vol,T);
  gn.gain.exponentialRampToValueAtTime(.001,T+dur);

  s.connect(f);
  f.connect(gn);
  gn.connect(master);

  s.start(T,Math.random());
  s.stop(T+dur+.05);
}

function tone(type,f1,f2,dur,vol,delay,lp){

  if(!AC||mute)return;

  const T=AC.currentTime+(delay||0);

  const o=AC.createOscillator();
  const gn=AC.createGain();

  o.type=type;

  o.frequency.setValueAtTime(f1,T);

  o.frequency.exponentialRampToValueAtTime(
    Math.max(20,f2),
    T+dur
  );

  gn.gain.setValueAtTime(.001,T);

  gn.gain.linearRampToValueAtTime(
    vol,
    T+Math.min(.04,dur/4)
  );

  gn.gain.exponentialRampToValueAtTime(
    .001,
    T+dur
  );

  let n=o;

  if(lp){

    const f=AC.createBiquadFilter();

    f.type='lowpass';
    f.frequency.value=lp;

    o.connect(f);
    n=f;
  }

  n.connect(gn);
  gn.connect(master);

  o.start(T);
  o.stop(T+dur+.05);
}

function ambient(){

  const s=AC.createBufferSource();

  s.buffer=nbuf;
  s.loop=true;

  const f=AC.createBiquadFilter();

  f.type='bandpass';
  f.frequency.value=420;
  f.Q.value=.7;

  const gn=AC.createGain();

  gn.gain.value=.05;

  const l=AC.createOscillator();
  const lg=AC.createGain();

  l.frequency.value=.11;
  lg.gain.value=.035;

  l.connect(lg);
  lg.connect(gn.gain);

  s.connect(f);
  f.connect(gn);
  gn.connect(master);

  s.start();
  l.start();

  [55,82.5].forEach(fr=>{

    const o=AC.createOscillator();
    const q=AC.createGain();

    o.type='sine';
    o.frequency.value=fr;
    q.gain.value=.018;

    o.connect(q);
    q.connect(master);

    o.start();
  });

  setInterval(()=>{
    if(Math.random()<.6){
      tone(
        'sine',
        rnd(260,340),
        rnd(150,200),
        2.2,
        .03,
        0,
        600
      );
    }
  },17000);
}

const SFX={

  shoot(){
    noise(.18,3500,500,'highpass',.22);
    tone('triangle',240,90,.16,.18);
  },

  draw(){
    noise(.25,300,700,'bandpass',.05,3);
  },

  hit(){

    const n=performance.now();

    if(n-lastHit<35)return;

    lastHit=n;

    noise(.12,1400,200,'lowpass',.35);
    tone('triangle',180,70,.1,.25);
  },

  kill(){
    tone('sawtooth',150,45,.35,.2,0,500);
    noise(.25,700,120,'lowpass',.25);
  },

  wall(){

    const n=performance.now();

    if(n-lastWall<80)return;

    lastWall=n;

    noise(.28,350,60,'lowpass',.6);
    tone('sine',70,35,.25,.4);
  },

  miss(){
    noise(.08,900,300,'lowpass',.1);
  },

  wave(){
    tone('sawtooth',98,98,1.5,.18,0,420);
    tone('sawtooth',147,140,1.5,.14,.05,420);
    tone('sawtooth',196,190,1.2,.1,.5,420);
  },

  win(){
    [392,494,587,784].forEach((f,i)=>
      tone('triangle',f,f,.6,.2,i*.18)
    );
  },

  lose(){
    [330,262,220,165,110].forEach((f,i)=>
      tone('sawtooth',f,f*.95,.8,.16,i*.28,500)
    );

    noise(1.6,400,40,'lowpass',.5);
  },

  drum(){
    tone('sine',70,40,.3,.22);
  }
};


/* =========================================================
   ENEMIES
========================================================= */

const TY={

  orc:{
    hp:28,
    spd:5,
    dmg:5,
    cd:1.3,
    sz:1,
    gold:5,

    gold:7,

    armor:0,
    w:1.8
  },

  heavy:{
    hp:85,
    spd:2.8,
    dmg:16,
    cd:2,
    sz:1.4,
    gold:18,
    col:'#40593a',

    armor:1,
    w:3.2
  },

  elite:{
    hp:140,

};

const UP=[

  ['dmg','Arrow Damage','+15% damage per level',40],

  ['rate','Draw Speed','faster bow draw',45],

  ['hp','Castle Walls','+150 max HP and repair',50],

  ['crit','Critical Power','+chance and +damage',45],

  ['spd','Archer Agility','faster movement',30]

];

const MAXLV=8;
const WAVES=10;


/* =========================================================
   STATE
========================================================= */

let st='menu';

let wave=0;

let hp=1000;
let maxHP=1000;

let kills=0;
let shots=0;
let hits=0;

let gold=0;
let goldTotal=0;

let up;

let orcs=[];
let arrows=[];
let parts=[];
let queue=[];

let spT=0;
let banT=0;
let banTxt='';

let shake=0;
let t=0;

let ax=0;
let avx=0;

let p=0;
let drawing=false;
let rec=0;
let ct=0;
let drumT=0;

let mx,my;
let touchDir=0;

let nextIn;


const mot=Array.from(
  {length:50},
  ()=>({
    x:Math.random(),
    y:Math.random(),
    s:rnd(.2,1)
  })
);

const fogB=Array.from(

/* =========================================================
   STATS
========================================================= */

const dmgBase=()=>
  12*(1+.15*up.dmg);

const critCh=()=>
  .1+.04*up.crit;

const critMul=()=>
  2+.3*up.crit;

const drawTime=()=>
  .55/(1+.2*up.rate);

const cost=k=>
  Math.round(
    UP.find(u=>u[0]===k)[3]*
    (1+up[k]*.75)
  );


/* =========================================================
   WORLD
========================================================= */

function mkTree(x,z){

  const f=clamp((z-20)/150,0,.7);

  const fog=[34,54,64];

  const r=Math.random();

  return{
    k:r<.18?'d':'t',
    x,
    z,
    h:rnd(32,54),
    seed:Math.random()*9,
    c0:mixc([30,22,16],fog,f),
    c1:mixc([12,34,22],fog,f),
    c2:mixc([30,66,44],fog,f),
    c3:mixc([58,96,70],fog,f)
  };
}

function buildWorld(){

  items=[];

  for(let i=0;i<360;i++){

    const z=rnd(84,168);
    const x=rnd(-240,240);

    if(
      Math.abs(x-roadX(z))<
      roadW(z)+4.5
    )continue;

    items.push(mkTree(x,z));
  }

  for(let i=0;i<110;i++){

    const z=rnd(24,84);
    const x=rnd(-130,130);

    if(
      Math.abs(x-roadX(z))<
      roadW(z)+9
    )continue;

    if(
      z<56 &&
      Math.abs(x)<46
    )continue;

    items.push(mkTree(x,z));
  }

  for(let i=0;i<110;i++){

    const z=rnd(8,150);
    const x=rnd(-150,150);

    if(
      Math.abs(x-roadX(z))<
      roadW(z)+3
    )continue;

    const f=clamp(z/150,0,.6);

    items.push({
      k:'b',
      x,
      z,
      h:rnd(3.5,7),
      seed:Math.random()*9,
      c1:mixc(
        [14,38,24],
        [34,54,64],
        f
      ),
      c2:mixc(
        [30,62,40],
        [34,54,64],
        f
      )
    });
  }

  for(let i=0;i<40;i++){

    const z=rnd(8,140);
    const x=rnd(-150,150);

    if(
      Math.abs(x-roadX(z))<
      roadW(z)+2
    )continue;

    items.push({
      k:'r',
      x,
      z,
      h:rnd(2,5),
      c1:mixc(
        [60,66,70],
        [34,54,64],
        clamp(z/160,0,.6)
      ),
      c2:mixc(
        [96,104,108],
        [34,54,64],
        clamp(z/160,0,.6)
      )
    });
  }

  for(let i=0;i<260;i++){

    const z=rnd(3,110);
    const x=rnd(-120,120);

    if(
      Math.abs(x-roadX(z))<
      roadW(z)+1.5
    )continue;

    items.push({
      k:'g',
      x,
      z,
      h:rnd(2,4),
      seed:Math.random()*9,
      c1:mixc(
        [44,74,48],
        [34,54,64],
        clamp(z/130,0,.6)
      )
    });
  }

  items.sort((a,b)=>b.z-a.z);
}


/* =========================================================
   RESIZE
========================================================= */

function resize(){

  DPR=1;

  ps=Math.max(
    2,
    Math.round(
      Math.min(innerWidth,innerHeight)/200
    )
  );

  W=Math.ceil(innerWidth/ps);
  H=Math.ceil(innerHeight/ps);

  lo.width=W;
  lo.height=H;

  cv.width=W*ps;
  cv.height=H*ps;

  g.setTransform(1,0,0,1,0,0);
  g.imageSmoothingEnabled=false;

  U=Math.min(H,W*.75);

  PX=W/100;

  HOR=H*.3;
  WALLY=H*.79;

  buildStatic();
  buildVig();
}


/* =========================================================
   STATIC WORLD
========================================================= */

function buildStatic(){

  let c;

  [bg,c]=mk(W,H);

  let gr=c.createLinearGradient(
    0,0,0,HOR
  );

  gr.addColorStop(0,'#04070d');
  gr.addColorStop(.7,'#0f1a27');
  gr.addColorStop(1,'#25394a');

  c.fillStyle=gr;
  c.fillRect(0,0,W,HOR+2);


  /* stars */

  for(let i=0;i<130;i++){

    c.fillStyle=
      `rgba(220,230,255,${rnd(.15,.7)})`;

    c.fillRect(
      rnd(0,W),
      rnd(0,HOR*.8),
      rnd(.6,1.6),
      rnd(.6,1.6)
    );
  }


  /* moon */

  const mxp=W*.76;
  const myp=H*.1;
  const R=U*.04;

  gr=c.createRadialGradient(
    mxp,myp,R*.5,
    mxp,myp,R*7
  );

  gr.addColorStop(
    0,
    'rgba(180,205,230,.35)'
  );

  gr.addColorStop(
    1,
    'rgba(180,205,230,0)'
  );

  c.fillStyle=gr;

  c.fillRect(
    mxp-R*7,
    myp-R*7,
    R*14,
    R*14
  );

  c.fillStyle='#dfe7ec';

  c.beginPath();
  c.arc(mxp,myp,R,0,7);
  c.fill();

  c.fillStyle='rgba(120,140,160,.4)';

  [
    [-.3,-.2,.25],
    [.25,.15,.3],
    [-.1,.4,.18]
  ].forEach(q=>{

    c.beginPath();

    c.arc(
      mxp+q[0]*R,
      myp+q[1]*R,
      q[2]*R,
      0,
      7
    );

    c.fill();
  });


  /* clouds */

  for(let i=0;i<9;i++){

    const cx=rnd(0,W);
    const cy=rnd(HOR*.1,HOR*.8);

    c.fillStyle='rgba(8,14,22,.55)';

    c.beginPath();

    c.ellipse(
      cx,
      cy,
      rnd(W*.08,W*.2),
      rnd(5,14),
      0,
      0,
      7
    );

    c.fill();

    c.fillStyle='rgba(150,175,200,.07)';

    c.beginPath();

    c.ellipse(
      cx,
      cy-3,
      rnd(W*.08,W*.18),
      2,
      0,
      0,
      7
    );

    c.fill();
  }


  /* mountains */

  [
    ['#18242e',.09],
    ['#111b23',.055]
  ].forEach(([col,mh],li)=>{

    c.fillStyle=col;

    c.beginPath();

    c.moveTo(0,HOR+3);

    let y=0;

    for(
      let x=0;
      x<=W+20;
      x+=5
    ){

      y=clamp(
        y+
        rnd(-.2,.2)*
        H*
        mh,
        0,
        H*mh
      );

      c.lineTo(
        x,
        HOR-
        y*
        (li?.7:1)*
        Math.abs(
          Math.sin(
            x/W*3+li*2
          )
        )
      );
    }

    c.lineTo(W,HOR+3);

    c.fill();
  });


  /* ground */

  gr=c.createLinearGradient(
    0,HOR,
    0,H
  );

  gr.addColorStop(0,'#22343a');
  gr.addColorStop(.25,'#1c2c25');
  gr.addColorStop(1,'#101710');

  c.fillStyle=gr;

  c.fillRect(
    0,
    HOR,
    W,
    H-HOR
  );


  for(let i=0;i<900;i++){

    const y=rnd(HOR,H);
    const s=(y-HOR)/(H-HOR);

    c.fillStyle=
      `rgba(${
        Math.random()<.5
        ?'10,22,14'
        :'60,86,60'
      },${rnd(.05,.16)})`;

    c.beginPath();

    c.ellipse(
      rnd(0,W),
      y,
      rnd(2,18)*(.2+s),
      rnd(.6,3)*(.2+s),
      0,
      0,
      7
    );

    c.fill();
  }


  /* road */

  for(
    let z=175;
    z>-8;
    z-=1.4
  ){

    const z2=z-1.6;

    const a=sc(z);
    const b=sc(z2);

    const y1=PY(z);
    const y2=PY(z2);

    const f=clamp(z/140,0,.8);

    const q=w=>{

      c.beginPath();

      c.moveTo(
        PXs(
          roadX(z)-roadW(z)-w,
          z
        ),
        y1
      );

      c.lineTo(
        PXs(
          roadX(z)+roadW(z)+w,
          z
        ),
        y1
      );

      c.lineTo(
        PXs(
          roadX(z2)+roadW(z2)+w,
          z2
        ),
        y2+1
      );

      c.lineTo(
        PXs(
          roadX(z2)-roadW(z2)-w,
          z2
        ),
        y2+1
      );

      c.fill();
    };

    c.fillStyle=mixc(
      [30,23,16],
      [44,56,62],
      f
    );

    q(1.2);

    c.fillStyle=mixc(
      [60,48,36],
      [58,70,76],
      f
    );

    q(0);

    c.fillStyle=mixc(
      [36,28,20],
      [50,62,68],
      f
    );

    [-.45,.45].forEach(o=>{

      const w=roadW(z)*.14;

      c.beginPath();

      c.moveTo(
        PXs(
          roadX(z)+roadW(z)*o-w,
          z
        ),
        y1
      );

      c.lineTo(
        PXs(
          roadX(z)+roadW(z)*o+w,
          z
        ),
        y1
      );

      c.lineTo(
        PXs(
          roadX(z2)+roadW(z2)*o+w,
          z2
        ),
        y2+1
      );

      c.lineTo(
        PXs(
          roadX(z2)+roadW(z2)*o-w,
          z2
        ),
        y2+1
      );

      c.fill();
    });
  }


  /* stones */

  for(let i=0;i<220;i++){

    const z=rnd(1,120);

    const x=
      roadX(z)+
      rnd(-1,1)*roadW(z);

    const s=sc(z);

    c.fillStyle=
      `rgba(${
        Math.random()<.5
        ?'30,24,18'
        :'110,100,86'
      },${rnd(.3,.6)})`;

    c.beginPath();

    c.ellipse(
      PXs(x,z),
      PY(z),
      rnd(1,4)*s*U*.004+.8,
      rnd(.5,2)*s*U*.004+.4,
      0,
      0,
      7
    );

    c.fill();
  }


  /* fog */

  gr=c.createLinearGradient(
    0,HOR-H*.02,
    0,HOR+H*.12
  );

  gr.addColorStop(
    0,
    'rgba(60,85,100,0)'
  );

  gr.addColorStop(
    .35,
    'rgba(60,85,100,.5)'
  );

  gr.addColorStop(
    1,
    'rgba(60,85,100,0)'
  );

  c.fillStyle=gr;

  c.fillRect(
    0,
    HOR-H*.02,
    W,
    H*.14
  );


  /* =====================================================
     BACK WALL
  ===================================================== */

  [back,c]=mk(W,H);

  const top=Math.round(WALLY);
  const crown=Math.round(H*.9);
  const mTop=Math.round(H*.84);
  const mBot=Math.round(H*.95);

  const bs=Math.max(
    10,
    Math.round(W*.05)
  );

  const rows=Math.max(
    3,
    Math.round(
      (crown-top)/(bs*.55)
    )
  );

  const rh0=(crown-top)/rows;

  const md=(a,n)=>
    ((a%n)+n)%n;


  /* main wall */

  for(let r=0;r<rows;r++){

    const y=Math.round(
      top+r*rh0
    );

    const y2=Math.round(
      top+(r+1)*rh0
    );

    for(
      let x=-(r%2)*bs/2;
      x<W;
      x+=bs
    ){

      const l=
        30+
        r*6+
        md(
          Math.round(x)*7+r*13,
          5
        )*4;

      c.fillStyle=
        `rgb(${l},${l+4},${l+9})`;

      c.fillRect(
        Math.round(x),
        y,
        Math.round(bs)-1,
        y2-y-1
      );
    }
  }

  c.fillStyle='rgba(0,0,0,.4)';

  c.fillRect(
    0,
    top,
    W,
    Math.round((crown-top)*.3)
  );

  c.fillStyle='#0a0c0e';

  c.fillRect(
    0,
    crown-1,
    W,
    1
  );


  /* lower wall */

  const fh=Math.max(
    5,
    Math.round(H*.025)
  );

  c.fillStyle='#17181a';

  c.fillRect(
    0,
    mBot,
    W,
    H-mBot
  );

  for(
    let y=mBot,r=0;
    y<H;
    y+=fh,r++
  ){

    for(
      let x=-(r%2)*bs;
      x<W;
      x+=bs*2
    ){

      const l=
        38+
        md(
          Math.round(x)*5+r*3,
          3
        )*4;

      c.fillStyle=
        `rgb(${l},${l+1},${l+4})`;

      c.fillRect(
        Math.round(x),
        y+1,
        Math.round(bs*2)-1,
        fh-1
      );
    }
  }


  /* =====================================================
     FRONT WALL + CRENELLATIONS
  ===================================================== */

  [front,c]=mk(W,H);

  for(let r=0;r<2;r++){

    const y=
      crown+
      Math.round(
        r*(mBot-crown)/2
      );

    const y2=
      crown+
      Math.round(
        (r+1)*(mBot-crown)/2
      );

    for(
      let x=-(r%2)*bs/2;
      x<W;
      x+=bs
    ){

      const l=
        66-
        r*16+
        md(
          Math.round(x)*3+r,
          3
        )*4;

      c.fillStyle=
        `rgb(${l},${l+4},${l+8})`;

      c.fillRect(
        Math.round(x),
        y,
        Math.round(bs)-1,
        y2-y-1
      );
    }
  }

  c.fillStyle='#98a0a8';

  c.fillRect(
    0,
    crown,
    W,
    1
  );

  c.fillStyle='#0d0f12';

  c.fillRect(
    0,
    mBot-1,
    W,
    1
  );


  /* crenellations */

  const mw=Math.max(
    12,
    Math.round(W*.07)
  );

  const per=Math.round(mw*1.65);

  const mh=crown-mTop;

  const q4=Math.max(
    2,
    mw>>2
  );


  for(let k=-30;k<30;k++){

    const x=Math.round(
      W/2+
      (k+.5)*per-
      mw/2
    );

    if(x>W||x+mw<0)continue;

    c.fillStyle='#5b626a';

    c.fillRect(
      x,
      mTop,
      mw,
      mh
    );

    c.fillStyle='#474d54';

    c.fillRect(
      x+mw-q4,
      mTop,
      q4,
      mh
    );

    c.fillStyle='#808890';

    c.fillRect(
      x-1,
      mTop-2,
      mw+2,
      3
    );

    c.fillStyle='#2c3136';

    c.fillRect(
      x-1,
      mTop+1,
      mw+2,
      1
    );

    c.fillRect(
      x,
      mTop+(mh>>1),
      mw,
      1
    );

    c.fillRect(
      x+(mw>>1),
      mTop+1,
      1,
      mh>>1
    );

    c.fillRect(
      x+(mw>>2),
      mTop+(mh>>1),
      1,
      mh>>1
    );

    if(md(k*7,4)===0){

      c.fillStyle='#35523a';

      c.fillRect(
        x+2,
        mTop+mh-3,
        3,
        2
      );
    }
  }
}

   FOG / VIGNETTE
========================================================= */

function buildFog(){

  const[c,x]=mk(256,128);

  const gr=x.createRadialGradient(
    128,64,0,
    128,64,128
  );

  gr.addColorStop(
    0,
    'rgba(120,150,165,1)'
  );

  gr.addColorStop(
    1,
    'rgba(120,150,165,0)'
  );

  x.save();

  x.scale(1,.5);

  x.fillStyle=gr;

  x.fillRect(
    0,
    0,
    256,
    256
  );

  x.restore();

  fogS=c;
}

function buildVig(){

  let c;

  [vig,c]=mk(W,H);

  const gr=c.createRadialGradient(
    W/2,H*.5,
    Math.min(W,H)*.3,
    W/2,H*.5,
    Math.hypot(W,H)*.6
  );

  gr.addColorStop(
    0,
    'rgba(0,0,0,0)'
  );

  gr.addColorStop(
    1,
    'rgba(0,0,0,.72)'
  );

  c.fillStyle=gr;

  c.fillRect(
    0,
    0,
    W,
    H
  );
}


/* =========================================================
   PARTICLES
========================================================= */

function pt(
  x,y,vx,vy,
  life,col,sz,type,grav
){

  if(parts.length>500)return;

  parts.push({
    x,y,vx,vy,
    life,
    max:life,
    col,
    sz,
    type:type||'c',
    grav:grav||0
  });
}

function burst(
  x,y,n,col,
  spd,sz,grav
){

  for(let i=0;i<n;i++){

    const a=rnd(0,6.28);

    const s=
      rnd(.3,1)*
      spd*.35;

    pt(
      x,
      y,
      Math.cos(a)*s,
      Math.sin(a)*s-spd*.3,
      rnd(.3,.7),
      col,
      rnd(.6,1)*sz,
      'c',
      (grav||500)*.35
    );
  }
}


/* =========================================================
   GAME FLOW
========================================================= */

function startWave(w){

  wave=w;

  queue=[];

  const n=
    w<=3
    ?5+5*w
    :20+4*(w-3);


  for(let i=0;i<n;i++){

    const r=Math.random();

    let k='orc';

    if(
      w>=6 &&
      r<.08+.02*(w-6)
    ){
      k='elite';

    }else if(
      w>=3 &&
      r<.1+.025*w
    ){
      k='heavy';

    }else if(
      w>=2 &&
      r<.3
    ){
      k='fast';
    }

    queue.push(k);
  }

  spT=3;
  banT=3;

  banTxt=
    'WAVE '+
    String(w).padStart(2,'0');

  st='play';

  nextIn=0;

  SFX.wave();

  $('shop').classList.remove('on');
}


function spawn(){

  const k=queue.pop();

  const T=TY[k];

  const z=95+rnd(0,3);

  orcs.push({

    k,

    hp:T.hp*(1+.04*(wave-1)),

    mhp:T.hp*(1+.04*(wave-1)),

    z,

    x:0,

    off:rnd(-4,4),

    lane:rnd(-34,34),

    stop:
      1.2+
      rnd(0,4)+
      (k==='heavy'?1:0),

    st:'walk',

    ph:rnd(0,6),

    at:rnd(0,.6),

    hit:0,

    dd:0,

    al:0,

    sv:rnd(.9,1.1),

    fall:
      Math.random()<.5
      ?1
      :-1,

    sx:0,
    sy:0,
    h:10
  });
}


function endWave(){

  const b=40+12*wave;

  gold+=b;
  goldTotal+=b;

  if(wave>=WAVES){

    st='win';

    setTimeout(
      showEnd,
      1800,
      true
    );

    SFX.win();

    banTxt='CASTLE DEFENDED';

    banT=3;

    return;
  }

  st='clear';

  ct=2.4;

  banTxt='WAVE CLEARED';

  banT=2.4;

  SFX.win();

  hp=Math.min(
    maxHP,
    hp+maxHP*.2
  );
}


function openShop(){

  st='shop';

  const s=$('shop');

  s.innerHTML=
    `<h2>WAVE ${wave} SURVIVED</h2>`+
    `<div class="st gold">Gold: ${gold}</div>`+
    `<p>Castle repaired: ${Math.ceil(hp)} / ${maxHP}</p>`+
    UP.map(u=>{

      const lv=up[u[0]];
      const c=cost(u[0]);
      const mx2=lv>=MAXLV;

      return`
      <div class="up">

        <span>
          <b>${u[1]}</b>
          · Lv ${lv}/${MAXLV}

          <small>${u[2]}</small>
        </span>

        <button
          data-k="${u[0]}"
          ${mx2||gold<c?'disabled':''}
        >
          ${mx2?'MAX':c+' g'}
        </button>

      </div>`;

    }).join('')+

    `<button id="bNext">
      SUMMON NEXT WAVE
    </button>`;

  s.classList.add('on');

  s.querySelectorAll('[data-k]')
    .forEach(b=>{

      b.onclick=()=>{

        const k=b.dataset.k;
        const c=cost(k);

        if(
          gold<c||
          up[k]>=MAXLV
        )return;

        gold-=c;

        up[k]++;

        if(k==='hp'){

          maxHP+=150;
          hp+=150;
        }

        SFX.hit();

        openShop();
      };
    });


  $('bNext').onclick=()=>{

    initAudio();

    startWave(wave+1);
  };
}


function showEnd(won){

  const e=$('end');

  const acc=
    shots
    ?Math.round(hits/shots*100)
    :0;

  e.innerHTML=

    won

    ?

    `<h1>CASTLE DEFENDED</h1>

     <div class="st">
       WAVE REACHED: ${wave}
     </div>

     <div class="st">
       ORCS SLAIN: ${kills}
     </div>

     <div class="st">
       ACCURACY: ${acc}%
     </div>

     <div class="st gold">
       GOLD EARNED: ${goldTotal}
     </div>

     <button id="bRe">
       NEW GAME
     </button>`

    :

    `<h1 style="color:#a8352a">
       CASTLE FALLEN
     </h1>

     <div class="st">
       WAVE REACHED: ${wave}
     </div>

     <div class="st">
       ORCS SLAIN: ${kills}
     </div>

     <div class="st">
       ACCURACY: ${acc}%
     </div>

     <button id="bRe">
       RESTART
     </button>`;


  e.classList.add('on');


  $('bRe').onclick=()=>{

    e.classList.remove('on');

    reset();

    startWave(1);
  };
}


function gameOver(){

  st='over';

  hp=0;

  SFX.lose();

  banT=0;

  setTimeout(
    showEnd,
    1600,
    false
  );
}


/* =========================================================
   ARCHER
========================================================= */

function geo(){

  const AH=
    Math.min(
      H*.24,
      W*.5
    );

  const u=AH/10;

  const axp=
    W/2+
    ax*PX;

  const fy=H*.975;

  const sx=axp;

  const sy=
    fy-
    7.4*u;

  let a=Math.atan2(
    my-sy,
    mx-sx
  );

  a=clamp(
    a,
    -3.0,
    -.12
  );

  const dx=Math.cos(a);
  const dy=Math.sin(a);

  const kick=
    rec>0
    ?rec*u*8
    :0;

  return{
    AH,
    u,
    axp,
    fy,
    sx,
    sy,
    a,
    dx,
    dy,
    gx:sx+dx*(4.4*u-kick),
    gy:sy+dy*(4.4*u-kick)
  };
}


function startDraw(){

  if(
    (st==='play'||st==='clear')&&
    !drawing&&
    rec<=0
  ){

    initAudio();

    drawing=true;

    p=0;

    SFX.draw();
  }
}


function release(){

  if(drawing)
    fire();
}


function fire(){

  drawing=false;

  const q=geo();

  const pw=.6+.4*p;

  shots++;

  const tx=mx;
  const ty=my;

  const dist=Math.hypot(
    tx-q.gx,
    ty-q.gy
  );

  const dur=clamp(
    dist/(U*1.7),
    .22,
    .9
  );

  arrows.push({

    sx:q.gx,
    sy:q.gy,

    tx,
    ty,

    t:0,

    dur,

    arc:
      Math.min(
        dist*.1,
        U*.08
      ),

    st:
      clamp(
        (ty-HOR)/(WALLY-HOR),
        .15,
        1
      ),

    pw,

    x:q.gx,
    y:q.gy,

    vx:q.dx,
    vy:q.dy,

    sc:1,

    stuck:false,

    sl:0
  });

  p=0;

  rec=.14;

  SFX.shoot();

  for(let i=0;i<4;i++){

    pt(
      q.gx,
      q.gy,
      rnd(-30,30),
      rnd(-40,0),
      .3,
      'rgba(200,200,190,.5)',
      2,
      'c',
      0
    );
  }
}


function hitOrc(o,a){

  const T=TY[o.k];

  const crit=
    Math.random()<critCh();

  let d=
    dmgBase()*
    a.pw*
    (crit?critMul():1)-
    T.armor;

  d=Math.max(2,d);

  o.hp-=d;

  o.hit=.12;

  hits++;

  const ex=a.x;
  const ey=a.y;

  burst(
    ex,
    ey,
    crit?14:8,
    '#7a1612',
    260,
    2.4,
    700
  );

  burst(
    ex,
    ey,
    3,
    '#d7c9a0',
    200,
    1.4,
    500
  );

  pt(
    ex,
    ey-o.h*.1,
    rnd(-15,15),
    -60,
    .8,
    crit?'#ffcc44':'#f0e8d0',
    crit?1.3:1,
    't',
    0
  );

  parts[parts.length-1].txt=
    Math.round(d)+
    (crit?'!':'');

  SFX.hit();

  if(o.st==='walk'){

    o.z=Math.min(
      97,
      o.z+
      (o.k==='heavy'?.4:.9)
    );
  }

  if(o.hp<=0){

    o.st='dead';

    o.dd=0;

    kills++;

    gold+=T.gold;
    goldTotal+=T.gold;

    SFX.kill();

    burst(
      o.sx,
      o.sy-o.h*.4,
      14,
      '#5a0f0c',
      260,
      2.8,
      700
    );
  }
}


function wallHit(o){

  const T=TY[o.k];

  hp-=
    T.dmg*
    (1+.04*(wave-1));

  shake=
    Math.min(
      3,
      shake+1+T.dmg*.05
    );

  SFX.wall();

  burst(
    o.sx,
    WALLY+(H*.05),
    6,
    '#8c9096',
    200,
    2,
    600
  );

  if(hp<=0)
    gameOver();
}


/* =========================================================
   UPDATE
========================================================= */

function update(dt){

  t+=dt;

  if(banT>0)
    banT-=dt;

  shake*=Math.pow(.02,dt);

  const live=
    st==='play'||
    st==='clear';

  const dir=
    (
      (keys.ArrowRight||keys.KeyD)
      ?1
      :0
    )-
    (
      (keys.ArrowLeft||keys.KeyA)
      ?1
      :0
    )+
    touchDir;

  const spd=
    26*
    (1+.12*up.spd);

  if(live){

    avx+=
      (
        clamp(dir,-1,1)*spd-avx
      )*
      Math.min(1,dt*9);

    ax=clamp(
      ax+avx*dt,
      -36,
      36
    );
  }

  if(drawing){

    p=Math.min(
      1,
      p+dt/drawTime()
    );

  }else{

    p=Math.max(
      0,
      p-dt*8
    );
  }

  if(rec>0)
    rec-=dt;


  if(st==='play'){

    if(queue.length){

      spT-=dt;

      if(spT<=0){

        const n=
          Math.random()<.25
          ?2
          :1;

        for(
          let i=0;
          i<n&&queue.length;
          i++
        ){
          spawn();
        }

        spT=
          Math.max(
            .45,
            1.7-wave*.1
          )*
          rnd(.6,1.3);
      }

    }else if(
      !orcs.some(
        o=>o.st!=='dead'
      )
    ){

      endWave();
    }

    drumT-=dt;

    if(
      drumT<=0&&
      orcs.length
    ){

      SFX.drum();

      drumT=.95;
    }
  }


  if(st==='clear'){

    ct-=dt;

    if(ct<=0)
      openShop();
  }


  /* enemies */

  for(
    let i=orcs.length-1;
    i>=0;
    i--
  ){

    const o=orcs[i];
    const T=TY[o.k];

    if(o.hit>0)
      o.hit-=dt;


    if(o.st==='dead'){

      o.dd+=dt;

      if(o.dd>1.1){

        orcs.splice(i,1);

        continue;
      }

    }else if(st!=='over'){

      if(o.st==='walk'){

        o.z-=
          T.spd*
          o.sv*
          dt;

        o.ph+=
          dt*
          (3+T.spd*.75);

        if(o.z<=o.stop){

          o.z=o.stop;

          o.st='atk';
        }

      }else{

        o.at+=dt;

        if(o.at>=T.cd){

          o.at=0;

          wallHit(o);
        }
      }

      o.al=
        Math.min(
          1,
          (97-o.z)/5
        );

      const b=
        clamp(
          (58-o.z)/40,
          0,
          1
        );

      o.x=
        (
          roadX(o.z)+o.off
        )*
        (1-b)+
        o.lane*b;

      o.sx=
        PXs(o.x,o.z);

      o.sy=
        PY(o.z);

      o.h=
        Math.max(
          U*.17*T.sz*
          Math.pow(sc(o.z),.8),
          9*T.sz
        );
    }
  }


  /* arrows */

  for(
    let i=arrows.length-1;
    i>=0;
    i--
  ){

    const a=arrows[i];

    if(a.stuck){

      a.sl-=dt;

      if(a.sl<=0)
        arrows.splice(i,1);

      continue;
    }

    a.t+=dt/a.dur;

    const tt=
      Math.min(
        a.t,
        1
      );

    a.x=
      a.sx+
      (a.tx-a.sx)*tt;

    a.y=
      a.sy+
      (a.ty-a.sy)*tt-
      a.arc*4*tt*(1-tt);

    a.vx=
      a.tx-a.sx;

    a.vy=
      (a.ty-a.sy)-
      a.arc*4*(1-2*tt);

    a.sc=
      lerp(
        1,
        a.st,
        tt
      );


    if(tt>.4){

      let best=null;

      for(const o of orcs){

        if(
          o.st==='dead'||
          o.al<.5
        )continue;

        if(
          Math.abs(a.x-o.sx)<
          o.h*.32&&
          a.y<o.sy+o.h*.05&&
          a.y>o.sy-o.h*1.02&&
          (!best||o.z<best.z)
        ){
          best=o;
        }
      }

      if(best){

        hitOrc(best,a);

        arrows.splice(i,1);

        continue;
      }
    }


    if(a.t>=1){

      a.stuck=true;

      a.sl=1.6;

      burst(
        a.x,
        a.y,
        5,
        '#4a4030',
        120,
        1.6,
        300
      );

      SFX.miss();
    }
  }


  /* particles */

  for(
    let i=parts.length-1;
    i>=0;
    i--
  ){

    const q=parts[i];

    q.life-=dt;

    if(q.life<=0){

      parts[i]=parts[parts.length-1];

      parts.pop();

      continue;
    }

    q.vy+=q.grav*dt;

    q.x+=q.vx*dt;
    q.y+=q.vy*dt;
  }


  const tp=torches();

  for(const tq of tp){

    if(Math.random()<dt*7){

      pt(
        tq.x+rnd(-3,3),
        tq.y-tq.s*2,
        rnd(-8,8),
        rnd(-50,-25),
        rnd(.8,1.6),
        '255,150,60',
        rnd(.8,1.6),
        'e',
        -8
      );
    }
  }


  for(const m of mot){

    m.x=
      (m.x+
      dt*.012*m.s+
      1)%1;

    m.y+=
      Math.sin(
        t*.5+m.s*9
      )*
      dt*.004;
  }
}


/* =========================================================
   TORCHES
========================================================= */

function torches(){

  const mw=Math.max(
    12,
    Math.round(W*.07)
  );

  const per=Math.round(
    mw*1.65
  );

  const s=Math.max(
    2,
    Math.round(U*.011)
  );

  const r=[];

  [.18,.38,.62,.82].forEach(f=>{

    const k=Math.round(
      (W*f-W/2)/per-.5
    );

    r.push({

      x:Math.round(
        W/2+
        (k+.5)*per
      ),

      y:Math.round(
        H*.855
      ),

      s
    });
  });

  return r;
}


/* =========================================================
   TREES
========================================================= */

function pine(x,y,h,it){

  const sw=
    Math.sin(
      t*.9+it.seed
    )*
    h*.012;

  const w=h*.3;

  g.fillStyle=it.c0;

  g.fillRect(
    x-h*.03,
    y-h*.22,
    h*.06,
    h*.22
  );

  for(let i=0;i<4;i++){

    const by=
      y-
      h*(.12+.19*i);

    const ay=
      by-
      h*.36;

    const hw=
      w*(1-.2*i);

    const ox=
      sw*(i+1)/4;

    g.fillStyle=it.c1;

    g.beginPath();

    g.moveTo(
      x+ox*1.4,
      ay
    );

    g.lineTo(
      x+hw+ox*.4,
      by
    );

    g.lineTo(
      x-hw+ox*.4,
      by
    );

    g.fill();

    g.fillStyle=it.c2;

    g.beginPath();

    g.moveTo(
      x+ox*1.4,
      ay
    );

    g.lineTo(
      x-hw*.15+ox*.4,
      by
    );

    g.lineTo(
      x-hw+ox*.4,
      by
    );

    g.fill();

    g.fillStyle=it.c3;

    g.beginPath();

    g.moveTo(
      x+ox*1.4,
      ay
    );

    g.lineTo(
      x-hw*.5+ox*.4,
      by-h*.08
    );

    g.lineTo(
      x-hw*.62+ox*.4,
      by-h*.02
    );

    g.fill();
  }
}


function dead(x,y,h,it){

  const sw=
    Math.sin(
      t*.7+it.seed
    )*
    h*.01;

  g.strokeStyle=it.c0;

  g.lineCap='round';

  g.lineWidth=
    Math.max(
      1.5,
      h*.05
    );

  g.beginPath();

  g.moveTo(x,y);

  g.quadraticCurveTo(
    x+h*.05,
    y-h*.5,
    x+sw,
    y-h*.95
  );

  g.stroke();

  g.lineWidth=
    Math.max(
      1,
      h*.025
    );

  [
    [.4,-.3],
    [.55,.3],
    [.7,-.22],
    [.82,.18]
  ].forEach(b=>{

    g.beginPath();

    g.moveTo(
      x+h*.03,
      y-h*b[0]
    );

    g.lineTo(
      x+h*b[1]+sw,
      y-h*(b[0]+.14)
    );

    g.stroke();
  });

  g.strokeStyle=it.c1;

  g.lineWidth=
    Math.max(
      1,
      h*.03
    );

  g.beginPath();

  g.moveTo(
    x-h*.05,
    y
  );

  g.lineTo(
    x-h*.14,
    y+h*.02
  );

  g.moveTo(
    x+h*.05,
    y
  );

  g.lineTo(
    x+h*.14,
    y+h*.02
  );

  g.stroke();
}


/* =========================================================
   ITEMS
========================================================= */

function drawItem(it){

  const s=sc(it.z);

  const x=PXs(it.x,it.z);
  const y=PY(it.z);

  if(
    x<-120||
    x>W+120
  )return;


  if(
    it.k==='t'||
    it.k==='d'
  ){

    const h=
      it.h*
      U*.01*
      Math.pow(s,.9);

    it.k==='t'
      ?pine(x,y,h,it)
      :dead(x,y,h,it);

  }else if(it.k==='b'){

    const h=
      it.h*
      U*.01*
      Math.pow(s,.9);

    const sw=
      Math.sin(
        t*1.1+it.seed
      )*
      h*.04;

    g.fillStyle=it.c1;

    g.beginPath();

    g.ellipse(
      x,
      y-h*.3,
      h*.8,
      h*.45,
      0,
      0,
      7
    );

    g.fill();

    g.beginPath();

    g.ellipse(
      x-h*.5+sw,
      y-h*.25,
      h*.5,
      h*.35,
      0,
      0,
      7
    );

    g.fill();

    g.fillStyle=it.c2;

    g.beginPath();

    g.ellipse(
      x+h*.1+sw,
      y-h*.5,
      h*.45,
      h*.22,
      0,
      0,
      7
    );

    g.fill();

  }else if(it.k==='r'){

    const h=
      it.h*
      U*.01*
      Math.pow(s,.9);

    g.fillStyle=it.c1;

    g.beginPath();

    g.moveTo(
      x-h,
      y
    );

    g.lineTo(
      x-h*.7,
      y-h*.8
    );

    g.lineTo(
      x+h*.2,
      y-h*1.1
    );

    g.lineTo(
      x+h,
      y-h*.3
    );

    g.lineTo(
      x+h*.9,
      y
    );

    g.fill();

    g.fillStyle=it.c2;

    g.beginPath();

    g.moveTo(
      x-h*.7,
      y-h*.8
    );

    g.lineTo(
      x+h*.2,
      y-h*1.1
    );

    g.lineTo(
      x+h*.1,
      y-h*.7
    );

    g.fill();

  }else{

    const h=
      it.h*
      U*.01*
      Math.pow(s,.9);

    const sw=
      Math.sin(
        t*1.6+it.seed
      )*
      h*.35;

    g.strokeStyle=it.c1;

    g.lineWidth=
      Math.max(
        1,
        h*.12
      );

    g.beginPath();

    for(let i=-1;i<=1;i++){

      g.moveTo(
        x+i*h*.25,
        y
      );

      g.lineTo(
        x+i*h*.5+sw,
        y-h*(1-Math.abs(i)*.2)
      );
    }

    g.stroke();
  }
}


/* =========================================================
   ORC
========================================================= */

function drawOrc(o){

  const T=TY[o.k];

  const x=o.sx;
  const y=o.sy;

  const h=o.h;

  const u=h/10;

  if(
    x<-h||
    x>W+h
  )return;

  g.save();

  g.globalAlpha=o.al;

  g.fillStyle='rgba(0,0,0,.4)';

  g.beginPath();

  g.ellipse(
    x,
    y,
    u*3.2,
    u*.9,
    0,
    0,
    7
  );

  g.fill();


  if(o.st==='dead'){

    const k=
      Math.min(
        1,
        o.dd/.6
      );

    g.translate(
      x,
      y
    );

    g.rotate(
      k*1.45*o.fall
    );

    g.translate(
      -x,
      -y
    );

    g.globalAlpha=
      o.al*
      (
        1-
        Math.max(
          0,
          (o.dd-.6)/.5
        )
      );
  }


  const hit=o.hit>0;

  const S=c=>
    hit
    ?'#f2e8d2'
    :c;

  const wk=
    o.st==='walk'
    ?Math.sin(o.ph)
    :0;

  const bob=
    Math.abs(wk)*u*.3;

  const bw=
    T.w*u*.62;

  const sw=
    o.st==='atk'
    ?o.at/T.cd
    :0;


  /* legs */

  g.fillStyle=S('#211a14');

  const lw=u*1.25;

  g.fillRect(
    x-bw*.55-lw/2,
    y-3.6*u-bob,
    lw,
    3.6*u+bob-
    Math.max(0,wk)*u*.9
  );

  g.fillRect(
    x+bw*.55-lw/2,
    y-3.6*u-bob,
    lw,
    3.6*u+bob-
    Math.max(0,-wk)*u*.9
  );


  /* boots */

  g.fillStyle=S('#120e0b');

  g.fillRect(
    x-bw*.55-lw/2-u*.15,
    y-u*.7-
    Math.max(0,wk)*u*.9,
    lw+u*.3,
    u*.7
  );

  g.fillRect(
    x+bw*.55-lw/2-u*.15,
    y-u*.7-
    Math.max(0,-wk)*u*.9,
    lw+u*.3,
    u*.7
  );


  /* body */

  g.fillStyle=S(T.arm);

  g.fillRect(
    x-bw,
    y-7.3*u-bob,
    bw*2,
    4.1*u
  );

  g.fillStyle=S(T.col);

  g.fillRect(
    x-bw*.32,
    y-6.8*u-bob,
    bw*.64,
    2.3*u
  );

  g.fillStyle=S('#140f0b');

  g.fillRect(
    x-bw,
    y-4.2*u-bob,
    bw*2,
    .7*u
  );


  /* armor */

  if(
    o.k==='heavy'||
    o.k==='elite'
  ){

    g.fillStyle=S(
      o.k==='heavy'
      ?'#6f757c'
      :'#3a2226'
    );

    [-1,1].forEach(sd=>{

      g.beginPath();

      g.arc(
        x+sd*bw,
        y-7*u-bob,
        1.35*u,
        0,
        7
      );

      g.fill();

      if(o.k==='elite'){

        g.fillStyle=S('#9a9ea4');

        g.beginPath();

        g.moveTo(
          x+sd*bw+sd*.6*u,
          y-7.6*u-bob
        );

        g.lineTo(
          x+sd*bw+sd*1.8*u,
          y-9.2*u-bob
        );

        g.lineTo(
          x+sd*bw-sd*.2*u,
          y-8.3*u-bob
        );

        g.fill();

        g.fillStyle=S('#3a2226');
      }
    });
  }


  /* arms */

  g.strokeStyle=S(T.col);

  g.lineCap='round';

  g.lineWidth=u*1.15;

  g.beginPath();

  g.moveTo(
    x-bw,
    y-6.8*u-bob
  );

  g.lineTo(
    x-bw-.5*u,
    y-4.2*u-bob+
    wk*.5*u
  );

  g.stroke();


  let th=
    o.st==='atk'
    ?
      (
        sw<.7
        ?
          .3-sw/.7*1.5
        :
          -1.2+(sw-.7)/.3*3.6
      )
    :
      .7+wk*.18;


  const shx=x+bw;
  const shy=y-6.8*u-bob;

  const hx=
    shx+
    Math.sin(th)*2.6*u;

  const hy=
    shy-
    Math.cos(th)*2.6*u;


  g.beginPath();

  g.moveTo(
    shx,
    shy
  );

  g.lineTo(
    hx,
    hy
  );

  g.stroke();


  const wl=
    (
      o.k==='heavy'
      ?5.6
      :o.k==='elite'
      ?6.5
      :o.k==='fast'
      ?3
      :4.4
    )*u;

  const ex=
    hx+
    Math.sin(th)*wl;

  const ey=
    hy-
    Math.cos(th)*wl;


  g.strokeStyle=S(
    o.k==='elite'||
    o.k==='fast'
    ?'#8d9298'
    :'#4a3320'
  );

  g.lineWidth=
    u*
    (
      o.k==='orc'
      ?.9
      :.6
    );

  g.beginPath();

  g.moveTo(hx,hy);
  g.lineTo(ex,ey);

  g.stroke();


  if(o.k==='orc'){

    g.fillStyle=S('#3a2816');

    g.beginPath();

    g.arc(
      ex,
      ey,
      u*.9,
      0,
      7
    );

    g.fill();

  }else if(o.k==='heavy'){

    g.fillStyle=S('#7a8087');

    g.save();

    g.translate(ex,ey);
    g.rotate(th);

    g.fillRect(
      -u*1.4,
      -u*.8,
      u*2.8,
      u*1.6
    );

    g.restore();

  }else if(o.k==='elite'){

    g.strokeStyle=
      hit
      ?'#fff'
      :'rgba(255,60,40,.55)';

    g.lineWidth=u*.25;

    g.beginPath();

    g.moveTo(hx,hy);
    g.lineTo(ex,ey);

    g.stroke();
  }


  g.fillStyle=S(T.col);

  g.beginPath();

  g.arc(
    hx,
    hy,
    u*.7,
    0,
    7
  );

  g.fill();


  /* head */

  const hy2=
    y-8.7*u-bob;

  g.fillStyle=S(T.col);

  g.beginPath();

  g.arc(
    x,
    hy2,
    1.55*u,
    0,
    7
  );

  g.fill();


  if(o.k==='heavy'){

    g.fillStyle=S('#6f757c');

    g.beginPath();

    g.arc(
      x,
      hy2-.1*u,
      1.7*u,
      Math.PI,
      0
    );

    g.fill();

    g.fillRect(
      x-1.7*u,
      hy2-.2*u,
      3.4*u,
      .45*u
    );
  }


  if(o.k==='elite'){

    g.fillStyle=S('#26181a');

    g.beginPath();

    g.arc(
      x,
      hy2-.1*u,
      1.7*u,
      Math.PI,
      0
    );

    g.fill();

    g.fillStyle=S('#cfc8b0');

    [-1,1].forEach(sd=>{

      g.beginPath();

      g.moveTo(
        x+sd*1.4*u,
        hy2-.8*u
      );

      g.quadraticCurveTo(
        x+sd*2.6*u,
        hy2-1.4*u,
        x+sd*2.4*u,
        hy2-3*u
      );

      g.lineTo(
        x+sd*1.8*u,
        hy2-1.2*u
      );

      g.fill();
    });
  }


  if(o.k==='fast'){

    g.fillStyle=S('#9a2a22');

    g.fillRect(
      x-1.6*u,
      hy2-.9*u,
      3.2*u,
      .5*u
    );
  }


  /* eyes */

  g.fillStyle=
    hit
    ?'#fff'
    :
      (
        o.k==='elite'
        ?'#ff3a24'
        :'#ffd23a'
      );

  g.fillRect(
    x-.8*u,
    hy2-.2*u,
    .5*u,
    .4*u
  );

  g.fillRect(
    x+.3*u,
    hy2-.2*u,
    .5*u,
    .4*u
  );


  /* teeth */

  g.fillStyle='#e8e0c8';

  g.beginPath();

  g.moveTo(
    x-.8*u,
    hy2+.9*u
  );

  g.lineTo(
    x-.5*u,
    hy2+.2*u
  );

  g.lineTo(
    x-.3*u,
    hy2+.9*u
  );

  g.moveTo(
    x+.8*u,
    hy2+.9*u
  );

  g.lineTo(
    x+.5*u,
    hy2+.2*u
  );

  g.lineTo(
    x+.3*u,
    hy2+.9*u
  );

  g.fill();


  /* HP */

  if(
    o.hp<o.mhp&&
    o.st!=='dead'
  ){

    const bwid=u*4;

    g.fillStyle='rgba(0,0,0,.6)';

    g.fillRect(
      x-bwid/2,
      y-h*1.08,
      bwid,
      Math.max(2,u*.4)
    );

    g.fillStyle='#9a2a22';

    g.fillRect(
      x-bwid/2,
      y-h*1.08,
      bwid*o.hp/o.mhp,
      Math.max(2,u*.4)
    );
  }

  g.restore();
}


/* =========================================================
   ARCHER
========================================================= */

function drawArcher(){

  const q=geo();

  const u=q.u;
  const x=q.axp;
  const fy=q.fy;

  const R=(
    a,b,c,d
  )=>g.fillRect(
    Math.round(a),
    Math.round(b),
    Math.max(1,Math.round(c)),
    Math.max(1,Math.round(d))
  );

  const sw=
    Math.sin(t*1.6)*.12*u-
    avx*.025*u;

  const bs=
    q.dx<0
    ?-1
    :1;


  g.save();


  /* shadow */

  g.fillStyle='rgba(0,0,0,.4)';

  R(
    x-3.4*u,
    fy-.4*u,
    6.8*u,
    .8*u
  );


  /* legs */

  g.fillStyle='#26262b';

  R(
    x-1.8*u,
    fy-3.6*u,
    1.6*u,
    3.1*u
  );

  R(
    x+.2*u,
    fy-3.6*u,
    1.6*u,
    3.1*u
  );


  /* boots */

  g.fillStyle='#17120e';

  R(
    x-2*u,
    fy-1*u,
    1.9*u,
    1*u
  );

  R(
    x+.1*u,
    fy-1*u,
    1.9*u,
    1*u
  );


  /* quiver */

  g.save();

  g.translate(
    Math.round(
      x-bs*.6*u
    ),
    Math.round(
      fy-5.2*u
    )
  );

  g.rotate(-bs*.35);

  g.fillStyle='#5a3d24';

  R(
    -.65*u,
    -3.2*u,
    1.3*u,
    4.2*u
  );

  g.fillStyle='#2f2014';

  R(
    -.65*u,
    -.6*u,
    1.3*u,
    .5*u
  );

  g.fillStyle='#d0c8ac';

  R(
    -.6*u,
    -3.9*u,
    .4*u,
    .8*u
  );

  g.fillStyle='#a33a2c';

  R(
    -.1*u,
    -4.1*u,
    .4*u,
    .9*u
  );

  g.fillStyle='#d0c8ac';

  R(
    .35*u,
    -3.8*u,
    .4*u,
    .7*u
  );

  g.restore();


  /* cloak */

  const n=14;
  const y0=fy-7.9*u;
  const hh=6.4*u;

  for(let i=0;i<n;i++){

    const k=i/(n-1);

    const w=
      (2.4+.9*k)*u;

    const o=sw*k;

    const y=
      y0+k*hh;

    g.fillStyle='#222c28';

    R(
      x-w+o,
      y,
      2*w,
      hh/n+1
    );

    g.fillStyle='#2e3b36';

    R(
      x-.3*u+o,
      y,
      .6*u,
      hh/n+1
    );

    g.fillStyle='#161d1a';

    R(
      x+w-.7*u+o,
      y,
      .7*u,
      hh/n+1
    );
  }


  /* belt */

  g.fillStyle='#4a3220';

  R(
    x-2.9*u,
    fy-8*u,
    5.8*u,
    1*u
  );

  g.fillStyle='#6a4a2c';

  R(
    x-2.9*u,
    fy-8*u,
    5.8*u,
    .3*u
  );

  R(
    x-2.6*u,
    fy-4.4*u+sw*.3,
    5.2*u,
    .5*u
  );


  /* hood/head */

  g.fillStyle='#26302b';

  R(
    x-1.5*u,
    fy-10*u,
    3*u,
    2.2*u
  );

  R(
    x-1.1*u,
    fy-10.6*u,
    2.2*u,
    .8*u
  );

  R(
    x-bs*.3*u,
    fy-11.2*u,
    .9*u,
    .8*u
  );

  g.fillStyle='#161d1a';

  R(
    x+1*u,
    fy-10*u,
    .6*u,
    2.2*u
  );

  g.fillStyle='#4a5c58';

  R(
    x-1.5*u,
    fy-9.9*u,
    .3*u,
    2*u
  );

  R(
    x-1.1*u,
    fy-10.6*u,
    1.2*u,
    .3*u
  );


  /* bow */

  const d={
    x:q.dx,
    y:q.dy
  };

  const pp=-d.y;
  const pq=d.x;

  const bend=
    (1+1.1*p)*u;

  const gx=q.gx;
  const gy=q.gy;

  const nx=
    gx-
    d.x*
    (bend+2.2*u*p);

  const ny=
    gy-
    d.y*
    (bend+2.2*u*p);

  const t1=[
    gx+
    pp*3.6*u-
    d.x*bend,

    gy+
    pq*3.6*u-
    d.y*bend
  ];

  const t2=[
    gx-
    pp*3.6*u-
    d.x*bend,

    gy-
    pq*3.6*u-
    d.y*bend
  ];

  const cx=
    2*gx-
    (t1[0]+t2[0])/2;

  const cy=
    2*gy-
    (t1[1]+t2[1])/2;


  const bsx=
    x+bs*1.9*u;

  const dsx=
    x-bs*1.9*u;

  const sy=
    fy-7.4*u;


  g.lineCap='butt';
  g.lineJoin='miter';


  /* bow */

  g.strokeStyle='#33403a';

  g.lineWidth=
    Math.max(
      2,
      u*1.3
    );

  g.beginPath();

  g.moveTo(
    bsx,
    sy
  );

  g.lineTo(
    gx,
    gy
  );

  g.stroke();


  const ex=
    (dsx+nx)/2;

  const ey=
    (sy+ny)/2+
    1.1*u*p+
    .8*u;


  g.beginPath();

  g.moveTo(
    dsx,
    sy
  );

  g.lineTo(
    ex,
    ey
  );

  g.lineTo(
    nx,
    ny
  );

  g.stroke();


  /* bow string */

  g.strokeStyle='#6a4424';

  g.lineWidth=
    Math.max(
      2,
      u*.55
    );

  g.beginPath();

  g.moveTo(
    t1[0],
    t1[1]
  );

  g.quadraticCurveTo(
    cx,
    cy,
    t2[0],
    t2[1]
  );

  g.stroke();

  g.strokeStyle='#9a6a38';

  g.lineWidth=1;

  g.beginPath();

  g.moveTo(
    t1[0],
    t1[1]
  );

  g.quadraticCurveTo(
    cx,
    cy,
    t2[0],
    t2[1]
  );

  g.stroke();


  /* arrow */

  g.strokeStyle='#e0d8b8';

  g.lineWidth=1;

  g.beginPath();

  g.moveTo(
    t1[0],
    t1[1]
  );

  g.lineTo(
    nx,
    ny
  );

  g.lineTo(
    t2[0],
    t2[1]
  );

  g.stroke();


  if(
    rec<=0||
    p>0
  ){

    const ax2=
      gx+
      d.x*3.2*u;

    const ay2=
      gy+
      d.y*3.2*u;


    g.strokeStyle='#a8814f';

    g.lineWidth=
      Math.max(
        1,
        u*.2
      );

    g.beginPath();

    g.moveTo(
      nx,
      ny
    );

    g.lineTo(
      ax2,
      ay2
    );

    g.stroke();


    g.strokeStyle='#9c2f26';

    g.lineWidth=
      Math.max(
        1.5,
        u*.3
      );

    g.beginPath();

    g.moveTo(
      nx,
      ny
    );

    g.lineTo(
      nx+d.x*.9*u,
      ny+d.y*.9*u
    );

    g.stroke();


    g.fillStyle='#c8ccd0';

    g.beginPath();

    g.moveTo(
      ax2+d.x*.9*u,
      ay2+d.y*.9*u
    );

    g.lineTo(
      ax2-d.y*.3*u,
      ay2+d.x*.3*u
    );

    g.lineTo(
      ax2+d.y*.3*u,
      ay2-d.x*.3*u
    );

    g.fill();
  }


  /* hand */

  g.fillStyle='#2a1c10';

  R(
    gx-.45*u,
    gy-.45*u,
    .9*u,
    .9*u
  );

  g.fillStyle='#b98a63';

  R(
    gx-.35*u,
    gy-.35*u,
    .7*u,
    .7*u
  );

  R(
    nx-.4*u,
    ny-.4*u,
    .8*u,
    .8*u
  );


  g.restore();
}


/* =========================================================
   ARROW
========================================================= */

function drawArrow(a){

  const L=
    (U*.045)*
    a.sc+
    4;

  const an=
    Math.atan2(
      a.vy,
      a.vx
    );

  g.save();

  g.translate(
    a.x,
    a.y
  );

  g.rotate(an);

  g.globalAlpha=
    a.stuck
    ?Math.min(1,a.sl)
    :1;


  g.strokeStyle='#6f4f2c';

  g.lineWidth=
    Math.max(
      1,
      1.2*a.sc
    );

  g.beginPath();

  g.moveTo(
    -L,
    0
  );

  g.lineTo(
    0,
    0
  );

  g.stroke();


  g.fillStyle='#c4c8cc';

  g.beginPath();

  g.moveTo(
    L*.22,
    0
  );

  g.lineTo(
    -L*.02,
    -2.4*a.sc-.6
  );

  g.lineTo(
    -L*.02,
    2.4*a.sc+.6
  );

  g.fill();


  g.fillStyle='#b9b09a';

  g.beginPath();

  g.moveTo(
    -L,
    0
  );

  g.lineTo(
    -L*.8,
    -3*a.sc-.6
  );

  g.lineTo(
    -L*.72,
    0
  );

  g.lineTo(
    -L*.8,
    3*a.sc+.6
  );

  g.fill();

  g.restore();
}


/* =========================================================
   FLAME
========================================================= */

function flame(x,y,s,i){

  const fl=
    .9+
    .1*Math.sin(t*14+i*2)+
    .06*Math.sin(t*37+i);

  g.fillStyle='#1a1410';

  g.fillRect(
    x-s*1.1,
    y+s*.2,
    s*2.2,
    s*.5
  );

  g.fillStyle='#2b2f33';

  g.fillRect(
    x-s*.9,
    y+s*1.2,
    s*1.8,
    s*.3
  );

  g.fillStyle='#4a3220';

  g.fillRect(
    x-s*.38,
    y,
    s*.76,
    s*3.4
  );


  g.save();

  g.globalCompositeOperation='lighter';

  const R=U*.4;

  const gr=g.createRadialGradient(
    x,
    y-s,
    0,
    x,
    y-s,
    R
  );

  gr.addColorStop(
    0,
    `rgba(255,150,60,${.32*fl})`
  );

  gr.addColorStop(
    .4,
    `rgba(200,90,30,${.1*fl})`
  );

  gr.addColorStop(
    1,
    'rgba(200,90,30,0)'
  );

  g.fillStyle=gr;

  g.fillRect(
    x-R,
    y-s-R,
    R*2,
    R*2
  );


  const sway=
    Math.sin(t*9+i)*s*.25;

  g.fillStyle=
    `rgba(255,110,30,.9)`;

  g.beginPath();

  g.moveTo(
    x-s*.6,
    y
  );

  g.quadraticCurveTo(
    x-s*.8,
    y-s*1.3,
    x+sway,
    y-s*2.6*fl
  );

  g.quadraticCurveTo(
    x+s*.8,
    y-s*1.3,
    x+s*.6,
    y
  );

  g.fill();


  g.fillStyle=
    'rgba(255,220,120,.95)';

  g.beginPath();

  g.moveTo(
    x-s*.32,
    y
  );

  g.quadraticCurveTo(
    x-s*.4,
    y-s*.8,
    x+sway*.5,
    y-s*1.5*fl
  );

  g.quadraticCurveTo(
    x+s*.4,
    y-s*.8,
    x+s*.32,
    y
  );

  g.fill();

  g.restore();
}


/* =========================================================
   HUD
========================================================= */

function flags(){}

const goldTotal2=()=>gold;

function hud(){

  const fs=Math.max(
    8,
    Math.min(14,U*.04)
  );

  const pad=fs*.9;

  g.font=
    `bold ${fs}px monospace`;

  g.textBaseline='top';


  const T=(
    s,
    x,
    y,
    al,
    c
  )=>{

    g.textAlign=al;

    g.fillStyle='#000';

    g.fillText(
      s,
      x+1.5,
      y+1.5
    );

    g.fillStyle=
      c||'#d6cfb6';

    g.fillText(
      s,
      x,
      y
    );
  };


  const alive=
    queue.length+
    orcs.filter(
      o=>o.st!=='dead'
    ).length;


  T(
    'WAVE: '+
    String(wave).padStart(2,'0'),
    pad,
    pad,
    'left'
  );

  T(
    'ORCS SLAIN: '+kills,
    pad,
    pad+fs*1.4,
    'left',
    '#a9a48f'
  );

  T(
    'GOLD: '+goldTotal2(),
    pad,
    pad+fs*2.8,
    'left',
    '#d8b24c'
  );


  T(
    `CASTLE: ${Math.max(
      0,
      Math.ceil(hp)
    )} / ${maxHP}`,
    W-pad,
    pad,
    'right',
    hp<maxHP*.3
      ?'#d8553f'
      :'#d6cfb6'
  );


  const bwid=
    Math.min(
      W*.3,
      U*.4
    );

  const bx=
    W-pad-bwid;

  const by=
    pad+fs*1.35;


  g.fillStyle=
    'rgba(0,0,0,.6)';

  g.fillRect(
    bx-2,
    by-2,
    bwid+4,
    fs*.5+4
  );

  g.fillStyle=
    hp<maxHP*.3
    ?'#a8352a'
    :'#7c8a54';

  g.fillRect(
    bx,
    by,
    bwid*
    clamp(
      hp/maxHP,
      0,
      1
    ),
    fs*.5
  );


  T(
    'ORCS: '+alive,
    W-pad,
    by+fs*.9,
    'right',
    '#a9a48f'
  );
}


/* =========================================================
   RETICLE
========================================================= */

function reticle(){

  if(
    st==='menu'||
    st==='over'||
    st==='win'||
    st==='shop'
  )return;


  const r=
    U*.022*
    (1.5-p*.6);

  const a=
    Math.PI*2*p;


  g.save();

  g.lineWidth=2;

  g.strokeStyle=
    'rgba(0,0,0,.7)';

  g.beginPath();

  g.arc(
    mx,
    my,
    r,
    0,
    7
  );

  g.stroke();


  g.strokeStyle=
    p>=1
    ?'#ffd36a'
    :'#e6dcb4';

  g.lineWidth=1.6;

  g.beginPath();

  g.arc(
    mx,
    my,
    r,
    0,
    7
  );

  g.stroke();


  if(p>0){

    g.strokeStyle='#ffd36a';

    g.lineWidth=3;

    g.beginPath();

    g.arc(
      mx,
      my,
      r+5,
      -Math.PI/2,
      -Math.PI/2+a
    );

    g.stroke();
  }


  g.strokeStyle='#e6dcb4';

  g.lineWidth=1.6;

  g.beginPath();

  [
    [-1,0],
    [1,0],
    [0,-1],
    [0,1]
  ].forEach(d=>{

    g.moveTo(
      mx+d[0]*r*.5,
      my+d[1]*r*.5
    );

    g.lineTo(
      mx+d[0]*r*1.5,
      my+d[1]*r*1.5
    );
  });

  g.stroke();


  g.fillStyle='#e6dcb4';

  g.fillRect(
    mx-1,
    my-1,
    2,
    2
  );

  g.restore();
}


/* =========================================================
   RENDER
========================================================= */

function render(){

  g.clearRect(
    0,
    0,
    W,
    H
  );

  g.save();


  if(shake>.2){

    g.translate(
      Math.round(
        rnd(-shake,shake)
      ),
      Math.round(
        rnd(-shake,shake)
      )
    );
  }


  g.drawImage(
    bg,
    0,
    0,
    W,
    H
  );


  const os=
    orcs
    .slice()
    .sort(
      (a,b)=>b.z-a.z
    );

  let oi=0;


  for(const it of items){

    while(
      oi<os.length&&
      os[oi].z>=it.z
    ){

      drawOrc(
        os[oi++]
      );
    }

    drawItem(it);
  }


  while(oi<os.length)
    drawOrc(os[oi++]);


  /*
    ВАЖНО:
    Сначала задняя часть стены,
    затем лучник,
    затем передние зубцы.
    Поэтому лучник стоит ЗА зубцами.
  */

  g.drawImage(
    back,
    0,
    0,
    W,
    H
  );

  drawArcher();


  for(const a of arrows)
    drawArrow(a);


  g.drawImage(
    front,
    0,
    0,
    W,
    H
  );


  const tp=torches();

  tp.forEach(
    (q,i)=>
      flame(
        q.x,
        q.y,
        q.s,
        i
      )
  );

  flags();


  /* fog */

  g.save();

  for(const f of fogB){

    f.x=
      (
        f.x+
        f.v*.016+
        1.3
      )%
      1.6-
      .3;

    g.globalAlpha=f.a;

    const w=
      W*f.r*2;

    g.drawImage(
      fogS,
      f.x*W*1.0-
      w/2+
      W*.15,
      f.y*H-
      w*.12,
      w,
      w*.25
    );
  }

  g.restore();


  /* particles */

  g.save();

  g.globalCompositeOperation='lighter';

  for(const m of mot){

    g.fillStyle=
      `rgba(
        190,
        200,
        180,
        ${.12+.1*m.s}
      )`;

    g.fillRect(
      m.x*W,
      m.y*H*.9+H*.1,
      1.4,
      1.4
    );
  }

  g.restore();


  for(const q of parts){

    const a=q.life/q.max;


    if(q.type==='t'){

      g.globalAlpha=a;

      g.font=
        `bold ${
          Math.max(
            7,
            U*.03*q.sz
          )
        }px monospace`;

      g.textAlign='center';

      g.fillStyle='#000';

      g.fillText(
        q.txt,
        q.x+1,
        q.y+1
      );

      g.fillStyle=q.col;

      g.fillText(
        q.txt,
        q.x,
        q.y
      );

      g.globalAlpha=1;

    }else if(q.type==='e'){

      g.save();

      g.globalCompositeOperation='lighter';

      g.fillStyle=
        `rgba(${q.col},${a})`;

      g.fillRect(
        q.x,
        q.y,
        q.sz,
        q.sz
      );

      g.restore();

    }else{

      g.globalAlpha=a;

      g.fillStyle=q.col;

      g.fillRect(
        q.x-q.sz/2,
        q.y-q.sz/2,
        q.sz*1.4,
        q.sz*1.4
      );

      g.globalAlpha=1;
    }
  }


  g.restore();


  g.drawImage(
    vig,
    0,
    0,
    W,
    H
  );


  if(st!=='menu'){

    hud();


    if(
      banT>0&&
      banTxt
    ){

      g.save();

      g.globalAlpha=
        clamp(
          Math.min(banT,1),
          0,
          1
        );

      g.textAlign='center';
      g.textBaseline='middle';

      g.font=
        `bold ${
          Math.max(
            14,
            U*.1
          )
        }px monospace`;

      g.fillStyle='#000';

      g.fillText(
        banTxt,
        W/2+3,
        H*.2+3
      );

      g.fillStyle=
        banTxt==='WAVE CLEARED'||
        banTxt==='CASTLE DEFENDED'
        ?'#d8c27a'
        :'#c9402e';

      g.fillText(
        banTxt,
        W/2,
        H*.2
      );

      g.restore();
    }
  }


  reticle();


  out.imageSmoothingEnabled=false;

  out.drawImage(
    lo,
    0,
    0,
    W,
    H,
    0,
    0,
    cv.width,
    cv.height
  );
}


/* =========================================================
   INPUT
========================================================= */

const keys={};


addEventListener(
  'keydown',
  e=>{

    keys[e.code]=1;


    if(e.code==='KeyM'){

      mute=!mute;

      if(master)
        master.gain.value=
          mute
          ?0
          :.55;
    }


    if(
      [
        'ArrowLeft',
        'ArrowRight',
        'Space'
      ].includes(e.code)
    ){
      e.preventDefault();
    }


    if(
      e.code==='Space'&&
      !e.repeat
    ){

      startDraw();
    }
  }
);


addEventListener(
  'keyup',
  e=>{

    keys[e.code]=0;

    if(e.code==='Space')
      release();
  }
);


cv.addEventListener(
  'mousemove',
  e=>{

    mx=e.clientX/ps;
    my=e.clientY/ps;
  }
);


cv.addEventListener(
  'mousedown',
  e=>{

    if(e.button===0){

      mx=e.clientX/ps;
      my=e.clientY/ps;

      startDraw();
    }
  }
);


addEventListener(
  'mouseup',
  e=>{

    if(e.button===0)
      release();
  }
);


cv.addEventListener(
  'contextmenu',
  e=>e.preventDefault()
);


/* touch */

let tl=null;


cv.addEventListener(
  'touchstart',
  e=>{

    const q=e.changedTouches[0];

    tl={
      id:q.identifier,
      x:q.clientX,
      y:q.clientY
    };

    e.preventDefault();

  },
  {passive:false}
);


cv.addEventListener(
  'touchmove',
  e=>{

    for(const q of e.changedTouches){

      if(
        tl&&
        q.identifier===tl.id
      ){

        mx=clamp(
          mx+
          (q.clientX-tl.x)/
          ps*
          1.7,
          0,
          W
        );

        my=clamp(
          my+
          (q.clientY-tl.y)/
          ps*
          1.7,
          0,
          H
        );

        tl.x=q.clientX;
        tl.y=q.clientY;
      }
    }

    e.preventDefault();

  },
  {passive:false}
);


cv.addEventListener(
  'touchend',
  ()=>{
    tl=null;
  }
);


/* mobile controls */

const hold=(
  id,
  on,
  off
)=>{

  const b=$(id);

  b.addEventListener(
    'pointerdown',
    e=>{

      e.preventDefault();

      b.setPointerCapture(
        e.pointerId
      );

      on();
    }
  );

  [
    'pointerup',
    'pointercancel'
  ].forEach(n=>

    b.addEventListener(
      n,
      off
    )
  );
};


hold(
  'bL',
  ()=>touchDir=-1,
  ()=>touchDir=0
);

hold(
  'bR',
  ()=>touchDir=1,
  ()=>touchDir=0
);

hold(
  'bF',
  startDraw,
  release
);


if(
  'ontouchstart' in window||
  navigator.maxTouchPoints>0
){

  $('tc').style.display='flex';
}


/* =========================================================
   ГЛАВНОЕ ИСПРАВЛЕНИЕ КНОПКИ START
========================================================= */

/*
  Функция находится в window, поэтому HTML-кнопка
  может вызвать её напрямую:

  onclick="window.startGame()"

  Это не зависит от того, успел ли обработчик
  addEventListener установиться.
*/

window.startGame=()=>{

  try{

    initAudio();

    const menu=$('menu');
    const button=$('bStart');

    menu.classList.remove('on');

    button.disabled=true;

    reset();

    startWave(1);

  }catch(err){

    console.error(
      'START GAME ERROR:',
      err
    );

    /*
      Если какая-то ошибка всё-таки произошла,
      меню возвращается и кнопку снова можно нажать.
    */

    $('menu').classList.add('on');

    $('bStart').disabled=false;

    alert(
      'Ошибка запуска игры: '+
      err.message
    );
  }
};


/*
  Дополнительная страховка:
  обычный клик и касание тоже вызывают
  ту же глобальную функцию.
*/

$('bStart').addEventListener(
  'click',
  e=>{
    e.preventDefault();
    window.startGame();
  }
);

$('bStart').addEventListener(
  'pointerup',
  e=>{
    e.preventDefault();
    window.startGame();
  }
);


/* =========================================================
   OTHER EVENTS
========================================================= */

addEventListener(
  'resize',
  resize
);


document.addEventListener(
  'visibilitychange',
  ()=>{
    if(document.hidden){

      drawing=false;

      touchDir=0;
    }
  }
);


/* =========================================================
   INIT
========================================================= */

buildWorld();

buildFog();

resize();


/* =========================================================
   LOOP
========================================================= */

let last=performance.now();


function loop(n){

  const dt=
    Math.min(
      .05,
      (n-last)/1000
    );

  last=n;

  update(dt);

  render();

  requestAnimationFrame(loop);
}


requestAnimationFrame(loop);

})();
</script>

</body>
</html>
