<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Castle of Ash</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #080b09;
    font-family: Georgia, serif;
}

body {
    touch-action: none;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}


/* =========================
   МЕНЮ
========================= */

#menu {
    position: fixed;
    z-index: 100;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle,
            rgba(45,55,45,0.25),
            rgba(0,0,0,0.95)
        );
}

.menuBox {
    width: min(520px, 88vw);
    padding: 42px 30px;

    text-align: center;

    background: rgba(13,16,14,0.96);

    border: 2px solid #70664d;

    box-shadow:
        0 0 40px rgba(0,0,0,0.9);
}

.menuTitle {
    color: #d8c79a;
    font-size: clamp(32px, 7vw, 52px);
    letter-spacing: 4px;
    margin-bottom: 18px;
}

.menuText {
    color: #aaa99e;
    line-height: 1.6;
    font-size: 16px;
    margin-bottom: 25px;
}

.startButton {
    border: 2px solid #857957;
    background: #25271f;
    color: #e3d7b8;

    padding: 15px 38px;

    font-size: 19px;
    font-family: Georgia, serif;

    cursor: pointer;
}

.startButton:hover {
    background: #35372c;
}


/* =========================
   HUD
========================= */

#hud {
    display: none;

    position: fixed;
    z-index: 50;

    top: 12px;
    left: 12px;
    right: 12px;

    justify-content: space-between;

    pointer-events: none;
}

.hudBox {
    background: rgba(7,9,8,0.78);

    border: 1px solid rgba(180,160,110,0.5);

    color: #ddd3b6;

    padding: 9px 14px;

    font-size: 15px;
}


/* =========================
   УПРАВЛЕНИЕ
========================= */

#controls {
    display: none;

    position: fixed;

    z-index: 60;

    left: 20px;
    right: 20px;
    bottom: 18px;

    justify-content: space-between;

    pointer-events: none;
}

.controlButton {
    pointer-events: auto;

    width: 76px;
    height: 60px;

    border: 1px solid #74694d;

    background: rgba(20,23,20,0.82);

    color: #ddd2ad;

    font-size: 28px;

    touch-action: none;
}


/* =========================
   GAME OVER
========================= */

#gameOver {
    display: none;

    position: fixed;
    z-index: 100;
    inset: 0;

    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,0.82);
}

.gameOverBox {
    width: min(450px, 88vw);

    padding: 35px;

    text-align: center;

    background: #101411;

    border: 2px solid #655a43;
}

.gameOverTitle {
    color: #c9bc92;
    font-size: 38px;
    margin-bottom: 15px;
}

.gameOverText {
    color: #aaa;
    margin-bottom: 15px;
}
</style>
</head>

<body>

<canvas id="gameCanvas"></canvas>


<!-- =========================
     МЕНЮ
========================= -->

<div id="menu">

    <div class="menuBox">

        <div class="menuTitle">
            CASTLE OF ASH
        </div>

        <div class="menuText">
            Тёмный лес проснулся.<br>
            Орды орков идут к древней крепости.<br><br>
            Ты — последний лучник на стене.
        </div>

        <button
            class="startButton"
            onclick="startGame()"
        >
            НАЧАТЬ ИГРУ
        </button>

    </div>

</div>


<!-- =========================
     HUD
========================= -->

<div id="hud">

    <div class="hudBox">
        🏰 Стена:
        <span id="wallHP">100</span>/100
    </div>

    <div class="hudBox">
        🌊 Волна:
        <span id="waveNumber">1</span>
    </div>

    <div class="hudBox">
        💰 Золото:
        <span id="goldAmount">0</span>
    </div>

</div>


<!-- =========================
     КНОПКИ
========================= -->

<div id="controls">

    <button
        id="leftButton"
        class="controlButton"
    >
        ◀
    </button>

    <button
        id="rightButton"
        class="controlButton"
    >
        ▶
    </button>

</div>


<!-- =========================
     GAME OVER
========================= -->

<div id="gameOver">

    <div class="gameOverBox">

        <div class="gameOverTitle">
            ЗАМОК ПАЛ
        </div>

        <div class="gameOverText">
            Орды леса прорвались к крепости.
        </div>

        <button
            class="startButton"
            onclick="restartGame()"
        >
            НАЧАТЬ ЗАНОВО
        </button>

    </div>

</div>


<script>

/* ==================================================
   CANVAS
================================================== */

var canvas = document.getElementById("gameCanvas");
var ctx = canvas.getContext("2d");

var W = 0;
var H = 0;


function resizeCanvas() {

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W;
    canvas.height = H;
}

window.addEventListener("resize", resizeCanvas);

resizeCanvas();



/* ==================================================
   ПОЛОЖЕНИЕ СТЕНЫ
================================================== */

/*
   Было 0.38.

   Теперь стена выше:
   меньше пустого неба,
   больше леса.
*/

function getWallY() {

    return H * 0.29;
}


function getWallHeight() {

    return Math.max(
        105,
        H * 0.13
    );
}



/* ==================================================
   ИГРА
================================================== */

var gameRunning = false;

var wallHP = 100;

var gold = 0;

var wave = 1;


var player = {

    x: 0,

    speed: 380,

    cooldown: 0,

    fireRate: 0.38,

    damage: 30

};


var enemies = [];

var arrows = [];

var particles = [];

var trees = [];

var rain = [];


var leftPressed = false;

var rightPressed = false;


var lastTime = 0;

var waveSpawned = 0;

var enemiesPerWave = 6;

var spawnTimer = 0;

var nextWaveTimer = 0;

var lightningTimer = 5;

var lightningTime = 0;



/* ==================================================
   МИР
================================================== */

function createWorld() {

    trees = [];

    rain = [];


    var wallY = getWallY();


    /* ЛЕС */

    for (var i = 0; i < 90; i++) {

        trees.push({

            x:
                Math.random() * W,

            y:
                wallY +
                80 +
                Math.random() *
                Math.max(
                    100,
                    H - wallY - 100
                ),

            size:
                25 +
                Math.random() * 48

        });

    }


    /* ДОЖДЬ */

    for (var r = 0; r < 180; r++) {

        rain.push({

            x:
                Math.random() * W,

            y:
                Math.random() * H,

            speed:
                400 +
                Math.random() * 300,

            length:
                8 +
                Math.random() * 12

        });

    }

}



/* ==================================================
   ФОН
================================================== */

function drawBackground() {

    var gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );


    gradient.addColorStop(
        0,
        "#111719"
    );

    gradient.addColorStop(
        0.30,
        "#18211f"
    );

    gradient.addColorStop(
        1,
        "#070b08"
    );


    ctx.fillStyle = gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* ЛУНА */

    ctx.beginPath();

    ctx.arc(
        W * 0.80,
        H * 0.10,
        35,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "#d5d2b5";

    ctx.shadowBlur = 28;

    ctx.shadowColor = "#aaa98c";

    ctx.fill();

    ctx.shadowBlur = 0;

}



/* ==================================================
   ЛЕС
================================================== */

function drawForest() {

    var wallY = getWallY();

    var wallH = getWallHeight();


    /* ЗЕМЛЯ */

    ctx.fillStyle = "#0a100c";

    ctx.fillRect(
        0,
        wallY + wallH * 0.30,
        W,
        H
    );


    /* ДОРОГА */

    ctx.beginPath();

    ctx.moveTo(
        W * 0.40,
        H
    );

    ctx.bezierCurveTo(
        W * 0.54,
        H * 0.84,
        W * 0.40,
        H * 0.62,
        W * 0.53,
        wallY + 65
    );

    ctx.lineTo(
        W * 0.66,
        wallY + 65
    );

    ctx.bezierCurveTo(
        W * 0.57,
        H * 0.62,
        W * 0.73,
        H * 0.84,
        W * 0.61,
        H
    );

    ctx.closePath();

    ctx.fillStyle = "#20251c";

    ctx.fill();


    /* ДЕРЕВЬЯ */

    for (
        var i = 0;
        i < trees.length;
        i++
    ) {

        drawTree(
            trees[i].x,
            trees[i].y,
            trees[i].size
        );

    }


    /* КАМНИ */

    for (var k = 0; k < 25; k++) {

        var stoneX =
            (k * 151) % W;

        var stoneY =
            wallY +
            90 +
            (
                k * 97
            ) %
            Math.max(
                80,
                H - wallY - 110
            );


        ctx.fillStyle = "#252a25";

        ctx.beginPath();

        ctx.ellipse(
            stoneX,
            stoneY,
            12 + (k % 4) * 3,
            7,
            0,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }

}



/* ==================================================
   ДЕРЕВО
================================================== */

function drawTree(x, y, size) {

    ctx.fillStyle = "#17140f";

    ctx.fillRect(
        x - size * 0.1,
        y - size * 0.25,
        size * 0.2,
        size * 0.9
    );


    ctx.strokeStyle = "#17140f";

    ctx.lineWidth = 4;

    ctx.beginPath();

    ctx.moveTo(
        x,
        y
    );

    ctx.lineTo(
        x - size * 0.4,
        y - size * 0.45
    );

    ctx.moveTo(
        x,
        y
    );

    ctx.lineTo(
        x + size * 0.4,
        y - size * 0.45
    );

    ctx.stroke();


    ctx.fillStyle = "#0c1711";

    ctx.beginPath();

    ctx.arc(
        x,
        y - size * 0.55,
        size * 0.42,
        0,
        Math.PI * 2
    );

    ctx.arc(
        x - size * 0.28,
        y - size * 0.42,
        size * 0.32,
        0,
        Math.PI * 2
    );

    ctx.arc(
        x + size * 0.28,
        y - size * 0.43,
        size * 0.34,
        0,
        Math.PI * 2
    );

    ctx.fill();

}



/* ==================================================
   СТЕНА
================================================== */

function drawCastle() {

    var y = getWallY();

    var h = getWallHeight();


    /* ТЕНЬ */

    ctx.fillStyle = "rgba(0,0,0,0.65)";

    ctx.fillRect(
        0,
        y + h,
        W,
        35
    );


    /* СТЕНА */

    ctx.fillStyle = "#343732";

    ctx.fillRect(
        0,
        y + 20,
        W,
        h
    );


    /* КАМЕНЬ */

    ctx.strokeStyle = "#222520";

    ctx.lineWidth = 2;


    var blockW = 70;

    var blockH = 27;


    for (
        var yy = y + 20;
        yy < y + h;
        yy += blockH
    ) {

        var row =
            Math.floor(
                (yy - y) /
                blockH
            );

        var offset =
            row % 2 === 0
            ? 0
            : blockW / 2;


        for (
            var xx = -blockW;
            xx < W + blockW;
            xx += blockW
        ) {

            ctx.strokeRect(
                xx + offset,
                yy,
                blockW,
                blockH
            );

        }

    }


    /* ВЕРХ */

    ctx.fillStyle = "#484b44";

    ctx.fillRect(
        0,
        y + 10,
        W,
        18
    );


    /* ЗУБЦЫ */

    drawBattlements(y);


    /* БАШНИ */

    drawTower(
        55,
        y
    );

    drawTower(
        W - 55,
        y
    );


    /* ФАКЕЛЫ */

    drawTorch(
        135,
        y + 12
    );

    drawTorch(
        W - 135,
        y + 12
    );

}



/* ==================================================
   ЗУБЦЫ
================================================== */

function drawBattlements(y) {

    var merlonW = 38;

    var gap = 20;


    ctx.fillStyle = "#3c3f39";


    for (
        var x = 0;
        x < W;
        x += merlonW + gap
    ) {

        ctx.fillRect(
            x,
            y - 15,
            merlonW,
            30
        );

    }

}



/* ==================================================
   БАШНИ
================================================== */

function drawTower(x, y) {

    var width = 90;

    var height = 145;


    ctx.fillStyle = "#393c37";

    ctx.fillRect(
        x - width / 2,
        y - height + 30,
        width,
        height
    );


    ctx.strokeStyle = "#242722";

    ctx.lineWidth = 2;


    for (
        var yy = y - height + 30;
        yy < y + 30;
        yy += 27
    ) {

        ctx.strokeRect(
            x - width / 2,
            yy,
            width,
            27
        );

    }


    ctx.fillStyle = "#494c45";

    ctx.fillRect(
        x - width / 2 - 7,
        y - height + 15,
        width + 14,
        22
    );


    for (
        var i = -1;
        i <= 1;
        i++
    ) {

        ctx.fillRect(
            x + i * 28 - 11,
            y - height - 10,
            22,
            28
        );

    }


    ctx.fillStyle = "#10130f";

    ctx.fillRect(
        x - 9,
        y - height + 58,
        18,
        30
    );

}



/* ==================================================
   ФАКЕЛ
================================================== */

function drawTorch(x, y) {

    ctx.fillStyle = "#302218";

    ctx.fillRect(
        x - 4,
        y,
        8,
        28
    );


    ctx.beginPath();

    ctx.arc(
        x,
        y - 4,
        8,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "#e0a344";

    ctx.shadowBlur = 22;

    ctx.shadowColor = "#d99032";

    ctx.fill();

    ctx.shadowBlur = 0;

}



/* ==================================================
   ЛУЧНИК
================================================== */

function drawPlayer() {

    var x = player.x;

    var y = getWallY() + 12;


    /* НОГИ */

    ctx.fillStyle = "#151813";

    ctx.fillRect(
        x - 9,
        y - 13,
        7,
        35
    );

    ctx.fillRect(
        x + 2,
        y - 13,
        7,
        35
    );


    /* ТЕЛО */

    ctx.fillStyle = "#292e29";

    ctx.fillRect(
        x - 15,
        y - 57,
        30,
        45
    );


    /* ПЛЕЧИ */

    ctx.fillRect(
        x - 20,
        y - 53,
        40,
        10
    );


    /* ГОЛОВА */

    ctx.beginPath();

    ctx.arc(
        x,
        y - 69,
        12,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "#a88e6d";

    ctx.fill();


    /* КАПЮШОН */

    ctx.beginPath();

    ctx.arc(
        x,
        y - 72,
        16,
        Math.PI,
        Math.PI * 2
    );

    ctx.fillStyle = "#121712";

    ctx.fill();


    /* ЛУК */

    ctx.strokeStyle = "#8b643d";

    ctx.lineWidth = 4;

    ctx.beginPath();

    ctx.arc(
        x + 21,
        y - 42,
        29,
        -Math.PI * 0.8,
        Math.PI * 0.8
    );

    ctx.stroke();


    /* ТЕТИВА */

    ctx.strokeStyle = "#c9c0a6";

    ctx.lineWidth = 1;

    ctx.beginPath();

    ctx.moveTo(
        x + 14,
        y - 69
    );

    ctx.lineTo(
        x + 14,
        y - 15
    );

    ctx.stroke();


    /* СТРЕЛА В РУКАХ */

    ctx.strokeStyle = "#d8ccaa";

    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.moveTo(
        x + 3,
        y - 43
    );

    ctx.lineTo(
        x + 42,
        y - 43
    );

    ctx.stroke();


    /* ПЕРЕДНИЕ ЗУБЦЫ */

    drawFrontBattlements();

}



/* ==================================================
   ПЕРЕДНИЕ ЗУБЦЫ
================================================== */

function drawFrontBattlements() {

    var y = getWallY();

    var merlonW = 38;

    var gap = 20;


    ctx.fillStyle = "#3c3f39";


    for (
        var x = 0;
        x < W;
        x += merlonW + gap
    ) {

        ctx.fillRect(
            x,
            y - 15,
            merlonW,
            27
        );

    }

}



/* ==================================================
   ОРКИ
================================================== */

function spawnOrc() {

    var type = "normal";

    var random =
        Math.random();


    if (
        wave >= 2 &&
        random < 0.2
    ) {

        type = "fast";

    }


    if (
        wave >= 3 &&
        random < 0.1
    ) {

        type = "heavy";

    }


    var enemy;


    /*
       ВАЖНО:

       Орки теперь появляются
       практически в самом низу карты.

       Поэтому между ними
       и замком огромное
       пространство леса.
    */

    var spawnY =
        H - 35;


    if (type === "fast") {

        enemy = {

            type: "fast",

            x:
                W * 0.18 +
                Math.random() *
                W * 0.64,

            y: spawnY,

            hp: 38,

            maxHp: 38,

            speed: 72,

            damage: 7,

            reward: 13,

            size: 22

        };

    }

    else if (type === "heavy") {

        enemy = {

            type: "heavy",

            x:
                W * 0.18 +
                Math.random() *
                W * 0.64,

            y: spawnY,

            hp: 140,

            maxHp: 140,

            speed: 28,

            damage: 17,

            reward: 30,

            size: 35

        };

    }

    else {

        enemy = {

            type: "normal",

            x:
                W * 0.18 +
                Math.random() *
                W * 0.64,

            y: spawnY,

            hp: 65,

            maxHp: 65,

            speed: 43,

            damage: 9,

            reward: 10,

            size: 27

        };

    }


    enemies.push(enemy);

}



/* ==================================================
   ОРК
================================================== */

function drawEnemy(e) {

    var s = e.size;


    if (e.type === "heavy") {

        ctx.fillStyle = "#30372c";

    }

    else if (e.type === "fast") {

        ctx.fillStyle = "#3a482f";

    }

    else {

        ctx.fillStyle = "#34402f";

    }


    /* ТЕЛО */

    ctx.beginPath();

    ctx.ellipse(
        e.x,
        e.y,
        s * 0.55,
        s,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* ГОЛОВА */

    ctx.fillStyle = "#526044";

    ctx.beginPath();

    ctx.arc(
        e.x,
        e.y - s * 0.75,
        s * 0.42,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* УШИ */

    ctx.beginPath();

    ctx.moveTo(
        e.x - s * 0.25,
        e.y - s * 0.75
    );

    ctx.lineTo(
        e.x - s * 0.7,
        e.y - s * 0.95
    );

    ctx.lineTo(
        e.x - s * 0.35,
        e.y - s * 0.55
    );

    ctx.fill();


    ctx.beginPath();

    ctx.moveTo(
        e.x + s * 0.25,
        e.y - s * 0.75
    );

    ctx.lineTo(
        e.x + s * 0.7,
        e.y - s * 0.95
    );

    ctx.lineTo(
        e.x + s * 0.35,
        e.y - s * 0.55
    );

    ctx.fill();


    /* ГЛАЗА */

    ctx.fillStyle = "#d8bd63";

    ctx.fillRect(
        e.x - s * 0.21,
        e.y - s * 0.8,
        5,
        5
    );

    ctx.fillRect(
        e.x + s * 0.08,
        e.y - s * 0.8,
        5,
        5
    );


    /* ОРУЖИЕ */

    ctx.strokeStyle = "#725235";

    ctx.lineWidth = 5;

    ctx.beginPath();

    ctx.moveTo(
        e.x + s * 0.25,
        e.y - s * 0.1
    );

    ctx.lineTo(
        e.x + s * 0.8,
        e.y + s * 0.6
    );

    ctx.stroke();


    /* HP */

    ctx.fillStyle = "#130d0d";

    ctx.fillRect(
        e.x - s,
        e.y - s * 1.35,
        s * 2,
        5
    );


    ctx.fillStyle = "#a84f43";

    ctx.fillRect(
        e.x - s,
        e.y - s * 1.35,
        s * 2 *
        (e.hp / e.maxHp),
        5
    );

}



/* ==================================================
   ПОИСК БЛИЖАЙШЕГО ОРКА
================================================== */

function getNearestEnemy() {

    if (enemies.length === 0) {
        return null;
    }


    var nearest = enemies[0];

    var bestDistance =
        Math.abs(
            enemies[0].x -
            player.x
        ) +
        enemies[0].y;


    for (
        var i = 1;
        i < enemies.length;
        i++
    ) {

        var e = enemies[i];


        /*
           Приоритет:
           сначала ближайший
           по горизонтали,
           затем более близкий
           к замку.
        */

        var distance =
            Math.abs(
                e.x -
                player.x
            ) +
            e.y;


        if (
            distance <
            bestDistance
        ) {

            bestDistance =
                distance;

            nearest = e;

        }

    }


    return nearest;

}



/* ==================================================
   СТРЕЛЬБА
================================================== */

function shoot() {

    if (!gameRunning) {
        return;
    }


    if (player.cooldown > 0) {
        return;
    }


    var target =
        getNearestEnemy();


    if (target === null) {

        return;

    }


    player.cooldown =
        player.fireRate;


    /*
       Стрела теперь НЕ летит тупо вверх.

       Она получает направление
       непосредственно к орку.
    */

    var startX =
        player.x;

    var startY =
        getWallY() - 5;


    var targetX =
        target.x;

    var targetY =
        target.y -
        target.size * 0.5;


    var dx =
        targetX -
        startX;

    var dy =
        targetY -
        startY;


    var distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    var speed = 700;


    arrows.push({

        x: startX,

        y: startY,

        vx:
            dx / distance *
            speed,

        vy:
            dy / distance *
            speed,

        damage:
            player.damage

    });

}



/* ==================================================
   СТРЕЛА
================================================== */

function drawArrow(a) {

    var angle =
        Math.atan2(
            a.vy,
            a.vx
        );


    ctx.save();


    ctx.translate(
        a.x,
        a.y
    );


    ctx.rotate(
        angle
    );


    ctx.strokeStyle =
        "#d8c99f";

    ctx.lineWidth = 3;


    /* ДРЕВКО */

    ctx.beginPath();

    ctx.moveTo(
        -18,
        0
    );

    ctx.lineTo(
        18,
        0
    );

    ctx.stroke();


    /* НАКОНЕЧНИК */

    ctx.beginPath();

    ctx.moveTo(
        18,
        0
    );

    ctx.lineTo(
        9,
        -5
    );

    ctx.moveTo(
        18,
        0
    );

    ctx.lineTo(
        9,
        5
    );

    ctx.stroke();


    ctx.restore();

}



/* ==================================================
   ЧАСТИЦЫ
================================================== */

function hitParticles(x, y) {

    for (
        var i = 0;
        i < 7;
        i++
    ) {

        particles.push({

            x: x,

            y: y,

            vx:
                -100 +
                Math.random() * 200,

            vy:
                -100 +
                Math.random() * 200,

            life: 0.35

        });

    }

}


function updateParticles(dt) {

    for (
        var i = 0;
        i < particles.length;
        i++
    ) {

        var p = particles[i];

        p.x +=
            p.vx * dt;

        p.y +=
            p.vy * dt;

        p.life -= dt;

    }


    particles =
        particles.filter(
            function(p) {
                return p.life > 0;
            }
        );

}


function drawParticles() {

    for (
        var i = 0;
        i < particles.length;
        i++
    ) {

        var p =
            particles[i];


        ctx.fillStyle =
            "rgba(220,190,100," +
            Math.max(
                0,
                p.life * 2
            ) +
            ")";


        ctx.fillRect(
            p.x,
            p.y,
            4,
            4
        );

    }

}



/* ==================================================
   ДОЖДЬ
================================================== */

function updateRain(dt) {

    for (
        var i = 0;
        i < rain.length;
        i++
    ) {

        var r =
            rain[i];


        r.y +=
            r.speed * dt;


        if (r.y > H) {

            r.y = -20;

            r.x =
                Math.random() *
                W;

        }

    }

}


function drawRain() {

    ctx.strokeStyle =
        "rgba(170,190,190,0.18)";

    ctx.lineWidth = 1;


    for (
        var i = 0;
        i < rain.length;
        i++
    ) {

        var r =
            rain[i];


        ctx.beginPath();

        ctx.moveTo(
            r.x,
            r.y
        );

        ctx.lineTo(
            r.x - 4,
            r.y + r.length
        );

        ctx.stroke();

    }

}



/* ==================================================
   МОЛНИЯ
================================================== */

function updateLightning(dt) {

    lightningTimer -= dt;


    if (
        lightningTimer <= 0
    ) {

        lightningTimer = 5;

        lightningTime =
            0.12;

    }


    if (
        lightningTime > 0
    ) {

        lightningTime -= dt;

    }

}


function drawLightning() {

    if (
        lightningTime <= 0
    ) {

        return;

    }


    ctx.fillStyle =
        "rgba(230,235,220,0.22)";


    ctx.fillRect(
        0,
        0,
        W,
        H
    );

}



/* ==================================================
   ВОЛНА
================================================== */

function startWave() {

    waveSpawned = 0;

    enemiesPerWave =
        5 + wave * 2;

    spawnTimer = 0;

    nextWaveTimer = 0;

}



/* ==================================================
   СПАВН
================================================== */

function updateSpawning(dt) {

    if (
        waveSpawned >=
        enemiesPerWave
    ) {

        return;

    }


    spawnTimer -= dt;


    if (
        spawnTimer <= 0
    ) {

        spawnOrc();

        waveSpawned++;

        spawnTimer =
            0.75;

    }

}



/* ==================================================
   ОБНОВЛЕНИЕ
================================================== */

function update(dt) {

    if (!gameRunning) {
        return;
    }


    /* ======================
       ДВИЖЕНИЕ ЛУЧНИКА
    ====================== */

    if (leftPressed) {

        player.x -=
            player.speed * dt;

    }


    if (rightPressed) {

        player.x +=
            player.speed * dt;

    }


    if (player.x < 35) {

        player.x = 35;

    }


    if (
        player.x >
        W - 35
    ) {

        player.x =
            W - 35;

    }


    /* ПЕРЕЗАРЯДКА */

    if (
        player.cooldown > 0
    ) {

        player.cooldown -= dt;

    }


    /* СПАВН */

    updateSpawning(dt);


    /* ======================
       СТРЕЛЫ
    ====================== */

    for (
        var i =
            arrows.length - 1;
        i >= 0;
        i--
    ) {

        var a =
            arrows[i];


        a.x +=
            a.vx * dt;

        a.y +=
            a.vy * dt;


        var hit = false;


        /* ПОПАДАНИЕ */

        for (
            var j =
                enemies.length - 1;
            j >= 0;
            j--
        ) {

            var e =
                enemies[j];


            var dx =
                a.x - e.x;


            var dy =
                a.y -
                (
                    e.y -
                    e.size * 0.4
                );


            var distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            if (
                distance <
                e.size
            ) {

                e.hp -=
                    a.damage;


                hitParticles(
                    e.x,
                    e.y
                );


                hit = true;


                if (
                    e.hp <= 0
                ) {

                    gold +=
                        e.reward;


                    enemies.splice(
                        j,
                        1
                    );

                }


                break;

            }

        }


        if (
            hit ||
            a.x < -50 ||
            a.x > W + 50 ||
            a.y < -50 ||
            a.y > H + 50
        ) {

            arrows.splice(
                i,
                1
            );

        }

    }


    /* ======================
       ОРКИ
    ====================== */

    var targetY =
        getWallY() +
        getWallHeight() *
        0.2;


    for (
        var i =
            enemies.length - 1;
        i >= 0;
        i--
    ) {

        var e =
            enemies[i];


        if (
            e.y >
            targetY
        ) {

            e.y -=
                e.speed * dt;

        }

        else {

            wallHP -=
                e.damage * dt;


            if (
                wallHP <= 0
            ) {

                wallHP = 0;

                endGame();

                return;

            }

        }

    }


    /* НОВАЯ ВОЛНА */

    if (
        waveSpawned >=
        enemiesPerWave &&
        enemies.length === 0
    ) {

        nextWaveTimer += dt;


        if (
            nextWaveTimer >= 2
        ) {

            wave++;

            startWave();

        }

    }


    updateParticles(dt);

    updateRain(dt);

    updateLightning(dt);

    updateHUD();

}



/* ==================================================
   HUD
================================================== */

function updateHUD() {

    document.getElementById(
        "wallHP"
    ).textContent =
        Math.ceil(wallHP);


    document.getElementById(
        "waveNumber"
    ).textContent =
        wave;


    document.getElementById(
        "goldAmount"
    ).textContent =
        gold;

}



/* ==================================================
   ОТРИСОВКА
================================================== */

function draw() {

    drawBackground();

    drawForest();


    /* ОРКИ */

    for (
        var i = 0;
        i < enemies.length;
        i++
    ) {

        drawEnemy(
            enemies[i]
        );

    }


    /* ЗАМОК */

    drawCastle();


    /* ЛУЧНИК */

    drawPlayer();


    /* СТРЕЛЫ */

    for (
        var i = 0;
        i < arrows.length;
        i++
    ) {

        drawArrow(
            arrows[i]
        );

    }


    drawParticles();

    drawRain();

    drawLightning();

}



/* ==================================================
   GAME LOOP
================================================== */

function gameLoop(time) {

    if (!gameRunning) {
        return;
    }


    var dt =
        (
            time -
            lastTime
        ) / 1000;


    if (
        dt > 0.033
    ) {

        dt = 0.033;

    }


    lastTime = time;


    update(dt);

    draw();


    requestAnimationFrame(
        gameLoop
    );

}



/* ==================================================
   СТАРТ
================================================== */

function startGame() {

    document.getElementById(
        "menu"
    ).style.display =
        "none";


    document.getElementById(
        "gameOver"
    ).style.display =
        "none";


    document.getElementById(
        "hud"
    ).style.display =
        "flex";


    document.getElementById(
        "controls"
    ).style.display =
        "flex";


    wallHP = 100;

    gold = 0;

    wave = 1;


    enemies = [];

    arrows = [];

    particles = [];


    player.x =
        W / 2;


    player.cooldown =
        0;


    gameRunning = true;


    createWorld();

    startWave();


    lastTime =
        performance.now();


    requestAnimationFrame(
        gameLoop
    );

}



/* ==================================================
   RESTART
================================================== */

function restartGame() {

    startGame();

}



/* ==================================================
   GAME OVER
================================================== */

function endGame() {

    gameRunning = false;


    document.getElementById(
        "gameOver"
    ).style.display =
        "flex";


    document.getElementById(
        "hud"
    ).style.display =
        "none";


    document.getElementById(
        "controls"
    ).style.display =
        "none";

}



/* ==================================================
   КЛАВИАТУРА
================================================== */

document.addEventListener(
    "keydown",
    function(e) {

        if (
            e.key === "ArrowLeft" ||
            e.key.toLowerCase() === "a"
        ) {

            leftPressed = true;

        }


        if (
            e.key === "ArrowRight" ||
            e.key.toLowerCase() === "d"
        ) {

            rightPressed = true;

        }


        if (
            e.code === "Space"
        ) {

            e.preventDefault();

            shoot();

        }

    }
);


document.addEventListener(
    "keyup",
    function(e) {

        if (
            e.key === "ArrowLeft" ||
            e.key.toLowerCase() === "a"
        ) {

            leftPressed = false;

        }


        if (
            e.key === "ArrowRight" ||
            e.key.toLowerCase() === "d"
        ) {

            rightPressed = false;

        }

    }
);



/* ==================================================
   МОБИЛЬНОЕ УПРАВЛЕНИЕ
================================================== */

var leftButton =
    document.getElementById(
        "leftButton"
    );

var rightButton =
    document.getElementById(
        "rightButton"
    );


leftButton.addEventListener(
    "touchstart",
    function(e) {

        e.preventDefault();

        leftPressed = true;

    },
    {
        passive: false
    }
);


leftButton.addEventListener(
    "touchend",
    function(e) {

        e.preventDefault();

        leftPressed = false;

    },
    {
        passive: false
    }
);


rightButton.addEventListener(
    "touchstart",
    function(e) {

        e.preventDefault();

        rightPressed = true;

    },
    {
        passive: false
    }
);


rightButton.addEventListener(
    "touchend",
    function(e) {

        e.preventDefault();

        rightPressed = false;

    },
    {
        passive: false
    }
);



/* МЫШЬ */

leftButton.addEventListener(
    "mousedown",
    function() {

        leftPressed = true;

    }
);


leftButton.addEventListener(
    "mouseup",
    function() {

        leftPressed = false;

    }
);


rightButton.addEventListener(
    "mousedown",
    function() {

        rightPressed = true;

    }
);


rightButton.addEventListener(
    "mouseup",
    function() {

        rightPressed = false;

    }
);



/* ==================================================
   ТАП ПО ЭКРАНУ = СТРЕЛЬБА
================================================== */

canvas.addEventListener(
    "click",
    function() {

        shoot();

    }
);



/* ==================================================
   ПЕРВОНАЧАЛЬНЫЙ ЭКРАН
================================================== */

createWorld();

draw();

</script>
