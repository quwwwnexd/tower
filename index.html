lerp=(a,b,t)=>a+(b-a)*t,
rnd=(a,b)=>a+Math.random()*(b-a);

let W,H,U,PX,HOR,WALLY,DPR=1,bg,back,front,vig,fogS,items=[];

const K=.045,
sc=z=>1/(1+z*K),
lx=z=>Math.pow(sc(z),.55),
PY=z=>HOR+(WALLY-HOR)*sc(z),
PXs=(x,z)=>W/2+x*PX*lx(z),
roadX=z=>Math.sin(z*.055)*9*Math.min(1,z/40),
roadW=z=>5.5+z*.012;

const mixc=(a,b,t)=>
`rgb(${a.map((v,i)=>(v+(b[i]-v)*t)|0).join(',')})`;

const mk=(w,h)=>{
const c=document.createElement('canvas');
c.width=w*DPR;

/* ================= AUDIO ================= */

let AC,master,nbuf,mute=false,lastHit=0,lastWall=0;

function initAudio(){
if(AC){
if(AC.state==='suspended')AC.resume();
return
}

try{
AC=new(window.AudioContext||window.webkitAudioContext)();
master=AC.createGain();
master.gain.value=.55;
master.connect(AC.destination);

const n=AC.sampleRate*2;
nbuf=AC.createBuffer(1,n,AC.sampleRate);
const d=nbuf.getChannelData(0);

for(let i=0;i<n;i++)
d[i]=Math.random()*2-1;

ambient();

}catch(e){
AC=null
}
}

function noise(dur,f1,f2,type,vol,q){
if(!AC||mute)return;

const T=AC.currentTime,
s=AC.createBufferSource();

s.buffer=nbuf;

const f=AC.createBiquadFilter();
f.type=type;
f.frequency.setValueAtTime(f1,T);
f.frequency.exponentialRampToValueAtTime(f2,T+dur);

if(q)f.Q.value=q;

const gn=AC.createGain();
gn.gain.setValueAtTime(vol,T);
gn.gain.exponentialRampToValueAtTime(.001,T+dur);

s.connect(f);
f.connect(gn);
gn.connect(master);

s.start(T,Math.random());
s.stop(T+dur+.05)
}

function tone(type,f1,f2,dur,vol,delay,lp){
if(!AC||mute)return;

const T=AC.currentTime+(delay||0),
o=AC.createOscillator(),
gn=AC.createGain();

o.type=type;
o.frequency.setValueAtTime(f1,T);
o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),T+dur);

gn.gain.setValueAtTime(.001,T);
gn.gain.linearRampToValueAtTime(vol,T+Math.min(.04,dur/4));
gn.gain.exponentialRampToValueAtTime(.001,T+dur);

let n=o;

if(lp){
const f=AC.createBiquadFilter();
f.type='lowpass';
f.frequency.value=lp;
o.connect(f);
n=f
}

n.connect(gn);
gn.connect(master);

o.start(T);
o.stop(T+dur+.05)
}

function ambient(){

const s=AC.createBufferSource();
s.buffer=nbuf;
s.loop=true;

const f=AC.createBiquadFilter();
f.type='bandpass';
f.frequency.value=420;
f.Q.value=.7;

const gn=AC.createGain();
gn.gain.value=.05;

const l=AC.createOscillator(),
lg=AC.createGain();

l.frequency.value=.11;
lg.gain.value=.035;

l.connect(lg);
lg.connect(gn.gain);

s.connect(f);
f.connect(gn);
gn.connect(master);

s.start();
l.start();

[55,82.5].forEach(fr=>{
const o=AC.createOscillator(),
q=AC.createGain();

o.type='sine';
o.frequency.value=fr;
q.gain.value=.018;

o.connect(q);
q.connect(master);
o.start()
});

/* ================= WORLD BUILD ================= */

function mkTree(x,z){

const f=clamp((z-20)/150,0,.7),
r=Math.random();

return{
k:r<.18?'d':'t',
x,
z,
h:rnd(32,54),
seed:Math.random()*9,
c0:mixc([30,22,16],[34,54,64],f),
c1:mixc([12,34,22],[34,54,64],f),
c2:mixc([30,66,44],[34,54,64],f),
c3:mixc([58,96,70],[34,54,64],f)
}
}

function buildWorld(){

items=[];

for(let i=0;i<360;i++){

const z=rnd(84,168),
x=rnd(-240,240);

if(Math.abs(x-roadX(z))<roadW(z)+4.5)
continue;

items.push(mkTree(x,z))
}

for(let i=0;i<110;i++){

const z=rnd(24,84),
x=rnd(-130,130);

if(Math.abs(x-roadX(z))<roadW(z)+9)
continue;

if(z<56&&Math.abs(x)<46)
continue;

items.push(mkTree(x,z))
}

for(let i=0;i<110;i++){

const z=rnd(8,150),
x=rnd(-150,150);

if(Math.abs(x-roadX(z))<roadW(z)+3)
continue;

const f=clamp(z/150,0,.6);

items.push({
k:'b',
x,
z,
h:rnd(3.5,7),
seed:Math.random()*9,
c1:mixc([14,38,24],[34,54,64],f),
c2:mixc([30,62,40],[34,54,64],f)
})
}

for(let i=0;i<40;i++){

const z=rnd(8,140),
x=rnd(-150,150);

if(Math.abs(x-roadX(z))<roadW(z)+2)
continue;

items.push({
k:'r',
x,
z,
h:rnd(2,5),
c1:mixc([60,66,70],[34,54,64],clamp(z/160,0,.6)),
c2:mixc([96,104,108],[34,54,64],clamp(z/160,0,.6))
})
}

for(let i=0;i<260;i++){

const z=rnd(3,110),
x=rnd(-120,120);

if(Math.abs(x-roadX(z))<roadW(z)+1.5)
continue;

items.push({
k:'g',
x,
z,
h:rnd(2,4),
seed:Math.random()*9,
c1:mixc([44,74,48],[34,54,64],clamp(z/130,0,.6))
})
}

items.sort((a,b)=>b.z-a.z)
}
