<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>THE LAST WALL</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#090b0d;
  font-family:monospace;
  color:#eee;
}

canvas{
  display:block;
  width:100%;
  height:100%;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
}

button{
  font:inherit;
}
</style>
</head>

<body>
<canvas id="game"></canvas>

<script>
"use strict";

/* =========================================================
   THE LAST WALL
   DARK FANTASY PIXEL ART CASTLE DEFENSE
   ========================================================= */

const canvas=document.getElementById("game");
const g=canvas.getContext("2d");

let W=1280,H=720,DPR=1;
let back=null,front=null,vig=null;

const keys={};
let mouse={x:W/2,y:H/2,down:false};

window.addEventListener("keydown",e=>{
  keys[e.key.toLowerCase()]=true;

  if(e.code==="Space"){
    e.preventDefault();
    if(game.running && !game.over) shoot();
  }
});

window.addEventListener("keyup",e=>{
  keys[e.key.toLowerCase()]=false;
});

canvas.addEventListener("mousemove",e=>{
  const r=canvas.getBoundingClientRect();
  mouse.x=(e.clientX-r.left)*W/r.width;
  mouse.y=(e.clientY-r.top)*H/r.height;
});

canvas.addEventListener("mousedown",e=>{
  if(e.button===0){
    mouse.down=true;
    bowPull=true;
  }
});

window.addEventListener("mouseup",e=>{
  if(e.button===0){
    if(mouse.down) shoot();
    mouse.down=false;
    bowPull=false;
  }
});

canvas.addEventListener("touchstart",e=>{
  const t=e.touches[0];
  const r=canvas.getBoundingClientRect();

  mouse.x=(t.clientX-r.left)*W/r.width;
  mouse.y=(t.clientY-r.top)*H/r.height;

  mouse.down=true;
  bowPull=true;
},{passive:false});

canvas.addEventListener("touchmove",e=>{
  const t=e.touches[0];
  const r=canvas.getBoundingClientRect();

  mouse.x=(t.clientX-r.left)*W/r.width;
  mouse.y=(t.clientY-r.top)*H/r.height;
},{passive:false});

canvas.addEventListener("touchend",e=>{
  if(mouse.down) shoot();

  mouse.down=false;
  bowPull=false;
},{passive:false});


/* =========================================================
   AUDIO
   ========================================================= */

let audio=null;

function initAudio(){
  if(audio)return;

  try{
    audio=new (window.AudioContext||window.webkitAudioContext)();
  }catch(e){}
}

function sound(freq,duration,type="square",volume=.025){
  if(!audio)return;

  try{
    const o=audio.createOscillator();
    const a=audio.createGain();

    o.type=type;
    o.frequency.value=freq;

    a.gain.value=volume;

    o.connect(a);
    a.connect(audio.destination);

    o.start();

    a.gain.exponentialRampToValueAtTime(
      .0001,
      audio.currentTime+duration
    );

    o.stop(audio.currentTime+duration);
  }catch(e){}
}


/* =========================================================
   PIXEL HELPERS
   ========================================================= */

let ps=4;

function px(c,x,y,w,h,color){
  c.fillStyle=color;
  c.fillRect(
    Math.round(x/ps)*ps,
    Math.round(y/ps)*ps,
    Math.max(ps,Math.round(w/ps)*ps),
    Math.max(ps,Math.round(h/ps)*ps)
  );
}

function rect(c,x,y,w,h,color){
  c.fillStyle=color;
  c.fillRect(x,y,w,h);
}

function text(txt,x,y,size,color="#fff",align="left"){
  g.font=`bold ${size}px monospace`;
  g.textAlign=align;
  g.textBaseline="middle";

  g.fillStyle="#000";
  g.fillText(txt,x+2,y+2);

  g.fillStyle=color;
  g.fillText(txt,x,y);
}

function mk(w,h){
  const c=document.createElement("canvas");
  c.width=w;
  c.height=h;
  return [c,c.getContext("2d")];
}


/* =========================================================
   WORLD
   ========================================================= */

function buildStatic(){

  [back,g2]=mk(W,H);
  [front,g3]=mk(W,H);

  const c=g2;

  /* SKY */

  rect(c,0,0,W,H,"#090d16");

  /* horizontal pixel bands */

  rect(c,0,0,W,H*.16,"#080b12");
  rect(c,0,H*.16,W,H*.18,"#0b1019");
  rect(c,0,H*.34,W,H*.18,"#101722");
  rect(c,0,H*.52,W,H*.20,"#141a20");

  /* MOON */

  const mx=W*.82;
  const my=H*.19;

  px(c,mx-20,my-28,40,8,"#b8c1c0");
  px(c,mx-32,my-20,64,40,"#b8c1c0");
  px(c,mx-20,my+20,40,8,"#b8c1c0");

  px(c,mx-20,my-12,8,8,"#929c9c");
  px(c,mx+8,my+4,8,8,"#929c9c");
  px(c,mx-4,my+12,8,8,"#929c9c");

  /* STARS */

  const stars=[
    [90,65],[150,105],[225,58],[300,130],[385,75],
    [480,50],[560,110],[655,65],[745,120],
    [850,70],[930,115],[1030,55],[1120,100],
    [1180,65],[1230,135]
  ];

  stars.forEach(([x,y],i)=>{
    const s=i%3===0?6:4;
    px(c,x,y,s,s,"#aeb6ba");
  });

  /* DISTANT MOUNTAINS */

  c.fillStyle="#111821";
  c.beginPath();
  c.moveTo(0,H*.51);
  c.lineTo(W*.08,H*.37);
  c.lineTo(W*.17,H*.49);
  c.lineTo(W*.29,H*.31);
  c.lineTo(W*.40,H*.48);
  c.lineTo(W*.55,H*.34);
  c.lineTo(W*.68,H*.49);
  c.lineTo(W*.82,H*.36);
  c.lineTo(W,H*.50);
  c.lineTo(W,H*.70);
  c.lineTo(0,H*.70);
  c.closePath();
  c.fill();

  /* FAR FOREST */

  for(let x=0;x<W;x+=24){

    const h=30+((x*17)%55);

    px(
      c,
      x,
      H*.55-h,
      12,
      h,
      "#111a19"
    );

    px(
      c,
      x+8,
      H*.55-h+18,
      18,
      h-18,
      "#101817"
    );
  }

  /* GROUND */

  rect(c,0,H*.54,W,H*.46,"#151713");

  /* ground pixel patches */

  for(let i=0;i<260;i++){

    const x=Math.random()*W;
    const y=H*.55+Math.random()*H*.39;

    const colors=[
      "#1a1d17",
      "#202219",
      "#25261b",
      "#111411",
      "#292a1d"
    ];

    px(
      c,
      x,
      y,
      4+Math.random()*14,
      4+Math.random()*8,
      colors[i%colors.length]
    );
  }

  /* ROAD */

  const roadTop=H*.57;
  const roadBottom=H*.78;

  c.fillStyle="#25251f";

  c.beginPath();
  c.moveTo(W*.41,roadTop);
  c.lineTo(W*.59,roadTop);
  c.lineTo(W*.73,roadBottom);
  c.lineTo(W*.27,roadBottom);
  c.closePath();
  c.fill();

  /* ROAD EDGES */

  c.strokeStyle="#343329";
  c.lineWidth=7;

  c.beginPath();
  c.moveTo(W*.41,roadTop);
  c.lineTo(W*.27,roadBottom);
  c.stroke();

  c.beginPath();
  c.moveTo(W*.59,roadTop);
  c.lineTo(W*.73,roadBottom);
  c.stroke();

  /* ROAD PIXELS */

  for(let i=0;i<35;i++){

    const t=Math.random();

    const x=W*.41+(W*.59-W*.41)*t;
    const y=roadTop+(roadBottom-roadTop)*t;

    px(
      c,
      x+(Math.random()-.5)*90,
      y,
      8+Math.random()*14,
      4,
      "#303027"
    );
  }

  /* TREES LEFT */

  for(let i=0;i<20;i++){

    const x=30+Math.random()*330;
    const y=H*.57+Math.random()*95;

    drawTree(c,x,y,.75+Math.random()*.55);
  }

  /* TREES RIGHT */

  for(let i=0;i<20;i++){

    const x=W-40-Math.random()*350;
    const y=H*.57+Math.random()*95;

    drawTree(c,x,y,.75+Math.random()*.55);
  }


  /* =======================================================
     CASTLE WALL
     ======================================================= */

  const wallTop=H*.735;
  const wallBottom=H*.955;

  /* WALL BODY */

  rect(
    c,
    0,
    wallTop,
    W,
    wallBottom-wallTop,
    "#34373a"
  );

  /* large horizontal stone courses */

  for(let y=wallTop+8;y<wallBottom;y+=30){

    rect(
      c,
      0,
      y,
      W,
      3,
      "#202326"
    );
  }

  /* brick pattern */

  let row=0;

  for(let y=wallTop+4;y<wallBottom;y+=30){

    const offset=row%2?30:0;

    for(let x=-offset;x<W;x+=60){

      rect(
        c,
        x,
        y,
        3,
        27,
        "#202326"
      );

      rect(
        c,
        x+4,
        y+3,
        2,
        21,
        "#45494b"
      );
    }

    row++;
  }

  /* top stone course */

  rect(
    c,
    0,
    wallTop-7,
    W,
    13,
    "#4a4d4e"
  );

  rect(
    c,
    0,
    wallTop-7,
    W,
    3,
    "#686b69"
  );

  rect(
    c,
    0,
    wallTop+4,
    W,
    4,
    "#242729"
  );


  /* =======================================================
     MERLONS
     ======================================================= */

  const merlonW=42;
  const gap=18;
  const step=merlonW+gap;

  for(let x=10;x<W;x+=step){

    /* main block */

    rect(
      c,
      x,
      wallTop-43,
      merlonW,
      36,
      "#414446"
    );

    /* upper highlight */

    rect(
      c,
      x,
      wallTop-43,
      merlonW,
      5,
      "#5b5e5d"
    );

    /* dark right side */

    rect(
      c,
      x+merlonW-6,
      wallTop-38,
      6,
      31,
      "#292c2e"
    );

    /* pixel wear */

    px(c,x+7,wallTop-30,7,4,"#36393b");
    px(c,x+25,wallTop-18,9,4,"#35383a");
  }

  /* wall moss */

  for(let i=0;i<28;i++){

    const x=Math.random()*W;
    const y=wallTop+20+Math.random()*(wallBottom-wallTop-25);

    px(
      c,
      x,
      y,
      4+Math.random()*7,
      4,
      "#343d2d"
    );
  }

  /* walkway behind crenellations */

  rect(
    c,
    0,
    wallTop-7,
    W,
    6,
    "#262a2a"
  );


  /* TORCH HOLDERS */

  drawTorch(c,75,wallTop-2);
  drawTorch(c,W-75,wallTop-2);


  /* FRONT LAYER:
     intentionally transparent here.
     It is kept because the renderer expects a front layer.
  */

  return;
}


function drawTree(c,x,y,s=1){

  const trunkW=12*s;
  const trunkH=55*s;

  px(
    c,
    x-trunkW/2,
    y-trunkH,
    trunkW,
    trunkH,
    "#25231c"
  );

  px(
    c,
    x-trunkW/2+3*s,
    y-trunkH,
    4*s,
    trunkH,
    "#3a3224"
  );

  const greens=[
    "#101814",
    "#131d18",
    "#18231c",
    "#1b271f"
  ];

  px(c,x-30*s,y-80*s,60*s,20*s,greens[0]);
  px(c,x-38*s,y-62*s,76*s,25*s,greens[1]);
  px(c,x-27*s,y-92*s,54*s,22*s,greens[2]);
  px(c,x-15*s,y-110*s,30*s,25*s,greens[3]);

  px(c,x-22*s,y-65*s,8*s,7*s,"#26342a");
  px(c,x+12*s,y-82*s,9*s,8*s,"#243129");
}


function drawTorch(c,x,y){

  /* holder */

  px(c,x-5,y-5,10,8,"#171717");
  px(c,x-3,y+2,6,15,"#232323");

  /* flame */

  px(c,x-7,y-25,14,7,"#7b391c");
  px(c,x-5,y-33,10,10,"#b44d1d");
  px(c,x-2,y-39,6,9,"#df862b");
  px(c,x,y-44,4,8,"#e4ae42");

  px(c,x-10,y-20,5,7,"#8d431e");
  px(c,x+6,y-23,5,7,"#91451d");
}


/* =========================================================
   VIGNETTE
   ========================================================= */

function buildVig(){

  [vig,gv]=mk(W,H);

  const grad=gv.createRadialGradient(
    W/2,H*.5,
    Math.min(W,H)*.25,
    W/2,H*.5,
    Math.max(W,H)*.75
  );

  grad.addColorStop(0,"rgba(0,0,0,0)");
  grad.addColorStop(.72,"rgba(0,0,0,.12)");
  grad.addColorStop(1,"rgba(0,0,0,.70)");

  gv.fillStyle=grad;
  gv.fillRect(0,0,W,H);
}


/* =========================================================
   GAME DATA
   ========================================================= */

const game={
  running:true,
  over:false,

  wave:1,
  maxWave:10,

  wall:1000,
  maxWall:1000,

  gold:0,

  score:0,

  time:0,

  waveTimer:0,
  spawnTimer:0,

  waveActive:false,
  waveFinished:false,

  orcs:[],
  arrows:[],
  particles:[],

  kills:0
};

const archer={
  x:W/2,
  y:H*.705,

  speed:430,

  damage:20,
  fireRate:.55,

  cooldown:0,

  crit:.08,

  agility:1
};

const upgrades={
  damage:0,
  speed:0,
  wall:0,
  crit:0,
  agility:0
};


const types={
  normal:{
    hp:28,
    spd:5,
    dmg:5,
    cd:1.3,
    size:1,
    color:"#64704c"
  },

  fast:{
    hp:16,
    spd:10.5,
    dmg:3,
    cd:1,
    size:.8,
    color:"#7c754b"
  },

  heavy:{
    hp:85,
    spd:2.8,
    dmg:16,
    cd:1.7,
    size:1.25,
    color:"#4e5745"
  },

  elite:{
    hp:140,
    spd:3.7,
    dmg:24,
    cd:1.45,
    size:1.4,
    color:"#5f5542"
  }
};


/* =========================================================
   RESIZE
   ========================================================= */

function resize(){

  W=innerWidth;
  H=innerHeight;

  DPR=Math.min(2,devicePixelRatio||1);

  canvas.width=Math.floor(W*DPR);
  canvas.height=Math.floor(H*DPR);

  g.setTransform(DPR,0,0,DPR,0,0);

  ps=Math.max(
    3,
    Math.round(Math.min(W,H)/175)
  );

  archer.x=W/2;
  archer.y=H*.705;

  buildStatic();
  buildVig();
}

window.addEventListener("resize",resize);


/* =========================================================
   ARCHER
   ========================================================= */

function drawArcher(){

  const c=g;
  const x=Math.round(archer.x);
  const y=Math.round(archer.y);

  /* shadow */

  px(c,x-24,y+36,48,8,"#0b0d0c");
  px(c,x-16,y+44,32,4,"#080909");

  /* boots */

  px(c,x-17,y+23,13,16,"#17191a");
  px(c,x+4,y+23,13,16,"#17191a");

  px(c,x-20,y+37,17,6,"#0d0e0f");
  px(c,x+3,y+37,18,6,"#0d0e0f");

  /* legs */

  px(c,x-15,y+2,12,28,"#292c2e");
  px(c,x+4,y+2,12,28,"#292c2e");

  px(c,x-12,y+4,5,21,"#3b3f40");
  px(c,x+7,y+4,5,21,"#3b3f40");

  /* tunic */

  px(c,x-25,y-47,50,51,"#252d2c");
  px(c,x-29,y-35,8,35,"#1b211f");
  px(c,x+21,y-35,8,35,"#1b211f");

  /* tunic highlights */

  px(c,x-18,y-43,8,35,"#37413d");
  px(c,x+10,y-42,7,33,"#303934");

  /* belt */

  px(c,x-27,y-4,54,9,"#1a1714");
  px(c,x-27,y-1,54,3,"#56452e");

  px(c,x-4,y-5,9,10,"#9a7842");

  /* shoulders */

  px(c,x-35,y-37,12,15,"#303735");
  px(c,x+23,y-37,12,15,"#303735");

  /* left arm */

  px(c,x-39,y-30,12,29,"#272d2b");
  px(c,x-44,y-10,13,9,"#363d39");

  /* right arm */

  px(c,x+27,y-31,12,29,"#292f2d");
  px(c,x+31,y-9,13,9,"#353b38");

  /* neck */

  px(c,x-9,y-53,18,11,"#8a6c51");

  /* hood */

  px(c,x-27,y-84,54,36,"#171d1c");
  px(c,x-20,y-94,40,15,"#141a19");
  px(c,x-13,y-99,26,10,"#101514");

  /* hood highlight */

  px(c,x-21,y-84,7,25,"#303936");
  px(c,x+14,y-82,6,21,"#292f2d");

  /* face */

  px(c,x-18,y-72,36,24,"#9b795b");
  px(c,x-13,y-67,26,19,"#b18b67");

  /* face shadow */

  px(c,x-18,y-72,8,24,"#745943");
  px(c,x+10,y-65,8,17,"#805f46");

  /* eyes */

  px(c,x-9,y-62,5,4,"#111214");
  px(c,x+6,y-62,5,4,"#111214");

  /* nose */

  px(c,x+1,y-58,5,5,"#765740");

  /* scarf */

  px(c,x-21,y-52,42,8,"#171b1b");

  /* quiver */

  px(c,x+25,y-47,10,36,"#33271d");
  px(c,x+28,y-50,5,8,"#6e5234");

  for(let i=0;i<3;i++){
    px(
      c,
      x+26+i*3,
      y-57,
      2,
      12,
      "#b79a68"
    );
  }

  /* bow */

  const bx=x+40;
  const by=y-17;

  c.strokeStyle="#8c6338";
  c.lineWidth=5;

  c.beginPath();
  c.moveTo(bx,by-40);
  c.quadraticCurveTo(
    bx+22,
    by,
    bx,
    by+40
  );
  c.stroke();

  /* bow highlights */

  px(c,bx-3,by-38,6,8,"#b18248");
  px(c,bx-3,by+30,6,8,"#b18248");

  /* bow string */

  c.strokeStyle="#b8b19c";
  c.lineWidth=2;

  c.beginPath();
  c.moveTo(bx,by-40);
  c.lineTo(bx+3,by);
  c.lineTo(bx,by+40);
  c.stroke();

  /* arrow */

  const ax=bx+2;
  const ay=by-1;

  c.strokeStyle="#c8b48a";
  c.lineWidth=3;

  c.beginPath();
  c.moveTo(x+3,y-15);
  c.lineTo(ax+13,ay);
  c.stroke();

  /* arrowhead */

  c.fillStyle="#d1d2cb";

  c.beginPath();
  c.moveTo(ax+18,ay);
  c.lineTo(ax+9,ay-5);
  c.lineTo(ax+9,ay+5);
  c.closePath();
  c.fill();

  /* arrow fletching */

  px(c,x+1,y-19,9,4,"#735039");
  px(c,x+1,y-11,9,4,"#735039");
}


/* =========================================================
   ORCS
   ========================================================= */

function spawnOrc(){

  const pool=["normal"];

  if(game.wave>=3)pool.push("fast");
  if(game.wave>=5)pool.push("heavy");
  if(game.wave>=8)pool.push("elite");

  let type=pool[Math.floor(Math.random()*pool.length)];

  const t=types[type];

  const x=W*.5+(Math.random()-.5)*70;

  game.orcs.push({
    type,

    x,
    y:H*.60+Math.random()*18,

    hp:t.hp*(1+(game.wave-1)*.08),
    maxHp:t.hp*(1+(game.wave-1)*.08),

    speed:t.spd*(1+(game.wave-1)*.018),

    damage:t.dmg,
    cooldown:t.cd,

    attackTimer:0,

    size:t.size,

    dead:false,

    phase:Math.random()*10
  });
}


function drawOrc(o){

  const c=g;
  const s=o.size;

  const x=Math.round(o.x);
  const y=Math.round(o.y);

  /* shadow */

  px(
    c,
    x-20*s,
    y+30*s,
    40*s,
    7*s,
    "#0a0c0b"
  );

  /* legs */

  px(c,x-13*s,y+5*s,10*s,28*s,"#252923");
  px(c,x+3*s,y+5*s,10*s,28*s,"#252923");

  px(c,x-17*s,y+28*s,15*s,8*s,"#151716");
  px(c,x+4*s,y+28*s,16*s,8*s,"#151716");

  /* body */

  px(
    c,
    x-22*s,
    y-42*s,
    44*s,
    50*s,
    "#3d4736"
  );

  px(
    c,
    x-17*s,
    y-37*s,
    12*s,
    38*s,
    "#566147"
  );

  /* shoulder pads */

  px(c,x-31*s,y-36*s,13*s,18*s,"#4a503b");
  px(c,x+18*s,y-36*s,13*s,18*s,"#4a503b");

  /* head */

  px(
    c,
    x-25*s,
    y-70*s,
    50*s,
    34*s,
    "#667052"
  );

  /* ears */

  px(c,x-31*s,y-62*s,9*s,14*s,"#566046");
  px(c,x+22*s,y-62*s,9*s,14*s,"#566046");

  /* hair */

  px(c,x-22*s,y-75*s,44*s,10*s,"#20251d");

  /* face */

  px(c,x-18*s,y-62*s,36*s,24*s,"#737b59");

  /* brow */

  px(c,x-16*s,y-57*s,12*s,5*s,"#272c22");
  px(c,x+4*s,y-57*s,12*s,5*s,"#272c22");

  /* eyes */

  px(c,x-12*s,y-52*s,6*s,5*s,"#d2c56d");
  px(c,x+7*s,y-52*s,6*s,5*s,"#d2c56d");

  /* tusks */

  px(c,x-10*s,y-40*s,5*s,9*s,"#ddd5ad");
  px(c,x+5*s,y-40*s,5*s,9*s,"#ddd5ad");

  /* belt */

  px(c,x-23*s,y-1*s,46*s,7*s,"#241e17");
  px(c,x-4*s,y-2*s,9*s,9*s,"#9b713c");

  /* weapon */

  px(c,x+27*s,y-20*s,6*s,48*s,"#4c3522");
  px(c,x+25*s,y-27*s,10*s,12*s,"#77756b");

  /* hp bar */

  const bw=44*s;
  const bh=5*s;

  rect(
    c,
    x-bw/2,
    y-86*s,
    bw,
    bh,
    "#161817"
  );

  rect(
    c,
    x-bw/2+1,
    y-86*s+1,
    Math.max(
      0,
      (bw-2)*(o.hp/o.maxHp)
    ),
    bh-2,
    "#9b443b"
  );
}


/* =========================================================
   ARROWS
   ========================================================= */

function shoot(){

  if(archer.cooldown>0)return;

  initAudio();

  const sx=archer.x+55;
  const sy=archer.y-18;

  const dx=mouse.x-sx;
  const dy=mouse.y-sy;

  const len=Math.hypot(dx,dy)||1;

  const vx=dx/len;
  const vy=dy/len;

  const critical=Math.random()<archer.crit;

  game.arrows.push({
    x:sx,
    y:sy,

    vx:vx*900,
    vy:vy*900,

    damage:archer.damage*(critical?2:1),

    life:2,

    critical
  });

  archer.cooldown=archer.fireRate;

  sound(240,.06,"sawtooth",.035);
}


/* =========================================================
   PARTICLES
   ========================================================= */

function particle(x,y,color){

  game.particles.push({
    x,
    y,

    vx:(Math.random()-.5)*80,
    vy:(Math.random()-.5)*80,

    life:.35,

    color
  });
}


/* =========================================================
   UPDATE
   ========================================================= */

let last=performance.now();

function update(dt){

  if(!game.running)return;

  game.time+=dt;

  if(archer.cooldown>0){
    archer.cooldown-=dt;
  }

  /* movement */

  let move=0;

  if(keys["arrowleft"]||keys["a"])move-=1;
  if(keys["arrowright"]||keys["d"])move+=1;

  archer.x+=move*archer.speed*dt;

  archer.x=Math.max(
    80,
    Math.min(W-80,archer.x)
  );


  /* waves */

  if(!game.waveActive && !game.waveFinished){

    game.waveActive=true;
    game.waveTimer=0;
    game.spawnTimer=0;
  }

  if(game.waveActive){

    game.spawnTimer-=dt;

    const maxEnemies=
      5+game.wave*3;

    if(
      game.spawnTimer<=0 &&
      game.orcs.filter(o=>!o.dead).length<maxEnemies
    ){

      spawnOrc();

      game.spawnTimer=
        Math.max(.28,1.05-game.wave*.055);
    }

    const alive=
      game.orcs.filter(o=>!o.dead).length;

    if(
      alive===0 &&
      game.spawnTimer<0
    ){

      game.waveActive=false;
      game.waveFinished=true;

      game.wall=Math.min(
        game.maxWall,
        game.wall+200
      );

      game.gold+=100;

      setTimeout(()=>{

        if(game.wave<game.maxWave){

          game.wave++;
          game.waveFinished=false;

        }else{

          game.over=true;
          game.running=false;
        }

      },1800);
    }
  }


  /* ORCS */

  for(const o of game.orcs){

    if(o.dead)continue;

    const targetY=H*.735;

    if(o.y<targetY){

      o.y+=o.speed*dt*4;

      if(o.y>targetY)
        o.y=targetY;
    }

    else{

      o.attackTimer-=dt;

      if(o.attackTimer<=0){

        game.wall-=o.damage;

        o.attackTimer=o.cooldown;

        sound(80,.08,"square",.025);

        if(game.wall<=0){

          game.wall=0;
          game.over=true;
          game.running=false;
        }
      }
    }

    o.phase+=dt*5;
  }


  /* ARROWS */

  for(const a of game.arrows){

    a.x+=a.vx*dt;
    a.y+=a.vy*dt;
    a.life-=dt;

    for(const o of game.orcs){

      if(o.dead)continue;

      const d=Math.hypot(
        a.x-o.x,
        a.y-(o.y-35*o.size)
      );

      if(d<28*o.size){

        o.hp-=a.damage;

        particle(
          a.x,
          a.y,
          a.critical?"#e2b85b":"#aaa"
        );

        a.life=0;

        if(o.hp<=0){

          o.dead=true;

          game.kills++;
          game.score+=
            o.type==="elite"?100:
            o.type==="heavy"?50:
            o.type==="fast"?30:
            20;

          game.gold+=
            o.type==="elite"?30:
            o.type==="heavy"?15:
            8;

          for(let i=0;i<6;i++){

            particle(
              o.x,
              o.y-25,
              "#777"
            );
          }

          sound(120,.05,"square",.025);
        }

        break;
      }
    }
  }

  game.arrows=
    game.arrows.filter(a=>
      a.life>0 &&
      a.x>-100 &&
      a.x<W+100 &&
      a.y>-100 &&
      a.y<H+100
    );


  /* PARTICLES */

  for(const p of game.particles){

    p.x+=p.vx*dt;
    p.y+=p.vy*dt;

    p.life-=dt;
  }

  game.particles=
    game.particles.filter(p=>p.life>0);
}


/* =========================================================
   DRAW
   ========================================================= */

function draw(){

  g.clearRect(0,0,W,H);

  g.drawImage(back,0,0,W,H);

  /* enemies */

  for(const o of game.orcs){

    if(!o.dead)
      drawOrc(o);
  }

  /* player */

  drawArcher();

  /* arrows */

  for(const a of game.arrows){

    const angle=Math.atan2(
      a.vy,
      a.vx
    );

    g.save();

    g.translate(a.x,a.y);
    g.rotate(angle);

    px(g,-15,-1,25,3,"#bda777");

    px(g,8,-4,9,9,"#d5d8cf");

    px(g,-15,-4,7,4,"#72523b");
    px(g,-15,1,7,4,"#72523b");

    g.restore();
  }

  /* particles */

  for(const p of game.particles){

    const alpha=Math.max(
      0,
      p.life/.35
    );

    g.globalAlpha=alpha;

    px(
      g,
      p.x,
      p.y,
      6,
      6,
      p.color
    );
  }

  g.globalAlpha=1;

  /* front layer */

  if(front)
    g.drawImage(front,0,0,W,H);

  /* UI */

  drawUI();

  /* vignette */

  if(vig)
    g.drawImage(vig,0,0,W,H);
}


/* =========================================================
   UI
   ========================================================= */

function drawUI(){

  /* TOP BAR */

  rect(
    g,
    0,
    0,
    W,
    65,
    "rgba(7,9,11,.86)"
  );

  rect(
    g,
    0,
    63,
    W,
    2,
    "#393b38"
  );

  text(
    "THE LAST WALL",
    25,
    25,
    20,
    "#d2c39a"
  );

  text(
    "WAVE "+game.wave+" / "+game.maxWave,
    W/2,
    25,
    18,
    "#ddd"
  );

  text(
    "GOLD "+game.gold,
    W-25,
    25,
    17,
    "#caa95e",
    "right"
  );


  /* WALL HP */

  const bw=Math.min(300,W*.30);

  const bx=25;
  const by=78;

  rect(
    g,
    bx,
    by,
    bw,
    22,
    "#111414"
  );

  rect(
    g,
    bx+3,
    by+3,
    (bw-6)*(game.wall/game.maxWall),
    16,
    "#68764c"
  );

  text(
    "WALL "+Math.ceil(game.wall)+" / "+game.maxWall,
    bx+bw/2,
    by+11,
    13,
    "#eee",
    "center"
  );


  /* SCORE */

  text(
    "SCORE "+game.score,
    25,
    130,
    15,
    "#aaa"
  );

  text(
    "KILLS "+game.kills,
    25,
    151,
    15,
    "#aaa"
  );


  /* CONTROLS */

  if(W>700){

    text(
      "A / D — MOVE",
      W-25,
      H-62,
      14,
      "#aaa",
      "right"
    );

    text(
      "MOUSE — AIM   •   HOLD / RELEASE — FIRE",
      W-25,
      H-40,
      13,
      "#777",
      "right"
    );
  }


  /* WAVE STATUS */

  if(game.waveActive){

    text(
      "ORCS ARE COMING",
      W/2,
      H-35,
      15,
      "#b9a46d",
      "center"
    );

  }else if(game.waveFinished && !game.over){

    text(
      game.wave>=game.maxWave
        ?"THE WALL STANDS"
        :"WAVE CLEARED",
      W/2,
      H-35,
      18,
      "#d7c48e",
      "center"
    );
  }


  /* GAME OVER */

  if(game.over){

    rect(
      g,
      0,
      0,
      W,
      H,
      "rgba(0,0,0,.65)"
    );

    if(game.wall<=0){

      text(
        "THE WALL HAS FALLEN",
        W/2,
        H*.42,
        32,
        "#c9b48a",
        "center"
      );

      text(
        "SCORE "+game.score,
        W/2,
        H*.50,
        18,
        "#eee",
        "center"
      );

    }else{

      text(
        "THE LAST WALL STANDS",
        W/2,
        H*.42,
        32,
        "#d4c394",
        "center"
      );

      text(
        "ALL WAVES DEFEATED",
        W/2,
        H*.50,
        18,
        "#eee",
        "center"
      );
    }
  }
}


/* =========================================================
   LOOP
   ========================================================= */

function loop(now){

  const dt=Math.min(
    .033,
    (now-last)/1000
  );

  last=now;

  update(dt);
  draw();

  requestAnimationFrame(loop);
}


/* =========================================================
   START
   ========================================================= */

resize();
requestAnimationFrame(loop);

</script>
