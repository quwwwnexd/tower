<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Последний лучник</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: #080b0d;
            color: #eeeeee;
            font-family: Georgia, serif;
        }

        button {
            padding: 12px 22px;
            border: 1px solid #ad7b43;
            background: #3b271c;
            color: #f4ead2;
            font: inherit;
            cursor: pointer;
            box-shadow: 0 0 14px #000;
        }

        button:hover {
            background: #62402a;
        }

        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .hidden {
            display: none !important;
        }

        .screen {
            position: fixed;
            inset: 0;
            z-index: 10;

            display: grid;
            place-items: center;

            background:
                radial-gradient(
                    ellipse at center,
                    #293d31 0%,
                    #0b1110 65%,
                    #050707 100%
                );
        }

        .panel {
            width: min(720px, 90%);
            padding: 42px;
            text-align: center;

            background: rgba(17, 23, 26, 0.95);
            border: 1px solid #775331;
            box-shadow: 0 0 70px #000;
        }

        .panel h1 {
            margin: 0 0 18px;
            color: #c69453;
            font-size: clamp(38px, 7vw, 82px);
            text-shadow: 0 3px 15px #000;
        }

        .panel p {
            color: #c1c3b4;
            line-height: 1.6;
        }

        #game {
            position: relative;
            height: 100vh;
            overflow: hidden;

            background:
                linear-gradient(
                    #111923 0%,
                    #111923 26%,
                    #182921 26%,
                    #0a1513 100%
                );

            user-select: none;
        }

        .hud {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 8;

            height: 62px;
            padding: 10px 18px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;

            background: rgba(9, 11, 13, 0.9);
            border-bottom: 1px solid #72512d;

            color: #e8d4a4;
            font-weight: bold;
        }

        .hud-item {
            white-space: nowrap;
        }

        .health-bar {
            display: inline-block;
            width: 150px;
            height: 12px;
            margin-left: 7px;

            border: 1px solid #9b7650;
            background: #1b1110;
            vertical-align: middle;
        }

        .health-bar-fill {
            display: block;
            width: 100%;
            height: 100%;
            background: #a4362b;
            transition: width 0.2s;
        }

        .wall {
            position: absolute;
            top: 62px;
            left: 0;
            right: 0;
            z-index: 2;

            height: 29%;
            min-height: 180px;

            background:
                repeating-linear-gradient(
                    0deg,
                    transparent 0 32px,
                    #3a3d3b 33px 35px
                ),
                repeating-linear-gradient(
                    90deg,
                    #4c4d48 0 82px,
                    #292d2d 83px 87px
                );

            border-top: 18px solid #202626;
            box-shadow: 0 15px 25px #000;
        }

        .crenellations {
            position: absolute;
            top: -34px;
            left: 0;
            right: 0;

            height: 35px;

            background:
                repeating-linear-gradient(
                    90deg,
                    #343b38 0 44px,
                    transparent 44px 63px
                );

            filter: drop-shadow(0 -2px 1px #000);
        }

        .tower {
            position: absolute;
            top: -58px;

            width: 100px;
            height: 100px;

            background: #333a37;
            border: 8px solid #1f2525;
        }

        .tower-left {
            left: 2%;
        }

        .tower-right {
            right: 2%;
        }

        .torch {
            position: absolute;

            color: #ffb33c;
            font-size: 24px;
            filter: drop-shadow(0 0 14px #ff8c18);

            animation: flicker 0.4s infinite alternate;
        }

        .torch-left {
            top: 45px;
            left: 18%;
        }

        .torch-right {
            top: 45px;
            right: 18%;
        }

        @keyframes flicker {
            from {
                transform: scale(1);
                color: #ff9c25;
            }

            to {
                transform: scale(1.2);
                color: #ffd37b;
            }
        }

        .forest {
            position: absolute;
            inset: calc(62px + 29%) 0 0;
            overflow: hidden;

            background:
                linear-gradient(
                    #1c342c,
                    #10251e 45%,
                    #0a1715 75%,
                    #080e10
                );
        }

        .forest::before {
            content: "☁   ☁      ☁       ☁";

            position: absolute;
            top: 12%;
            left: 0;
            right: 0;

            color: rgba(198, 216, 189, 0.25);
            font-size: 48px;
            letter-spacing: 26px;
            text-align: center;
            filter: blur(8px);
        }

        .trees {
            position: absolute;
            inset: 0;

            color: #0b211b;
            font-size: clamp(48px, 9vw, 120px);
            line-height: 1.1;
            letter-spacing: 12px;
            opacity: 0.9;
        }

        .road {
            position: absolute;
            bottom: -8%;
            left: 37%;

            width: 26%;
            height: 120%;

            background: #3b3025;
            clip-path: polygon(42% 0, 58% 0, 100% 100%, 0 100%);
            opacity: 0.9;
        }

        .road::after {
            content: "✦   ✧     ✦       ✧";

            position: absolute;
            inset: 25% 0;

            color: #716148;
            letter-spacing: 15px;
            text-align: center;
        }

        #archer {
            position: absolute;
            top: calc(62px + 29% - 76px);
            left: 50%;
            z-index: 6;

            width: 60px;
            height: 78px;

            transform: translateX(-50%);
            transition: left 0.05s;
            pointer-events: none;
        }

        .archer-hood {
            position: absolute;
            top: 0;
            left: 13px;

            width: 36px;
            height: 40px;

            border: 3px solid #55524a;
            border-radius: 50% 50% 42% 42%;
            background: #171a1b;
        }

        .archer-body {
            position: absolute;
            top: 34px;
            left: 10px;

            width: 42px;
            height: 44px;

            border: 3px solid #62503c;
            border-radius: 12px 12px 4px 4px;
            background: #292525;
        }

        .archer-bow {
            position: absolute;
            top: 29px;
            left: -9px;

            width: 44px;
            height: 52px;

            border-left: 3px solid #b6844d;
            border-radius: 50%;
        }

        .archer-bow::after {
            content: "";

            position: absolute;
            top: 0;
            left: 0;

            height: 51px;
            border-left: 1px solid #ddd;
        }

        .enemy {
            position: absolute;
            z-index: 4;

            width: 42px;
            height: 55px;

            transform: translate(-50%, -50%);
            text-align: center;
            font-size: 31px;

            filter: drop-shadow(0 4px 2px #000);
        }

        .enemy-health {
            position: absolute;
            top: -8px;
            left: 0;

            width: 42px;
            height: 5px;

            border: 1px solid #9c7761;
            background: #280b0b;
        }

        .enemy-health-fill {
            display: block;
            width: 100%;
            height: 100%;
            background: #a7332a;
        }

        .projectile {
            position: absolute;
            z-index: 7;

            width: 30px;
            height: 4px;

            background: #d4bb80;
            box-shadow: 0 0 5px #ffd27a;
            transform-origin: left center;
        }

        .toast {
            position: absolute;
            top: 75px;
            left: 50%;
            z-index: 9;

            padding: 9px 18px;

            transform: translateX(-50%);

            border: 1px solid #987044;
            background: rgba(23, 27, 24, 0.9);
            color: #e8d4a4;
        }

        .wave-info {
            position: absolute;
            top: 75px;
            right: 18px;
            z-index: 8;

            color: #d8c08a;
            text-align: right;
        }

        .upgrade-panel {
            position: absolute;
            bottom: 10px;
            left: 50%;
            z-index: 8;

            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;

            transform: translateX(-50%);
        }

        .upgrade-panel button {
            padding: 8px 10px;
            font-size: 13px;
        }

        .game-over {
            position: absolute;
            inset: 0;
            z-index: 20;

            display: grid;
            place-items: center;

            background: rgba(5, 7, 6, 0.75);
        }

        .game-over-box {
            min-width: 300px;
            padding: 30px;

            border: 1px solid #a17345;
            background: #121817;
            text-align: center;
        }
    </style>
</head>

<body>

    <div id="menu" class="screen">
        <div class="panel">
            <h1>ПОСЛЕДНИЙ ЛУЧНИК</h1>

            <p>
                Ночь поглотила древний лес.
                Орда уже слышна у стен.
            </p>

            <p>
                Ты — последний защитник крепости.
            </p>

            <button id="start-button">
                Начать игру
            </button>

            <p>
                ← → — перемещение<br>
                Пробел или левая кнопка мыши — выстрел
            </p>
        </div>
    </div>

    <main id="game" class="hidden">

        <div class="hud">
            <div class="hud-item">
                WAVE:
                <span id="wave-value">1</span>
            </div>

            <div class="hud-item">
                🏰 WALL:
                <span id="wall-value">100/100</span>

                <span class="health-bar">
                    <span id="wall-bar" class="health-bar-fill"></span>
                </span>
            </div>

            <div class="hud-item">
                💰
                <span id="gold-value">0</span>
            </div>

            <div class="hud-item">
                👹
                <span id="enemies-value">0</span>
            </div>
        </div>

        <section class="wall">
            <div class="crenellations"></div>

            <div class="tower tower-left"></div>
            <div class="tower tower-right"></div>

            <div class="torch torch-left">🔥</div>
            <div class="torch torch-right">🔥</div>
        </section>

        <section class="forest">
            <div class="trees">
                ♣ ♣  ♠  ♣ ♣  ♠  ♣ ♣<br>
                ♠  ♣   ♣  ♠ ♣  ♣  ♠<br>
                ♣  ♠ ♣  ♣ ♠  ♣ ♣
            </div>

            <div class="road"></div>
        </section>

        <div id="archer">
            <div class="archer-hood"></div>
            <div class="archer-body"></div>
            <div class="archer-bow"></div>
        </div>

        <div id="toast" class="toast hidden"></div>

        <div id="wave-info" class="wave-info"></div>

        <div class="upgrade-panel">
            <button data-upgrade="damage">
                Урон +
                <span>50</span> 💰
            </button>

            <button data-upgrade="speed">
                Скорострельность +
                <span>60</span> 💰
            </button>

            <button data-upgrade="wall">
                Стена +25
                <span>80</span> 💰
            </button>

            <button data-upgrade="fire">
                Огненные стрелы
                <span>140</span> 💰
            </button>
        </div>

        <div id="game-over" class="game-over hidden">
            <div class="game-over-box">
                <h2 id="game-over-title"></h2>
                <p id="game-over-text"></p>

                <button id="restart-button">
                    Начать заново
                </button>
            </div>
        </div>
    </main>

    <script>
        "use strict";

        const menu = document.getElementById("menu");
        const game = document.getElementById("game");
        const startButton = document.getElementById("start-button");
        const restartButton = document.getElementById("restart-button");

        const archer = document.getElementById("archer");
        const forest = document.querySelector(".forest");

        const waveValue = document.getElementById("wave-value");
        const wallValue = document.getElementById("wall-value");
        const wallBar = document.getElementById("wall-bar");
        const goldValue = document.getElementById("gold-value");
        const enemiesValue = document.getElementById("enemies-value");

        const toastElement = document.getElementById("toast");
        const waveInfoElement = document.getElementById("wave-info");

        const gameOver = document.getElementById("game-over");
        const gameOverTitle = document.getElementById("game-over-title");
        const gameOverText = document.getElementById("game-over-text");

        const keys = {};

        const enemyTypes = {
            normal: {
                name: "Обычные орки",
                health: 55,
                speed: 22,
                reward: 12,
                icon: "👹"
            },

            fast: {
                name: "Быстрые орки",
                health: 30,
                speed: 38,
                reward: 15,
                icon: "👺"
            },

            heavy: {
                name: "Тяжёлые орки",
                health: 150,
                speed: 12,
                reward: 30,
                icon: "👿"
            },

            shield: {
                name: "Щитоносцы",
                health: 100,
                speed: 17,
                reward: 25,
                icon: "🛡️"
            }
        };

        let running = false;
        let animationFrame = 0;
        let lastFrameTime = 0;
        let lastShotTime = 0;

        let archerX = 0.5;

        let wallHealth = 100;
        let maxWallHealth = 100;

        let gold = 0;
        let wave = 0;

        let arrowDamage = 25;
        let shootingCooldown = 430;
        let fireArrows = false;

        let totalEnemiesInWave = 0;
        let spawnedEnemies = 0;

        const enemies = [];
        const projectiles = [];

        function showToast(message) {
            toastElement.textContent = message;
            toastElement.classList.remove("hidden");

            setTimeout(() => {
                toastElement.classList.add("hidden");
            }, 1800);
        }

        function resetGame() {
            running = true;

            archerX = 0.5;

            wallHealth = 100;
            maxWallHealth = 100;

            gold = 0;
            wave = 0;

            arrowDamage = 25;
            shootingCooldown = 430;
            fireArrows = false;

            spawnedEnemies = 0;
            totalEnemiesInWave = 0;

            enemies.forEach(enemy => {
                enemy.element.remove();
            });

            projectiles.forEach(projectile => {
                projectile.remove();
            });

            enemies.length = 0;
            projectiles.length = 0;

            document
                .querySelector('[data-upgrade="fire"]')
                .disabled = false;

            updateInterface();
        }

        function startGame() {
            menu.classList.add("hidden");
            game.classList.remove("hidden");
            gameOver.classList.add("hidden");

            resetGame();
            startNextWave();

            cancelAnimationFrame(animationFrame);
            animationFrame = requestAnimationFrame(gameLoop);
        }

        function startNextWave() {
            wave++;

            spawnedEnemies = 0;
            totalEnemiesInWave = 7 + wave * 3;

            const types = ["Обычные орки"];

            if (wave >= 2) {
                types.push("Быстрые орки");
            }

            if (wave >= 3) {
                types.push("Тяжёлые орки");
            }

            if (wave >= 4) {
                types.push("Щитоносцы");
            }

            waveInfoElement.innerHTML =
                `Следующая волна: ${totalEnemiesInWave}<br>` +
                types.join(" · ");

            showToast(
                `WAVE ${wave} — ${totalEnemiesInWave} врагов`
            );

            setTimeout(spawnEnemy, 900);
        }

        function chooseEnemyType() {
            const random = Math.random();

            if (wave >= 4 && random < 0.16) {
                return "shield";
            }

            if (wave >= 3 && random < 0.35) {
                return "heavy";
            }

            if (wave >= 2 && random < 0.55) {
                return "fast";
            }

            return "normal";
        }

        function spawnEnemy() {
            if (!running) {
                return;
            }

            if (spawnedEnemies >= totalEnemiesInWave) {
                return;
            }

            const typeName = chooseEnemyType();
            const type = enemyTypes[typeName];

            const enemy = {
                typeName,
                x: 0.2 + Math.random() * 0.6,
                y: 1.03,
                health: type.health,
                maxHealth: type.health,
                attackTimer: 0,
                element: document.createElement("div")
            };

            enemy.element.className = "enemy";

            enemy.element.innerHTML = `
                ${type.icon}
                <div class="enemy-health">
                    <span class="enemy-health-fill"></span>
                </div>
            `;

            forest.appendChild(enemy.element);
            enemies.push(enemy);

            spawnedEnemies++;

            setTimeout(
                spawnEnemy,
                Math.max(260, 900 - wave * 45)
            );
        }

        function shoot() {
            if (!running) {
                return;
            }

            const currentTime = performance.now();

            if (
                currentTime - lastShotTime < shootingCooldown
            ) {
                return;
            }

            lastShotTime = currentTime;

            const target = enemies
                .filter(enemy => enemy.y < 0.98)
                .sort((a, b) => b.y - a.y)[0];

            if (!target) {
                return;
            }

            const projectile = document.createElement("div");

            projectile.className = "projectile";

            const startX = archer.offsetLeft + 30;
            const startY = archer.offsetTop + 30;

            const targetX = target.x * window.innerWidth;
            const targetY =
                target.y * forest.clientHeight +
                forest.offsetTop;

            projectile.style.left = `${startX}px`;
            projectile.style.top = `${startY}px`;

            projectile.dataset.targetX = targetX;
            projectile.dataset.targetY = targetY;
            projectile.dataset.velocityX =
                (targetX - startX) / 420;
            projectile.dataset.velocityY =
                (targetY - startY) / 420;
            projectile.dataset.damage = arrowDamage;

            game.appendChild(projectile);
            projectiles.push(projectile);
        }

        function updateArcher() {
            if (keys.ArrowLeft) {
                archerX -= 0.00035 * 16;
            }

            if (keys.ArrowRight) {
                archerX += 0.00035 * 16;
            }

            archerX = Math.max(0.08, Math.min(0.92, archerX));

            archer.style.left = `${archerX * 100}%`;
        }

        function updateProjectiles(deltaTime) {
            for (let index = projectiles.length - 1; index >= 0; index--) {
                const projectile = projectiles[index];

                const x =
                    parseFloat(projectile.style.left) +
                    Number(projectile.dataset.velocityX) *
                    deltaTime;

                const y =
                    parseFloat(projectile.style.top) +
                    Number(projectile.dataset.velocityY) *
                    deltaTime;

                projectile.style.left = `${x}px`;
                projectile.style.top = `${y}px`;

                const angle = Math.atan2(
                    Number(projectile.dataset.velocityY),
                    Number(projectile.dataset.velocityX)
                );

                projectile.style.transform =
                    `rotate(${angle}rad)`;

                const hitEnemy = enemies.find(enemy => {
                    const enemyX = enemy.x * window.innerWidth;
                    const enemyY =
                        enemy.y * forest.clientHeight +
                        forest.offsetTop;

                    const distance = Math.hypot(
                        enemyX - x,
                        enemyY - y
                    );

                    return distance < 30;
                });

                if (hitEnemy) {
                    let damage =
                        Number(projectile.dataset.damage);

                    if (hitEnemy.typeName === "shield") {
                        damage *= 0.45;
                    }

                    hitEnemy.health -= damage;

                    if (fireArrows) {
                        hitEnemy.health -= 12;
                    }

                    projectile.remove();
                    projectiles.splice(index, 1);

                    if (hitEnemy.health <= 0) {
                        gold += enemyTypes[
                            hitEnemy.typeName
                        ].reward;

                        hitEnemy.element.remove();

                        enemies.splice(
                            enemies.indexOf(hitEnemy),
                            1
                        );
                    }

                    continue;
                }

                if (
                    x < -50 ||
                    x > window.innerWidth + 50 ||
                    y < 0 ||
                    y > window.innerHeight
                ) {
                    projectile.remove();
                    projectiles.splice(index, 1);
                }
            }
        }

        function updateEnemies(deltaTime) {
            for (let index = enemies.length - 1; index >= 0; index--) {
                const enemy = enemies[index];
                const type = enemyTypes[enemy.typeName];

                enemy.y -=
                    type.speed *
                    deltaTime /
                    100000;

                enemy.element.style.left =
                    `${enemy.x * 100}%`;

                enemy.element.style.top =
                    `${enemy.y * 100}%`;

                const healthFill =
                    enemy.element.querySelector(
                        ".enemy-health-fill"
                    );

                healthFill.style.width =
                    `${Math.max(
                        0,
                        enemy.health / enemy.maxHealth * 100
                    )}%`;

                if (enemy.y < 0.04) {
                    enemy.attackTimer += deltaTime;

                    if (enemy.attackTimer > 850) {
                        wallHealth -=
                            enemy.typeName === "heavy"
                                ? 5
                                : 2;

                        enemy.attackTimer = 0;
                    }
                }
            }
        }

        function updateInterface() {
            waveValue.textContent = wave;

            wallValue.textContent =
                `${Math.max(0, Math.ceil(wallHealth))}/${maxWallHealth}`;

            wallBar.style.width =
                `${Math.max(
                    0,
                    wallHealth / maxWallHealth * 100
                )}%`;

            goldValue.textContent = gold;

            enemiesValue.textContent =
                enemies.length +
                Math.max(0, totalEnemiesInWave - spawnedEnemies);
        }

        function gameOverScreen(playerWon) {
            running = false;

            gameOver.classList.remove("hidden");

            if (playerWon) {
                gameOverTitle.textContent =
                    "КРЕПОСТЬ ВЫСТОЯЛА";

                gameOverText.textContent =
                    "Орда рассеяна.";
            } else {
                gameOverTitle.textContent =
                    "СТЕНА ПАЛА";

                gameOverText.textContent =
                    "Последний факел погас.";
            }
        }

        function gameLoop(currentTime) {
            if (!running) {
                return;
            }

            const deltaTime =
                Math.min(
                    40,
                    currentTime - lastFrameTime || 16
                );

            lastFrameTime = currentTime;

            updateArcher();

            if (keys[" "]) {
                shoot();
            }

            updateProjectiles(deltaTime);
            updateEnemies(deltaTime);
            updateInterface();

            if (wallHealth <= 0) {
                gameOverScreen(false);
                return;
            }

            if (
                spawnedEnemies === totalEnemiesInWave &&
                enemies.length === 0
            ) {
                gold += 35 + wave * 8;
                startNextWave();
            }

            animationFrame =
                requestAnimationFrame(gameLoop);
        }

        function buyUpgrade(button) {
            const upgradeType =
                button.dataset.upgrade;

            const price =
                Number(button.querySelector("span").textContent);

            if (gold < price) {
                showToast("Недостаточно золота");
                return;
            }

            gold -= price;

            if (upgradeType === "damage") {
                arrowDamage += 12;
            }

            if (upgradeType === "speed") {
                shootingCooldown =
                    Math.max(150, shootingCooldown - 55);
            }

            if (upgradeType === "wall") {
                maxWallHealth += 25;
                wallHealth = Math.min(
                    maxWallHealth,
                    wallHealth + 25
                );
            }

            if (upgradeType === "fire") {
                fireArrows = true;
                button.disabled = true;
            }

            showToast("Улучшение куплено");
            updateInterface();
        }

        document.addEventListener("keydown", event => {
            keys[event.key] = true;

            if (event.key === " ") {
                event.preventDefault();
            }
        });

        document.addEventListener("keyup", event => {
            keys[event.key] = false;
        });

        document.addEventListener("mousedown", event => {
            if (event.target.tagName !== "BUTTON") {
                shoot();
            }
        });

        startButton.addEventListener("click", startGame);

        restartButton.addEventListener("click", () => {
            gameOver.classList.add("hidden");
            resetGame();
            startNextWave();

            cancelAnimationFrame(animationFrame);
            animationFrame = requestAnimationFrame(gameLoop);
        });

        document
            .querySelectorAll("[data-upgrade]")
            .forEach(button => {
                button.addEventListener("click", () => {
                    buyUpgrade(button);
                });
            });
    </script>
</body>
</html>
