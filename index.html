<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark Castle Defense</title>

<style>
* {
    box-sizing: border-box;
    user-select: none;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #090b0b;
    font-family: Georgia, serif;
    color: #eee;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    background: #101514;
}

#menu {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(circle at center, rgba(45,55,45,.25), rgba(0,0,0,.9)),
        #080a09;
    z-index: 20;
}

.menuBox {
    width: min(520px, 90vw);
    padding: 40px;
    text-align: center;
    border: 2px solid #655d47;
    background: rgba(15,18,16,.94);
    box-shadow: 0 0 50px rgba(0,0,0,.9);
}

.menuBox h1 {
    margin: 0 0 10px;
    font-size: 42px;
    color: #d6c59b;
    text-shadow: 0 0 15px #000;
}

.menuBox p {
    color: #aaa;
    line-height: 1.6;
}

button {
    margin-top: 20px;
    padding: 14px 32px;
    border: 1px solid #877852;
    background: #24251e;
    color: #e9dfc4;
    font-size: 18px;
    font-family: Georgia, serif;
    cursor: pointer;
}

button:hover {
    background: #35372b;
}

#hud {
    position: fixed;
    top: 15px;
    left: 15px;
    right: 15px;
    display: none;
    justify-content: space-between;
    pointer-events: none;
    z-index: 10;
}

.panel {
    padding: 10px 15px;
    border: 1px solid rgba(180,160,110,.45);
    background: rgba(5,7,6,.72);
    box-shadow: 0 3px 15px rgba(0,0,0,.5);
}

#gameOver {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.75);
    z-index: 30;
}

.gameOverBox {
    text-align: center;
    padding: 35px;
    background: #111512;
    border: 2px solid #665b42;
}

.gameOverBox h2 {
    color: #cbbd91;
    font-size: 38px;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="menu">
    <div class="menuBox">
        <h1>CASTLE OF ASH</h1>
        <p>
            Тёмный лес пробудился.<br>
            Орды орков идут к древней крепостной стене.
            Ты — последний лучник замка.
        </p>

        <button id="startButton">НАЧАТЬ ИГРУ</button>
    </div>
</div>

<div id="hud">
    <div class="panel">
        🏰 Стена: <span id="wallHp">100</span>/100
    </div>

    <div class="panel">
        🌊 Волна: <span id="wave">1</span>
    </div>

    <div class="panel">
        💰 Золото: <span id="gold">0</span>
    </div>
</div>

<div id="gameOver">
    <div class="gameOverBox">
        <h2>ЗАМОК ПАЛ</h2>
        <p>Орды леса прорвались к крепости.</p>
        <button id="restartButton">НАЧАТЬ ЗАНОВО</button>
    </div>
</div>

<script>
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}

window.addEventListener("resize", resize);
resize();


// ======================================================
// СОСТОЯНИЕ ИГРЫ
// ======================================================

let gameRunning = false;

let wallHP = 100;
let gold = 0;
let wave = 1;

let enemies = [];
let arrows = [];
let particles = [];
let rain = [];
let trees = [];

let waveTimer = 0;
let spawnTimer = 0;

let lightningTimer = 5;
let lightningFlash = 0;

let lastTime = 0;


// ======================================================
// ИГРОК
// ======================================================

const player = {
    x: 0,
    speed: 360,
    cooldown: 0,
    fireRate: 0.42,
    damage: 25
};


// ======================================================
// СТЕНА
// ======================================================

function wallY() {
    return H * 0.38;
}

function wallHeight() {
    return Math.max(105, H * 0.13);
}


// ======================================================
// СОЗДАНИЕ МИРА
// ======================================================

function createWorld() {

    trees = [];

    for (let i = 0; i < 90; i++) {

        const y = wallY() + 50 + Math.random() * (H - wallY() - 70);

        trees.push({
            x: Math.random() * W,
            y: y,
            size: 25 + Math.random() * 55,
            dark: Math.random()
        });
    }

    rain = [];

    for (let i = 0; i < 220; i++) {

        rain.push({
            x: Math.random() * W,
            y: Math.random() * H,
            speed: 450 + Math.random() * 350,
            length: 8 + Math.random() * 12
        });
    }
}


// ======================================================
// ФОН
// ======================================================

function drawBackground() {

    const gradient = ctx.createLinearGradient(0, 0, 0, H);

    gradient.addColorStop(0, "#11191a");
    gradient.addColorStop(.35, "#17201e");
    gradient.addColorStop(1, "#070b09");

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, W, H);


    // Луна

    ctx.beginPath();
    ctx.arc(W * .78, H * .13, 42, 0, Math.PI * 2);

    ctx.fillStyle = "#d7d4b8";
    ctx.shadowBlur = 30;
    ctx.shadowColor = "#aaa98d";
    ctx.fill();

    ctx.shadowBlur = 0;


    // Лёгкий туман

    for (let i = 0; i < 7; i++) {

        ctx.fillStyle = `rgba(100,115,105,${0.025 + i * .005})`;

        ctx.beginPath();

        ctx.ellipse(
            W * .5,
            wallY() + 100 + i * 45,
            W * .6,
            35,
            0,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }
}


// ======================================================
// ЛЕС
// ======================================================

function drawForest() {

    // Земля

    ctx.fillStyle = "#0b110d";

    ctx.fillRect(
        0,
        wallY() + wallHeight() * .45,
        W,
        H
    );


    // Тени дороги

    ctx.beginPath();

    ctx.moveTo(W * .45, H);
    ctx.bezierCurveTo(
        W * .52, H * .85,
        W * .42, H * .7,
        W * .55, wallY() + 70
    );

    ctx.lineTo(W * .67, wallY() + 70);

    ctx.bezierCurveTo(
        W * .53, H * .7,
        W * .64, H * .85,
        W * .58, H
    );

    ctx.closePath();

    ctx.fillStyle = "#20231b";
    ctx.fill();


    // Деревья

    for (const tree of trees) {

        drawTree(
            tree.x,
            tree.y,
            tree.size
        );
    }


    // Камни

    for (let i = 0; i < 28; i++) {

        const x = (i * 137) % W;
        const y = wallY() + 100 + ((i * 83) % Math.max(50, H - wallY() - 120));

        ctx.fillStyle = "#242923";

        ctx.beginPath();

        ctx.ellipse(
            x,
            y,
            12 + (i % 4) * 4,
            7,
            0,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }
}


function drawTree(x, y, size) {

    // Ствол

    ctx.fillStyle = "#17130f";

    ctx.fillRect(
        x - size * .11,
        y - size * .25,
        size * .22,
        size * .9
    );


    // Крона

    ctx.fillStyle = "#0d1712";

    for (let i = 0; i < 5; i++) {

        ctx.beginPath();

        ctx.arc(
            x + Math.sin(i * 4) * size * .22,
            y - size * .45 - i * size * .08,
            size * (.34 + (i % 2) * .08),
            0,
            Math.PI * 2
        );

        ctx.fill();
    }
}


// ======================================================
// ЗАМОК
// ======================================================

function drawCastle() {

    const y = wallY();
    const h = wallHeight();

    // Тень за стеной

    ctx.fillStyle = "#080a09";

    ctx.fillRect(
        0,
        y + h,
        W,
        35
    );


    // Основная стена

    ctx.fillStyle = "#343632";

    ctx.fillRect(
        0,
        y + 25,
        W,
        h
    );


    // Каменные блоки

    ctx.strokeStyle = "#222521";
    ctx.lineWidth = 2;

    const blockW = 70;
    const blockH = 28;

    for (let yy = y + 25; yy < y + h; yy += blockH) {

        const offset =
            Math.floor((yy - y) / blockH) % 2 === 0
            ? 0
            : blockW / 2;

        for (let xx = -blockW; xx < W + blockW; xx += blockW) {

            ctx.strokeRect(
                xx + offset,
                yy,
                blockW,
                blockH
            );
        }
    }


    // Верхняя площадка

    ctx.fillStyle = "#454741";

    ctx.fillRect(
        0,
        y + 18,
        W,
        18
    );


    // Зубцы

    const merlonW = 38;
    const gap = 20;

    ctx.fillStyle = "#3c3e39";

    for (
        let x = 0;
        x < W;
        x += merlonW + gap
    ) {

        ctx.fillRect(
            x,
            y - 12,
            merlonW,
            32
        );
    }


    // Башни по краям

    drawTower(55, y);
    drawTower(W - 55, y);


    // Факелы

    drawTorch(130, y + 12);
    drawTorch(W - 130, y + 12);
}


function drawTower(x, y) {

    const width = 90;
    const height = 145;

    // Тело башни

    ctx.fillStyle = "#393b36";

    ctx.fillRect(
        x - width / 2,
        y - height + 35,
        width,
        height
    );


    // Камни

    ctx.strokeStyle = "#242621";
    ctx.lineWidth = 2;

    for (
        let yy = y - height + 35;
        yy < y + 35;
        yy += 27
    ) {

        ctx.strokeRect(
            x - width / 2,
            yy,
            width,
            27
        );
    }


    // Верх башни

    ctx.fillStyle = "#464842";

    ctx.fillRect(
        x - width / 2 - 8,
        y - height + 20,
        width + 16,
        20
    );


    // Зубцы башни

    for (let i = -1; i <= 1; i++) {

        ctx.fillRect(
            x + i * 28 - 11,
            y - height - 5,
            22,
            27
        );
    }


    // Окно

    ctx.fillStyle = "#11130f";

    ctx.fillRect(
        x - 10,
        y - height + 60,
        20,
        30
    );
}


function drawTorch(x, y) {

    ctx.fillStyle = "#261c12";

    ctx.fillRect(
        x - 4,
        y,
        8,
        28
    );


    ctx.beginPath();

    ctx.arc(
        x,
        y - 3,
        8,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "#e1a844";

    ctx.shadowBlur = 20;
    ctx.shadowColor = "#e29b35";

    ctx.fill();

    ctx.shadowBlur = 0;
}


// ======================================================
// ЛУЧНИК
// ======================================================

function drawPlayer() {

    const x = player.x;
    const y = wallY() + 8;


    // Ноги — находятся за парапетом

    ctx.fillStyle = "#171814";

    ctx.fillRect(
        x - 9,
        y - 15,
        7,
        30
    );

    ctx.fillRect(
        x + 2,
        y - 15,
        7,
        30
    );


    // Тело

    ctx.fillStyle = "#292d28";

    ctx.beginPath();

    ctx.roundRect(
        x - 15,
        y - 58,
        30,
        45,
        6
    );

    ctx.fill();


    // Голова

    ctx.beginPath();

    ctx.arc(
        x,
        y - 70,
        12,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "#b29b7a";
    ctx.fill();


    // Капюшон

    ctx.fillStyle = "#151914";

    ctx.beginPath();

    ctx.arc(
        x,
        y - 72,
        15,
        Math.PI,
        Math.PI * 2
    );

    ctx.fill();


    // Лук

    ctx.strokeStyle = "#8d6842";
    ctx.lineWidth = 4;

    ctx.beginPath();

    ctx.arc(
        x + 21,
        y - 42,
        28,
        -Math.PI * .8,
        Math.PI * .8
    );

    ctx.stroke();


    // Тетива

    ctx.strokeStyle = "#c7bda1";
    ctx.lineWidth = 1;

    ctx.beginPath();

    ctx.moveTo(
        x + 14,
        y - 67
    );

    ctx.lineTo(
        x + 14,
        y - 17
    );

    ctx.stroke();


    // Стрела

    ctx.strokeStyle = "#ddd2ad";
    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.moveTo(
        x + 2,
        y - 43
    );

    ctx.lineTo(
        x + 43,
        y - 43
    );

    ctx.stroke();


    // Передняя часть зубцов,
    // чтобы лучник выглядел стоящим ЗА стеной

    drawFrontBattlements();
}


function drawFrontBattlements() {

    const y = wallY();

    const merlonW = 38;
    const gap = 20;

    ctx.fillStyle = "#3c3e39";

    for (
        let x = 0;
        x < W;
        x += merlonW + gap
    ) {

        ctx.fillRect(
            x,
            y - 12,
            merlonW,
            22
        );
    }
}


// ======================================================
// ВРАГИ
// ======================================================

function spawnEnemy(type = "orc") {

    let enemy;

    if (type === "fast") {

        enemy = {
            type: "fast",
            x: W * .2 + Math.random() * W * .6,
            y: H - 40,
            hp: 35,
            maxHp: 35,
            speed: 72,
            damage: 7,
            reward: 12,
            size: 22
        };

    } else if (type === "heavy") {

        enemy = {
            type: "heavy",
            x: W * .2 + Math.random() * W * .6,
            y: H - 40,
            hp: 130,
            maxHp: 130,
            speed: 27,
            damage: 16,
            reward: 30,
            size: 34
        };

    } else {

        enemy = {
            type: "orc",
            x: W * .2 + Math.random() * W * .6,
            y: H - 40,
            hp: 60,
            maxHp: 60,
            speed: 43,
            damage: 9,
            reward: 10,
            size: 27
        };
    }

    enemies.push(enemy);
}


function drawEnemy(e) {

    const size = e.size;

    // Тело

    ctx.fillStyle =
        e.type === "heavy"
        ? "#30352c"
        : e.type === "fast"
        ? "#39452f"
        : "#34402e";

    ctx.beginPath();

    ctx.ellipse(
        e.x,
        e.y,
        size * .55,
        size,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // Голова

    ctx.fillStyle = "#536044";

    ctx.beginPath();

    ctx.arc(
        e.x,
        e.y - size * .75,
        size * .42,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // Уши

    ctx.beginPath();

    ctx.moveTo(
        e.x - size * .3,
        e.y - size * .8
    );

    ctx.lineTo(
        e.x - size * .65,
        e.y - size * .95
    );

    ctx.lineTo(
        e.x - size * .35,
        e.y - size * .6
    );

    ctx.fill();


    ctx.beginPath();

    ctx.moveTo(
        e.x + size * .3,
        e.y - size * .8
    );

    ctx.lineTo(
        e.x + size * .65,
        e.y - size * .95
    );

    ctx.lineTo(
        e.x + size * .35,
        e.y - size * .6
    );

    ctx.fill();


    // Глаза

    ctx.fillStyle = "#d9bd65";

    ctx.fillRect(
        e.x - size * .22,
        e.y - size * .8,
        5,
        5
    );

    ctx.fillRect(
        e.x + size * .08,
        e.y - size * .8,
        5,
        5
    );


    // Оружие

    ctx.strokeStyle = "#6e5034";
    ctx.lineWidth = 5;

    ctx.beginPath();

    ctx.moveTo(
        e.x + size * .35,
        e.y - size * .1
    );

    ctx.lineTo(
        e.x + size * .8,
        e.y + size * .6
    );

    ctx.stroke();


    // Полоска HP

    ctx.fillStyle = "#180e0d";

    ctx.fillRect(
        e.x - size,
        e.y - size * 1.35,
        size * 2,
        5
    );

    ctx.fillStyle = "#a84e43";

    ctx.fillRect(
        e.x - size,
        e.y - size * 1.35,
        size * 2 * (e.hp / e.maxHp),
        5
    );
}


// ======================================================
// СТРЕЛЫ
// ======================================================

function shoot() {

    if (!gameRunning) return;

    if (player.cooldown > 0) return;

    player.cooldown = player.fireRate;

    arrows.push({
        x: player.x,
        y: wallY() - 25,
        speed: 700,
        damage: player.damage,
        angle: -Math.PI / 2
    });
}


function drawArrow(a) {

    ctx.save();

    ctx.translate(a.x, a.y);
    ctx.rotate(a.angle);

    ctx.strokeStyle = "#d8c59a";
    ctx.lineWidth = 3;

    ctx.beginPath();

    ctx.moveTo(-18, 0);
    ctx.lineTo(18, 0);

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(18, 0);
    ctx.lineTo(10, -5);

    ctx.moveTo(18, 0);
    ctx.lineTo(10, 5);

    ctx.stroke();

    ctx.restore();
}


// ======================================================
// ЧАСТИЦЫ
// ======================================================

function createHitParticles(x, y) {

    for (let i = 0; i < 7; i++) {

        particles.push({
            x: x,
            y: y,
            vx: -80 + Math.random() * 160,
            vy: -80 + Math.random() * 160,
            life: .35
        });
    }
}


function updateParticles(dt) {

    for (const p of particles) {

        p.x += p.vx * dt;
        p.y += p.vy * dt;

        p.life -= dt;
    }

    particles =
        particles.filter(p => p.life > 0);
}


function drawParticles() {

    for (const p of particles) {

        ctx.fillStyle =
            `rgba(210,180,100,${p.life * 2})`;

        ctx.fillRect(
            p.x,
            p.y,
            4,
            4
        );
    }
}


// ======================================================
// ДОЖДЬ
// ======================================================

function updateRain(dt) {

    for (const r of rain) {

        r.y += r.speed * dt;

        if (r.y > H) {

            r.y = -20;
            r.x = Math.random() * W;
        }
    }
}


function drawRain() {

    ctx.strokeStyle = "rgba(170,190,190,.18)";
    ctx.lineWidth = 1;

    for (const r of rain) {

        ctx.beginPath();

        ctx.moveTo(
            r.x,
            r.y
        );

        ctx.lineTo(
            r.x - 4,
            r.y + r.length
        );

        ctx.stroke();
    }
}


// ======================================================
// МОЛНИЯ
// ======================================================

function updateLightning(dt) {

    lightningTimer -= dt;

    if (lightningTimer <= 0) {

        lightningTimer = 5;

        lightningFlash = .15;
    }

    if (lightningFlash > 0) {

        lightningFlash -= dt;
    }
}


function drawLightning() {

    if (lightningFlash <= 0) return;

    ctx.fillStyle =
        `rgba(220,230,220,${lightningFlash * 2})`;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );
}


// ======================================================
// ВОЛНЫ
// ======================================================

function startWave() {

    waveTimer = 0;

    let count =
        5 + wave * 2;

    for (let i = 0; i < count; i++) {

        setTimeout(() => {

            if (!gameRunning) return;

            let type = "orc";

            if (
                wave >= 2 &&
                Math.random() < .2
            ) {
                type = "fast";
            }

            if (
                wave >= 3 &&
                Math.random() < .12
            ) {
                type = "heavy";
            }

            spawnEnemy(type);

        }, i * 700);
    }
}


// ======================================================
// ОБНОВЛЕНИЕ
// ======================================================

function update(dt) {

    if (!gameRunning) return;


    // Игрок

    if (keys.left) {

        player.x -= player.speed * dt;
    }

    if (keys.right) {

        player.x += player.speed * dt;
    }

    player.x =
        Math.max(35, Math.min(W - 35, player.x));


    if (player.cooldown > 0) {

        player.cooldown -= dt;
    }


    // Стрелы

    for (const a of arrows) {

        a.y -= a.speed * dt;
    }


    // Попадания

    for (let ai = arrows.length - 1; ai >= 0; ai--) {

        const a = arrows[ai];

        let hit = false;

        for (
            let ei = enemies.length - 1;
            ei >= 0;
            ei--
        ) {

            const e = enemies[ei];

            const dx = a.x - e.x;
            const dy = a.y - e.y;

            const distance =
                Math.sqrt(dx * dx + dy * dy);

            if (distance < e.size) {

                e.hp -= a.damage;

                createHitParticles(
                    e.x,
                    e.y - e.size * .5
                );

                hit = true;

                if (e.hp <= 0) {

                    gold += e.reward;

                    enemies.splice(ei);
                }

                break;
            }
        }

        if (
            hit ||
            a.y < wallY() - 180
        ) {

            arrows.splice(ai, 1);
        }
    }


    // Орки

    for (let i = enemies.length - 1; i >= 0; i--) {

        const e = enemies[i];

        const targetY =
            wallY() + wallHeight() * .2;

        if (e.y > targetY) {

            e.y -= e.speed * dt;

        } else {

            wallHP -= e.damage * dt;

            if (wallHP <= 0) {

                wallHP = 0;
                endGame();
            }
        }
    }


    updateParticles(dt);
    updateRain(dt);
    updateLightning(dt);


    // Автоматическое появление новых волн

    waveTimer += dt;

    if (
        enemies.length === 0 &&
        waveTimer > 3
    ) {

        wave++;

        startWave();
    }


    updateHUD();
}


// ======================================================
// УПРАВЛЕНИЕ
// ======================================================

const keys = {
    left: false,
    right: false
};


window.addEventListener("keydown", e => {

    if (
        e.key === "ArrowLeft" ||
        e.key.toLowerCase() === "a"
    ) {
        keys.left = true;
    }

    if (
        e.key === "ArrowRight" ||
        e.key.toLowerCase() === "d"
    ) {
        keys.right = true;
    }

    if (e.code === "Space") {

        e.preventDefault();

        shoot();
    }
});


window.addEventListener("keyup", e => {

    if (
        e.key === "ArrowLeft" ||
        e.key.toLowerCase() === "a"
    ) {
        keys.left = false;
    }

    if (
        e.key === "ArrowRight" ||
        e.key.toLowerCase() === "d"
    ) {
        keys.right = false;
    }
});


// ======================================================
// ОТРИСОВКА
// ======================================================

function draw() {

    drawBackground();

    drawForest();


    // Враги

    for (const e of enemies) {

        drawEnemy(e);
    }


    // Замок

    drawCastle();


    // Лучник

    drawPlayer();


    // Стрелы

    for (const a of arrows) {

        drawArrow(a);
    }


    drawParticles();

    drawRain();

    drawLightning();
}


// ======================================================
// HUD
// ======================================================

function updateHUD() {

    document.getElementById("wallHp").textContent =
        Math.ceil(wallHP);

    document.getElementById("wave").textContent =
        wave;

    document.getElementById("gold").textContent =
        gold;
}


// ======================================================
// СТАРТ
// ======================================================

function startGame() {

    document.getElementById("menu").style.display =
        "none";

    document.getElementById("hud").style.display =
        "flex";

    document.getElementById("gameOver").style.display =
        "none";

    wallHP = 100;
    gold = 0;
    wave = 1;

    enemies = [];
    arrows = [];
    particles = [];

    player.x = W / 2;
    player.cooldown = 0;

    gameRunning = true;

    createWorld();

    startWave();

    lastTime = performance.now();

    requestAnimationFrame(gameLoop);
}


// ======================================================
// КОНЕЦ ИГРЫ
// ======================================================

function endGame() {

    gameRunning = false;

    document.getElementById("gameOver").style.display =
        "flex";
}


// ======================================================
// GAME LOOP
// ======================================================

function gameLoop(time) {

    if (!gameRunning) return;

    const dt =
        Math.min(
            (time - lastTime) / 1000,
            .033
        );

    lastTime = time;

    update(dt);

    draw();

    requestAnimationFrame(gameLoop);
}


// ======================================================
// КНОПКИ
// ======================================================

document
    .getElementById("startButton")
    .addEventListener("click", startGame);


document
    .getElementById("restartButton")
    .addEventListener("click", startGame);


// ======================================================
// НАЧАЛЬНОЕ СОСТОЯНИЕ
// ======================================================

createWorld();

draw();

</script>

</body>
</html>
