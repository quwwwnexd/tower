<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE LAST WALL</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #0a0a0a;
            font-family: 'Georgia', serif;
            color: #e0d4b8;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        .panel {
            position: absolute;
            background: rgba(20, 15, 10, 0.85);
            border: 3px solid #8b5a2b;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(139, 90, 43, 0.6);
            font-size: 22px;
            text-shadow: 2px 2px 4px #000;
        }
        #wavePanel {
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 30px;
        }
        #castlePanel {
            bottom: 30px;
            left: 30px;
            font-size: 18px;
        }
        #orcsPanel {
            bottom: 30px;
            right: 30px;
        }
        #gameOver, #victory {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 5, 5, 0.95);
            border: 6px solid #8b0000;
            padding: 40px 60px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 0 60px #8b0000;
            display: none;
            z-index: 20;
        }
        #gameOver h1, #victory h1 {
            color: #8b0000;
            margin: 0 0 20px 0;
            font-size: 42px;
            text-shadow: 0 0 15px #8b0000;
        }
        button {
            margin-top: 30px;
            padding: 12px 40px;
            font-size: 22px;
            background: #4a2c0f;
            color: #e0d4b8;
            border: 3px solid #8b5a2b;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover {
            background: #6b3f1a;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <canvas id="canvas" width="1280" height="720"></canvas>
    
    <div id="ui">
        <!-- WAVE -->
        <div id="wavePanel" class="panel">WAVE <span id="waveNum">1</span></div>
        
        <!-- CASTLE HP -->
        <div id="castlePanel" class="panel">
            CASTLE HP: <span id="castleHP">1000</span> / 1000
        </div>
        
        <!-- ORCS -->
        <div id="orcsPanel" class="panel">
            ORCS: <span id="orcsCount">0</span>
        </div>
    </div>
    
    <!-- GAME OVER -->
    <div id="gameOver">
        <h1>CASTLE FALLEN</h1>
        <p>WAVE REACHED: <span id="finalWave">1</span></p>
        <p>ORCS SLAIN: <span id="finalSlain">0</span></p>
        <button onclick="restartGame()">RESTART</button>
    </div>
    
    <!-- VICTORY -->
    <div id="victory">
        <h1>CASTLE DEFENDED</h1>
        <p>WAVE REACHED: <span id="finalWave2">1</span></p>
        <p>ORCS SLAIN: <span id="finalSlain2">0</span></p>
        <p>GOLD GAINED: <span id="finalGold2">0</span></p>
        <button onclick="restartGame()">NEW GAME</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 1280;
        canvas.height = 720;

        // Game constants
        const WIDTH = canvas.width;
        const HEIGHT = canvas.height;
        const GROUND_Y = HEIGHT - 160;

        // Game variables
        let castleHP = 1000;
        let maxCastleHP = 1000;
        let currentWave = 1;
        let orcsSlain = 0;
        let gold = 0;
        let gameState = 'playing'; // playing, gameOver, victory
        let paused = false;

        // Player
        let playerX = WIDTH / 2;
        let playerAimX = WIDTH / 2;
        let playerAimY = 380;
        let playerHealth = 1;
        let bowCharge = 0;
        let isCharging = false;

        // Objects
        let arrows = [];
        let orcs = [];
        let particles = [];
        let towers = [];
        let trees = [];

        // Input
        let keys = {};
        let mouseDown = false;
        let lastAimUpdate = 0;

        // Audio
        let audioCtx;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            if (type === 'shoot') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                gain.gain.value = 0.6;
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.12);
                osc.frequency.linearRampToValueAtTime(80, audioCtx.currentTime + 0.12);
            } else if (type === 'hit') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(420, audioCtx.currentTime);
                gain.gain.value = 0.4;
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.08);
            } else if (type === 'death') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                gain.gain.value = 0.5;
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
            } else if (type === 'waveStart') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(240, audioCtx.currentTime);
                gain.gain.value = 0.3;
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.6);
            } else if (type === 'victory') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(520, audioCtx.currentTime);
                gain.gain.value = 0.7;
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1.2);
            }
            osc.start();
            osc.stop(audioCtx.currentTime + 2);
        }

        // Classes
        class Arrow {
            constructor(x, y, tx, ty) {
                this.x = x;
                this.y = y;
                this.tx = tx;
                this.ty = ty;
                this.vx = (tx - x) / 18;
                this.vy = (ty - y) / 18;
                this.angle = Math.atan2(ty - y, tx - x);
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.angle = Math.atan2(this.vy, this.vx);
            }
        }

        class Orc {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type || 'normal';
                this.health = type === 'elite' ? 280 : type === 'heavy' ? 180 : type === 'fast' ? 90 : 120;
                this.maxHealth = this.health;
                this.speed = type === 'fast' ? 2.8 : type === 'heavy' ? 1.1 : type === 'elite' ? 2.2 : 1.9;
                this.damage = type === 'heavy' ? 12 : type === 'elite' ? 18 : 8;
                this.width = type === 'heavy' ? 68 : 48;
                this.height = type === 'heavy' ? 92 : 68;
                this.attackTimer = 0;
                this.isAttackingWall = false;
                this.alive = true;
            }
            update() {
                if (!this.alive) return;
                
                // Check if reached wall (gate area)
                if (this.x > WIDTH * 0.68 && this.x < WIDTH * 0.78) {
                    this.isAttackingWall = true;
                }
                
                if (this.isAttackingWall) {
                    // Attack wall
                    this.attackTimer++;
                    if (this.attackTimer > 55) {
                        this.attackTimer = 0;
                        castleHP -= this.damage;
                        if (castleHP < 0) castleHP = 0;
                        playSound('hit');
                    }
                    return;
                }
                
                // Move forward
                this.x += this.speed;
                
                // Check collision with arrows
                for (let i = arrows.length - 1; i >= 0; i--) {
                    let a = arrows[i];
                    let dx = a.x - this.x;
                    let dy = a.y - this.y;
                    let dist = Math.hypot(dx, dy);
                    if (dist < 32) {
                        this.health -= 35;
                        arrows.splice(i, 1);
                        particles.push(new Particle(this.x, this.y, '#ff2222', 12));
                        playSound('hit');
                        if (this.health <= 0) {
                            this.alive = false;
                            orcsSlain++;
                            gold += 12;
                            particles.push(new Particle(this.x, this.y - 20, '#ffdd00', 25));
                            playSound('death');
                        }
                        break;
                    }
                }
            }
        }

        class Particle {
            constructor(x, y, color, life) {
                this.x = x;
                this.y = y;
                this.vx = Math.random() * 6 - 3;
                this.vy = Math.random() * -6 - 2;
                this.life = life;
                this.maxLife = life;
                this.color = color;
                this.size = 6 + Math.random() * 7;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.18;
                this.life--;
            }
            draw() {
                const alpha = this.life / this.maxLife;
                ctx.save();
                ctx.globalAlpha = alpha * 0.9;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * alpha, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class Tree {
            constructor(x) {
                this.x = x;
                this.y = GROUND_Y - 70;
                this.height = 180 + Math.random() * 60;
            }
            draw() {
                // Trunk
                ctx.fillStyle = '#3f2a1e';
                ctx.fillRect(this.x - 9, this.y - 8, 18, this.height);
                // Foliage
                ctx.fillStyle = '#1a3f1a';
                ctx.beginPath();
                ctx.ellipse(this.x, this.y - this.height / 2, 42, 55, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(this.x + 22, this.y - this.height * 0.35, 38, 48, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(this.x - 22, this.y - this.height * 0.4, 35, 45, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Create initial objects
        function createCastle() {
            towers = [
                {x: 180, h: 220, w: 42, y: GROUND_Y - 220},
                {x: WIDTH - 220, h: 220, w: 42, y: GROUND_Y - 220}
            ];
        }

        function createTrees() {
            trees = [];
            for (let i = 0; i < 13; i++) {
                trees.push(new Tree(80 + i * 78));
            }
            for (let i = 0; i < 9; i++) {
                trees.push(new Tree(WIDTH - 260 - i * 82));
            }
        }

        function spawnOrc(type = 'normal') {
            const spawnX = 80 + Math.random() * (WIDTH * 0.55);
            orcs.push(new Orc(spawnX, 180, type));
        }

        // Game loop
        function gameLoop() {
            if (gameState === 'gameOver' || gameState === 'victory') {
                requestAnimationFrame(gameLoop);
                return;
            }

            // Clear
            ctx.fillStyle = '#0f1a14';
            ctx.fillRect(0, 0, WIDTH, HEIGHT);

            // Background field
            ctx.fillStyle = '#2a3a2a';
            ctx.fillRect(0, GROUND_Y + 20, WIDTH, HEIGHT - GROUND_Y - 30);

            // Road
            ctx.fillStyle = '#1c1c1c';
            ctx.fillRect(WIDTH * 0.42, GROUND_Y + 35, WIDTH * 0.38, 38);
            ctx.fillStyle = '#555';
            ctx.fillRect(WIDTH * 0.44, GROUND_Y + 42, WIDTH * 0.34, 24);

            // Trees
            trees.forEach(t => t.draw());

            // Towers
            towers.forEach(t => {
                ctx.fillStyle = '#6b4e2a';
                ctx.fillRect(t.x, t.y, t.w, t.h);
                ctx.fillStyle = '#3f2a1e';
                ctx.fillRect(t.x + 4, t.y + 12, t.w - 8, 30);
            });

            // Update and draw orcs
            for (let i = orcs.length - 1; i >= 0; i--) {
                let o = orcs[i];
                o.update();
                if (!o.alive) {
                    orcs.splice(i, 1);
                    continue;
                }
                
                // Draw orc
                const bob = Math.sin(Date.now() / 180) * 3;
                
                // Body
                ctx.fillStyle = o.type === 'heavy' ? '#4a2f1f' : '#2a1f14';
                ctx.fillRect(o.x - o.width / 2, o.y + 12 + bob, o.width, o.height - 22);
                
                // Head
                ctx.fillStyle = '#3a2a1e';
                ctx.beginPath();
                ctx.arc(o.x, o.y - 18 + bob, 19, 0, Math.PI * 2);
                ctx.fill();
                
                // Eyes
                ctx.fillStyle = '#ffdd88';
                ctx.fillRect(o.x - 8, o.y - 24 + bob, 5, 5);
                ctx.fillRect(o.x + 3, o.y - 24 + bob, 5, 5);
                
                // Legs
                ctx.strokeStyle = '#2a1f14';
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.moveTo(o.x - 12, o.y + 32 + bob);
                ctx.lineTo(o.x - 18, o.y + 52 + bob);
                ctx.moveTo(o.x + 12, o.y + 32 + bob);
                ctx.lineTo(o.x + 18, o.y + 52 + bob);
                ctx.stroke();
            }

            // Update and draw arrows
            for (let i = arrows.length - 1; i >= 0; i--) {
                let a = arrows[i];
                a.update();
                ctx.save();
                ctx.translate(a.x, a.y);
                ctx.rotate(a.angle);
                ctx.fillStyle = '#e0c080';
                ctx.fillRect(-12, -3, 24, 6);
                ctx.fillStyle = '#aa6644';
                ctx.fillRect(8, -4, 14, 8);
                ctx.restore();
                
                // Check wall hit
                if (a.y < GROUND_Y - 80) {
                    arrows.splice(i, 1);
                }
            }

            // Update and draw particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.update();
                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                p.draw();
            }

            // Draw player (archer on wall)
            const playerY = GROUND_Y - 110;
            const bobPlayer = Math.sin(Date.now() / 140) * 2;
            
            // Wall part under player
            ctx.fillStyle = '#5c4635';
            ctx.fillRect(playerX - 28, GROUND_Y - 110, 56, 110);
            
            // Legs
            ctx.strokeStyle = '#2a1f14';
            ctx.lineWidth = 8;
            ctx.beginPath();
            ctx.moveTo(playerX - 14, playerY + 48);
            ctx.lineTo(playerX - 18, playerY + 68);
            ctx.moveTo(playerX + 14, playerY + 48);
            ctx.lineTo(playerX + 18, playerY + 68);
            ctx.stroke();
            
            // Body
            ctx.fillStyle = '#2a1f14';
            ctx.fillRect(playerX - 19, playerY + 18, 38, 48);
            
            // Head
            ctx.fillStyle = '#f5d0a0';
            ctx.beginPath();
            ctx.arc(playerX, playerY + 8, 17, 0, Math.PI * 2);
            ctx.fill();
            
            // Hood
            ctx.fillStyle = '#1a120f';
            ctx.beginPath();
            ctx.moveTo(playerX - 13, playerY - 4);
            ctx.quadraticCurveTo(playerX, playerY - 26, playerX + 13, playerY - 4);
            ctx.fill();
            
            // Bow
            ctx.strokeStyle = '#3a2a1e';
            ctx.lineWidth = 7;
            ctx.beginPath();
            ctx.moveTo(playerX - 22, playerY + 12);
            ctx.lineTo(playerX - 42, playerY - 8 + Math.sin(bowCharge / 5) * 12);
            ctx.moveTo(playerX + 22, playerY + 12);
            ctx.lineTo(playerX + 42, playerY - 8 + Math.sin(bowCharge / 5) * 12);
            ctx.stroke();
            
            // Arrow on bow (if charging)
            if (isCharging && bowCharge > 5) {
                ctx.fillStyle = '#e0c080';
                ctx.fillRect(playerX - 38, playerY - 22 + Math.sin(bowCharge / 5) * 8, 16, 7);
            }

            // Aim crosshair
            ctx.strokeStyle = '#ff2222';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(playerAimX - 18, playerAimY);
            ctx.lineTo(playerAimX + 18, playerAimY);
            ctx.moveTo(playerAimX, playerAimY - 18);
            ctx.lineTo(playerAimX, playerAimY + 18);
            ctx.stroke();

            // Health bars for orcs that are attacking wall
            for (let o of orcs) {
                if (!o.alive || !o.isAttackingWall) continue;
                const barWidth = o.width * (o.health / o.maxHealth);
                ctx.fillStyle = '#000000';
                ctx.fillRect(o.x - o.width / 2 - 2, o.y - 42, o.width + 4, 7);
                ctx.fillStyle = '#ff2222';
                ctx.fillRect(o.x - o.width / 2, o.y - 40, barWidth, 4);
            }

            // Update UI
            document.getElementById('waveNum').textContent = currentWave;
            document.getElementById('castleHP').textContent = Math.max(0, Math.floor(castleHP));
            document.getElementById('orcsCount').textContent = orcs.length;

            // Check game over
            if (castleHP <= 0 && gameState === 'playing') {
                gameState = 'gameOver';
                document.getElementById('gameOver').style.display = 'block';
                document.getElementById('finalWave').textContent = currentWave;
                document.getElementById('finalSlain').textContent = orcsSlain;
                playSound('death');
            }

            // Check victory
            if (currentWave >= 12 && orcs.length === 0 && gameState === 'playing') {
                gameState = 'victory';
                document.getElementById('victory').style.display = 'block';
                document.getElementById('finalWave2').textContent = currentWave;
                document.getElementById('finalSlain2').textContent = orcsSlain;
                document.getElementById('finalGold2').textContent = gold;
                playSound('victory');
            }

            requestAnimationFrame(gameLoop);
        }

        // Input handling
        function handleInput() {
            // Keyboard
            window.addEventListener('keydown', e => {
                keys[e.key.toLowerCase()] = true;
                if (e.key === ' ' && gameState === 'playing') {
                    mouseDown = true;
                    isCharging = true;
                    bowCharge = 0;
                }
            });
            
            window.addEventListener('keyup', e => {
                keys[e.key.toLowerCase()] = false;
                if (e.key === ' ' && gameState === 'playing') {
                    mouseDown = false;
                    isCharging = false;
                    if (bowCharge > 12) shootArrow();
                    bowCharge = 0;
                }
            });

            // Mouse
            canvas.addEventListener('mousemove', e => {
                const rect = canvas.getBoundingClientRect();
                playerAimX = e.clientX - rect.left;
                playerAimY = e.clientY - rect.top;
            });

            canvas.addEventListener('mousedown', e => {
                if (gameState !== 'playing') return;
                if (e.button === 0) {
                    mouseDown = true;
                    isCharging = true;
                    bowCharge = 0;
                }
            });

            canvas.addEventListener('mouseup', e => {
                if (gameState !== 'playing') return;
                if (e.button === 0) {
                    mouseDown = false;
                    isCharging = false;
                    if (bowCharge > 12) shootArrow();
                    bowCharge = 0;
                }
            });

            // Touch support
            canvas.addEventListener('touchstart', e => {
                e.preventDefault();
                const touch = e.touches[0];
                const rect = canvas.getBoundingClientRect();
                playerAimX = touch.clientX - rect.left;
                playerAimY = touch.clientY - rect.top;
                mouseDown = true;
                isCharging = true;
                bowCharge = 0;
            });

            canvas.addEventListener('touchmove', e => {
                e.preventDefault();
                const touch = e.touches[0];
                const rect = canvas.getBoundingClientRect();
                playerAimX = touch.clientX - rect.left;
                playerAimY = touch.clientY - rect.top;
            });

            canvas.addEventListener('touchend', e => {
                e.preventDefault();
                mouseDown = false;
                isCharging = false;
                if (bowCharge > 12) shootArrow();
                bowCharge = 0;
            });
        }

        function shootArrow() {
            const dx = playerAimX - playerX;
            const dy = playerAimY - (GROUND_Y - 110);
            const dist = Math.hypot(dx, dy);
            const speed = 14;
            
            const vx = (dx / dist) * speed;
            const vy = (dy / dist) * speed;
            
            arrows.push(new Arrow(playerX - 18, GROUND_Y - 95, playerAimX, playerAimY));
            playSound('shoot');
        }

        // Wave system
        function startWave() {
            playSound('waveStart');
            document.getElementById('waveNum').textContent = currentWave;
            
            // Spawn orcs based on wave
            const base = 8 + currentWave * 5;
            const fast = Math.floor(currentWave * 1.2);
            const heavy = Math.floor(currentWave * 0.8);
            const elite = Math.floor(currentWave * 0.6);
            
            for (let i = 0; i < base; i++) {
                setTimeout(() => {
                    if (gameState === 'playing') spawnOrc('normal');
                }, i * 180);
            }
            for (let i = 0; i < fast; i++) {
                setTimeout(() => {
                    if (gameState === 'playing') spawnOrc('fast');
                }, i * 180 + 60);
            }
            for (let i = 0; i < heavy; i++) {
                setTimeout(() => {
                    if (gameState === 'playing') spawnOrc('heavy');
                }, i * 180 + 120);
            }
            for (let i = 0; i < elite; i++) {
                setTimeout(() => {
                    if (gameState === 'playing') spawnOrc('elite');
                }, i * 180 + 200);
            }
        }

        // Main game loop logic
        function updateGame() {
            if (gameState !== 'playing') return;

            // Movement
            if (keys['a'] || keys['arrowleft']) playerX = Math.max(80, playerX - 4.5);
            if (keys['d'] || keys['arrowright']) playerX = Math.min(WIDTH - 80, playerX + 4.5);

            // Aim smoothing
            if (Date.now() - lastAimUpdate > 18) {
                playerAimX = playerX + (playerAimX - playerX) * 0.35;
                lastAimUpdate = Date.now();
            }

            // Charging
            if (isCharging) {
                bowCharge = Math.min(40, bowCharge + 1.8);
            }

            // Castle damage over time if orcs are attacking
            let wallAttackCount = 0;
            for (let o of orcs) {
                if (o.isAttackingWall) wallAttackCount++;
            }
            if (wallAttackCount > 0) {
                castleHP -= 0.65 * wallAttackCount;
                if (castleHP < 0) castleHP = 0;
            }

            // Spawn next wave
            if (orcs.length === 0 && gameState === 'playing') {
                currentWave++;
                if (currentWave > 12) {
                    gameState = 'victory';
                    document.getElementById('victory').style.display = 'block';
                    document.getElementById('finalWave2').textContent = currentWave - 1;
                    document.getElementById('finalSlain2').textContent = orcsSlain;
                    document.getElementById('finalGold2').textContent = gold;
                } else {
                    startWave();
                }
            }
        }

        // Animation loop
        function animate() {
            updateGame();
            gameLoop();
        }

        // Start game
        function startGame() {
            castleHP = 1000;
            currentWave = 1;
            orcsSlain = 0;
            gold = 0;
            gameState = 'playing';
            document.getElementById('gameOver').style.display = 'none';
            document.getElementById('victory').style.display = 'none';
            
            playerX = WIDTH / 2;
            playerAimX = WIDTH / 2;
            arrows = [];
            orcs = [];
            particles = [];
            createCastle();
            createTrees();
            
            // First wave immediately
            setTimeout(() => {
                if (gameState === 'playing') startWave();
            }, 300);
        }

        window.restartGame = function() {
            startGame();
        };

        // Initialize
        function init() {
            initAudio();
            startGame();
            handleInput();
            animate();
        }

        window.onload = init;
    </script>
</body>
</html>
