!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Последний лучник</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080b0d;color:#eee;font-family:Georgia,serif;overflow:hidden}button{font:inherit;color:#f4ead2;background:#3b271c;border:1px solid #ad7b43;padding:12px 22px;cursor:pointer;box-shadow:0 0 14px #000}button:hover{background:#62402a}.screen{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 35%,#25362c,#090c0d 70%);z-index:5}.panel{text-align:center;max-width:720px;padding:42px;background:#11171aeb;border:1px solid #775331;box-shadow:0 0 70px #000}.panel h1{font-size:clamp(38px,7vw,82px);margin:0 0 12px;color:#c69453;text-shadow:0 3px 15px #000}.panel p{color:#c1c3b4;line-height:1.6}.hidden{display:none!important}#game{height:100vh;position:relative;background:linear-gradient(#111923 0 26%,#182921 26% 100%);user-select:none}.hud{position:absolute;z-index:3;left:0;right:0;top:0;height:62px;padding:10px 18px;display:flex;justify-content:space-between;align-items:center;background:#090b0dcc;border-bottom:1px solid #72512d;font-weight:bold;color:#e8d4a4}.bar{width:150px;height:12px;border:1px solid #9b7650;background:#1b1110;display:inline-block;margin-left:7px}.bar i{display:block;height:100%;background:#a4362b;width:100%}.stat{margin:0 10px}.wall{position:absolute;z-index:1;top:62px;left:0;right:0;height:29%;min-height:180px;background:repeating-linear-gradient(0deg,transparent 0 32px,#3a3d3b 33px 35px),repeating-linear-gradient(90deg,#4c4d48 0 82px,#292d2d 83px 87px);border-top:18px solid #202626;box-shadow:0 15px 25px #000}.cren{position:absolute;top:-34px;left:0;right:0;height:35px;background:repeating-linear-gradient(90deg,#343b38 0 44px,transparent 44px 63px);filter:drop-shadow(0 -2px 1px #000)}.tower{position:absolute;top:-58px;width:100px;height:100px;background:#333a37;border:8px solid #1f2525}.tower.l{left:2%}.tower.r{right:2%}.torch{position:absolute;color:#ffb33c;font-size:24px;filter:drop-shadow(0 0 14px #ff8c18);animation:flick 0.4s infinite alternate}.t1{left:18%;top:45px}.t2{right:18%;top:45px}@keyframes flick{to{transform:scale(1.2);color:#ffd37b}}#archer{position:absolute;z-index:4;top:calc(62px + 29% - 76px);left:50%;width:60px;height:78px;transform:translateX(-50%);transition:left .05s;pointer-events:none}.hood{position:absolute;left:13px;top:0;width:36px;height:40px;border-radius:50% 50% 42% 42%;background:#171a1b;border:3px solid #55524a}.body{position:absolute;left:10px;top:34px;width:42px;height:44px;background:#292525;border:3px solid #62503c;border-radius:12px 12px 4px 4px}.bow{position:absolute;left:-9px;top:29px;width:44px;height:52px;border-left:3px solid #b6844d;border-radius:50%}.bow:after{content:'';position:absolute;left:0;top:0;height:51px;border-left:1px solid #ddd}.arrow{position:absolute;width:5px;height:22px;background:#c9b58a;border-radius:3px;z-index:5}.forest{position:absolute;inset:calc(62px + 29%) 0 0;background:linear-gradient(#1c342c,#0a1715 55%,#080e10);overflow:hidden}.forest:before{content:'☁  ☁    ☁      ☁    ☁';position:absolute;inset:15% 0;background:radial-gradient(ellipse,#c8d3bd28 0 12%,transparent 35%);color:#c6d8c466;font-size:44px;letter-spacing:28px;filter:blur(8px)}.trees{position:absolute;inset:0;color:#0b211b;font-size:clamp(48px,9vw,120px);line-height:1.1;letter-spacing:12px;opacity:.9}.path{position:absolute;bottom:-8%;left:37%;width:26%;height:120%;background:#3b3025;clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);opacity:.9}.path:after{content:'✦   ✧     ✦       ✧';position:absolute;inset:25% 0;color:#716148;letter-spacing:15px}.enemy{position:absolute;z-index:2;width:42px;height:55px;transform:translate(-50%,-50%);text-align:center;font-size:31px;filter:drop-shadow(0 4px 2px #000)}.enemy .hp{position:absolute;top:-8px;left:0;width:42px;height:5px;background:#280b0b;border:1px solid #9c7761}.enemy .hp i{display:block;background:#a7332a;height:100%}.enemy small{display:block;font:10px Arial;color:#e8c873}.proj{position:absolute;z-index:5;width:30px;height:4px;background:#d4bb80;transform-origin:left center;box-shadow:0 0 5px #ffd27a}.toast{position:absolute;z-index:6;top:70px;left:50%;transform:translateX(-50%);background:#171b18dd;border:1px solid #987044;padding:9px 18px}.shop{position:absolute;z-index:4;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.shop button{font-size:13px;padding:8px 10px}.overlay{position:absolute;z-index:7;inset:0;display:grid;place-items:center;background:#050706bb}.overlay .box{background:#121817;border:1px solid #a17345;padding:30px;text-align:center;min-width:300px}.waveinfo{position:absolute;z-index:4;top:75px;right:18px;color:#d8c08a;text-align:right}
</style></head><body>
<div id="menu" class="screen"><div class="panel"><h1>ПОСЛЕДНИЙ ЛУЧНИК</h1><p>Ночь поглотила древний лес. Орда уже слышна у стен.<br>Ты — последний защитник крепости.</p><button id="start">Начать игру</button><p>← → перемещение · пробел / клик — стрелять</p></div></div>
<div id="game" class="hidden"><div class="hud"><span>WAVE: <b id="wave">1</b></span><span class="stat">🏰 WALL <b id="wallText">100/100</b><i class="bar"><i id="wallBar"></i></i></span><span>💰 <b id="gold">0</b></span><span>👹 <b id="left">0</b></span></div><div class="wall"><div class="cren"></div><div class="tower l"></div><div class="tower r"></div><div class="torch t1">🔥</div><div class="torch t2">🔥</div></div><div class="forest"><div class="trees">♣ ♣  ♠  ♣ ♣  ♠  ♣ ♣<br>♠  ♣   ♣  ♠ ♣  ♣  ♠<br>♣  ♠ ♣  ♣ ♠  ♣ ♣</div><div class="path"></div></div><div id="archer"><div class="hood"></div><div class="body"></div><div class="bow"></div></div><div id="toast" class="toast">WAVE 1</div><div id="waveinfo" class="waveinfo"></div><div class="shop"><button data-up="damage">Урон + <span>50</span>💰</button><button data-up="speed">Скорострельность + <span>60</span>💰</button><button data-up="wall">Стена +25 <span>80</span>💰</button><button data-up="fire">Огненные стрелы <span>140</span>💰</button></div><div id="end" class="overlay hidden"><div class="box"><h2 id="endTitle"></h2><p id="endText"></p><button id="restart">Начать заново</button></div></div></div>
<script>
const $=s=>document.querySelector(s), game=$('#game'), archer=$('#archer');let keys={},x=.5,wall=100,maxWall=100,gold=0,wave=0,damage=25,cool=430,lastShot=0,fire=false,enemies=[],arrows=[],running=false,spawned=0,total=0,last=0;
const types={normal:{name:'Обычные орки',hp:55,speed:22,reward:12,icon:'👹'},fast:{name:'Быстрые орки',hp:30,speed:38,reward:15,icon:'👺'},heavy:{name:'Тяжёлые орки',hp:150,speed:12,reward:30,icon:'👿'},shield:{name:'Щитоносцы',hp:100,speed:17,reward:25,icon:'🛡️'}};
function start(){ $('#menu').classList.add('hidden');game.classList.remove('hidden');reset();nextWave();requestAnimationFrame(loop)}
function reset(){wall=100;maxWall=100;gold=0;wave=0;damage=25;cool=430;fire=false;enemies=[];arrows=[];running=true;x=.5;update()}
function nextWave(){wave++;spawned=0;total=7+wave*3;let list=['Обычные орки'];if(wave>=2)list.push('Быстрые орки');if(wave>=3)list.push('Тяжёлые орки');if(wave>=4)list.push('Щитоносцы');$('#waveinfo').innerHTML='Следующая волна: '+total+'<br>'+list.join(' · ');toast('WAVE '+wave+' — '+total+' врагов');setTimeout(()=>spawn(),900)}
function spawn(){if(!running||spawned>=total)return;let r=Math.random(),type=wave>=4&&r<.16?'shield':wave>=3&&r<.35?'heavy':wave>=2&&r<.55?'fast':'normal';let e={type, x:.2+Math.random()*.6,y:1.03,hp:types[type].hp,max:types[type].hp,attack:0,el:null};e.el=document.createElement('div');e.el.className='enemy';e.el.innerHTML=types[type].icon+'<div class="hp"><i></i></div>';$('.forest').append(e.el);enemies.push(e);spawned++;setTimeout(spawn,Math.max(260,900-wave*45))}
function shoot(){if(!running||performance.now()-lastShot<cool)return;lastShot=performance.now();let a=document.createElement('div');a.className='proj';let sx=archer.offsetLeft+30,sy=archer.offsetTop+30;let target=enemies.filter(e=>e.y<.98).sort((a,b)=>b.y-a.y)[0];if(!target)return;let ex=target.x*innerWidth,ey=target.y*$('.forest').clientHeight+$('.forest').offsetTop;a.style.left=sx+'px';a.style.top=sy+'px';a.dataset.tx=ex;a.dataset.ty=ey;a.dataset.vx=(ex-sx)/420;a.dataset.vy=(ey-sy)/420;a.dataset.damage=damage;game.append(a);arrows.push(a)}
function update(){x=Math.max(.08,Math.min(.92,x));archer.style.left=(x*100)+'%';$('#wallText').textContent=Math.max(0,Math.ceil(wall))+'/'+maxWall;$('#wallBar').style.width=Math.max(0,wall/maxWall*100)+'%';$('#gold').textContent=gold;$('#wave').textContent=wave;$('#left').textContent=enemies.length+(total-spawned);document.querySelectorAll('[data-up] span').forEach((s,i)=>s.textContent=[50+Math.max(0,wave-1)*3,60+Math.max(0,wave-1)*4,80,140][i])}
function loop(t){if(!running)return;let dt=Math.min(40,t-last||16);last=t; if(keys.ArrowLeft)x-=dt*.00035;if(keys.ArrowRight)x+=dt*.00035;if(keys[' '])shoot();let forest=$('.forest'),fh=forest.clientHeight;arrows.forEach((a,i)=>{let px=parseFloat(a.style.left)+(+a.dataset.vx)*dt,py=parseFloat(a.style.top)+(+a.dataset.vy)*dt;a.style.left=px+'px';a.style.top=py+'px';a.style.transform='rotate('+Math.atan2(+a.dataset.vy,+a.dataset.vx)+'rad)';let hit=enemies.find(e=>Math.hypot(e.x*innerWidth-px,e.y*fh+forest.offsetTop-py)<30);if(hit){let d=+a.dataset.damage;if(hit.type==='shield')d*=.45;hit.hp-=d;if(fire)hit.hp-=12; a.remove();arrows.splice(i,1);if(hit.hp<=0){gold+=types[hit.type].reward;hit.el.remove();enemies.splice(enemies.indexOf(hit),1)}}else if(px<0||px>innerWidth||py<50||py>innerHeight){a.remove();arrows.splice(i,1)}});enemies.forEach(e=>{e.y-=types[e.type].speed*dt/100000;e.el.style.left=(e.x*100)+'%';e.el.style.top=(e.y*100)+'%';e.el.querySelector('i').style.width=(e.hp/e.max*100)+'%';if(e.y<.04){e.attack+=dt;if(e.attack>850){wall-=types[e.type]==='heavy'?5:2;e.attack=0}}});if(wall<=0)return end(false);if(spawned===total&&enemies.length===0){gold+=35+wave*8;nextWave()}update();requestAnimationFrame(loop)}
function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),1800)}
